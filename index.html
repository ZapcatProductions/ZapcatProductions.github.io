<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Gen-1 Pokémon 12x12 — Fixed</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#eaf2ff}
#titleScreen{position:fixed;inset:0;background:rgba(3,6,12,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:16px}
#gameWrapper{display:none;gap:20px;padding:28px;align-items:flex-start;display:flex}
main#grid{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:40px;gap:2px}
ins,del{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase;position:relative}
del{background:#000}
ins{background:#fff;color:#071322;border:1px solid #9aa3b2;cursor:text}
ins[data-clue]:before{content:attr(data-clue);position:absolute;top:2px;left:4px;font-size:10px;color:#333}
.highlight{background:#d8efff!important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3!important}
#panelWrapper{width:300px}
ul{list-style:none;padding:0;margin:0}
li.heading{font-weight:800;margin:8px 0}
li[data-clue]{padding:8px;border-radius:6px;cursor:pointer}
li.current{background:rgba(58,141,255,.08);color:var(--accent)}
#timer{margin-bottom:12px}
label{display:flex;align-items:center;gap:8px;font-size:14px}
</style>
</head>
<body>

<!-- START OVERLAY -->
<div id="titleScreen" role="dialog" aria-modal="true">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 — fixed layout</p>
  <button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="gameWrapper" aria-hidden="true">
  <div>
    <div id="timer">Time: 0:00</div>

    <!-- GRID: 12x12. Each row has 12 elements (ins or del) -->
    <main id="grid" aria-label="crossword grid">

      <!-- ROW 0 (index 0) ALAKAZAM across cols0-7; down starts at cols9-11 -->
      <ins data-clues="across-1" data-clue="1" data-answer="A"></ins><!--0,0-->
      <ins data-clues="across-1" data-answer="L"></ins><!--0,1-->
      <ins data-clues="across-1" data-answer="A"></ins><!--0,2-->
      <ins data-clues="across-1" data-answer="K"></ins><!--0,3-->
      <ins data-clues="across-1" data-answer="A"></ins><!--0,4-->
      <ins data-clues="across-1" data-answer="Z"></ins><!--0,5-->
      <ins data-clues="across-1" data-answer="A"></ins><!--0,6-->
      <ins data-clues="across-1" data-answer="M"></ins><!--0,7-->
      <del></del><!--0,8-->
      <ins data-clues="down-5" data-clue="5" data-answer="A"></ins><!--0,9 ABRA-->
      <ins data-clues="down-6" data-clue="6" data-answer="A"></ins><!--0,10 ARBOK-->
      <ins data-clues="down-7" data-clue="7" data-answer="M"></ins><!--0,11 MEW down-->

      <!-- ROW 1 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <del></del
      ><ins data-clues="down-5" data-answer="B"></ins><!--1,9-->
      <ins data-clues="down-6" data-answer="R"></ins><!--1,10-->
      <ins data-clues="down-7" data-answer="E"></ins><!--1,11-->

      <!-- ROW 2 EKANS across cols0-4; ONIX down starts at col7 rows2-5 -->
      <ins data-clues="across-2" data-clue="2" data-answer="E"></ins><!--2,0-->
      <ins data-clues="across-2" data-answer="K"></ins><!--2,1-->
      <ins data-clues="across-2" data-answer="A"></ins><!--2,2-->
      <ins data-clues="across-2" data-answer="N"></ins><!--2,3-->
      <ins data-clues="across-2" data-answer="S"></ins><!--2,4-->
      <del></del><del></del>
      <ins data-clues="down-8" data-clue="8" data-answer="O"></ins><!--2,7 ONIX-->
      <del></del
      ><ins data-clues="down-5" data-answer="R"></ins><!--2,9-->
      <ins data-clues="down-6" data-answer="B"></ins><!--2,10-->
      <ins data-clues="down-7" data-answer="W"></ins><!--2,11-->

      <!-- ROW 3 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-8" data-answer="N"></ins><!--3,7-->
      <del></del>
      <ins data-clues="down-5" data-answer="A"></ins><!--3,9-->
      <ins data-clues="down-6" data-answer="O"></ins><!--3,10-->
      <del></del>

      <!-- ROW 4 MEW across cols0-2 -->
      <ins data-clues="across-3" data-clue="3" data-answer="M"></ins><!--4,0-->
      <ins data-clues="across-3" data-answer="E"></ins><!--4,1-->
      <ins data-clues="across-3,down-7" data-answer="W"></ins><!--4,2 intersects down-7? none but kept only down where needed-->
      <del></del><del></del><del></del><del></del>
      <ins data-clues="down-8" data-answer="I"></ins><!--4,7-->
      <del></del><del></del><ins data-clues="down-6" data-answer="K"></ins><!--4,10-->
      <del></del>

      <!-- ROW 5 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-8" data-answer="X"></ins><!--5,7-->
      <del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 6 SNEASEL across cols0-6 -->
      <ins data-clues="across-4" data-clue="4" data-answer="S"></ins><!--6,0-->
      <ins data-clues="across-4" data-answer="N"></ins><!--6,1-->
      <ins data-clues="across-4" data-answer="E"></ins><!--6,2-->
      <ins data-clues="across-4" data-answer="A"></ins><!--6,3-->
      <ins data-clues="across-4" data-answer="S"></ins><!--6,4-->
      <ins data-clues="across-4" data-answer="E"></ins><!--6,5-->
      <ins data-clues="across-4" data-answer="L"></ins><!--6,6-->
      <del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 7 all blacks -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 8 all blacks -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 9 all blacks -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 10 all blacks -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 11 all blacks -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

    </main>
  </div>

  <div id="panelWrapper">
    <div id="timer">Time: 0:00</div>
    <label><input type="checkbox" id="errorToggle" checked> Error check</label>

    <div style="margin-top:12px">
      <ul id="across">
        <li class="heading">Across</li>
        <li data-dir="across" data-clue="1" data-length="8">1. ALAKAZAM</li>
        <li data-dir="across" data-clue="2" data-length="5">2. EKANS</li>
        <li data-dir="across" data-clue="3" data-length="3">3. MEW</li>
        <li data-dir="across" data-clue="4" data-length="7">4. SNEASEL</li>
      </ul>

      <ul id="down" style="margin-top:12px">
        <li class="heading">Down</li>
        <li data-dir="down" data-clue="5" data-length="4">5. ABRA</li>
        <li data-dir="down" data-clue="6" data-length="5">6. ARBOK</li>
        <li data-dir="down" data-clue="7" data-length="3">7. MEW</li>
        <li data-dir="down" data-clue="8" data-length="4">8. ONIX</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* START + TIMER */
const startBtn=document.getElementById('startBtn');
const titleScreen=document.getElementById('titleScreen');
const gameWrapper=document.getElementById('gameWrapper');
const panelTimer=document.querySelector('#panelWrapper #timer');
let seconds=0, timerInterval;
startBtn.addEventListener('click', ()=>{
  titleScreen.style.display='none';
  gameWrapper.style.display='flex';
  gameWrapper.setAttribute('aria-hidden','false');
  seconds=0;
  panelTimer.textContent='Time: 0:00';
  timerInterval=setInterval(()=>{
    seconds++;
    const m=Math.floor(seconds/60), s=seconds%60;
    panelTimer.textContent='Time: '+m+':'+(s<10?'0':'')+s;
  },1000);
});

/* CORE LOGIC */
const cells = Array.from(document.querySelectorAll('main ins'));
const clues = Array.from(document.querySelectorAll('li[data-clue]'));
const errorToggle = document.getElementById('errorToggle');
let state = { clue:null, dir:null, cursor:0 };

/* helpers */
function clearVisual(){ cells.forEach(c=>c.classList.remove('highlight','cursor')); clues.forEach(l=>l.classList.remove('current')) }
function highlight(clueNum, dir){
  clearVisual();
  cells.forEach(c=>{
    if(!c.dataset.clues) return;
    const parts = c.dataset.clues.split(',').map(s=>s.trim());
    for(const p of parts){
      const [d,n] = p.split('-');
      if(d===dir && +n===+clueNum){ c.classList.add('highlight'); break; }
    }
  });
  state.cursor=0; moveCursor();
}
function moveCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length===0) return;
  const target = highlighted[Math.min(state.cursor, highlighted.length-1)];
  target && target.classList.add('cursor');
}
function checkErrors(){
  if(!errorToggle.checked) return;
  cells.forEach(c=>{
    if(!c.dataset.answer){ c.classList.remove('error'); return; }
    const txt = (c.textContent || '').trim().toUpperCase();
    if(!txt){ c.classList.remove('error'); return; }
    c.classList.toggle('error', txt !== c.dataset.answer);
  });
}

/* clue clicks */
clues.forEach(li=>{
  li.addEventListener('click', function(){
    state.clue = +this.dataset.clue;
    state.dir = this.dataset.dir;
    state.cursor = 0;
    highlight(state.clue, state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    this.classList.add('current');
  });
});

/* cell clicks: pick or toggle clue for that cell */
cells.forEach(cell=>{
  cell.addEventListener('click', ()=>{
    if(!cell.dataset.clues) return;
    const parts = cell.dataset.clues.split(',').map(s=>s.trim());
    let pick = parts[0];
    if(state.clue !== null){
      const currentTag = `${state.dir}-${state.clue}`;
      const idx = parts.indexOf(currentTag);
      if(idx !== -1) pick = parts[(idx+1) % parts.length];
    }
    const [dir,num] = pick.split('-').map(s=>s.trim());
    state.dir = dir; state.clue = +num; state.cursor = 0;
    highlight(state.clue, state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    const li = document.querySelector(`li[data-clue="${num}"][data-dir="${dir}"]`);
    li && li.classList.add('current');
  });
});

/* keyboard input */
document.addEventListener('keydown', e=>{
  if(state.clue === null) return;
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length === 0) return;

  if(e.key === 'ArrowRight' && state.dir === 'across'){ if(state.cursor < highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowLeft'  && state.dir === 'across'){ if(state.cursor > 0) state.cursor--; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowDown'  && state.dir === 'down'  ){ if(state.cursor < highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowUp'    && state.dir === 'down'  ){ if(state.cursor > 0) state.cursor--; moveCursor(); e.preventDefault(); return; }

  if(e.key.length === 1 && /[a-z]/i.test(e.key)){
    const t = highlighted[state.cursor];
    if(t){
      t.textContent = e.key.toUpperCase();
      if(errorToggle.checked && t.dataset.answer) t.classList.toggle('error', t.textContent !== t.dataset.answer);
      else t.classList.remove('error');
    }
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    e.preventDefault(); return;
  }

  if(e.key === 'Backspace'){
    const t = highlighted[state.cursor];
    if(t){ t.textContent = ''; t.classList.remove('error'); }
    if(state.cursor > 0) state.cursor--;
    moveCursor();
    e.preventDefault(); return;
  }
});

/* error toggle */
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) cells.forEach(c=>c.classList.remove('error'));
  else checkErrors();
});
</script>
</body>
</html>
