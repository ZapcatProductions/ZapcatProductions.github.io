<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen-1 Pokémon 12x12 Mini Crossword — Fixed</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#eaf2ff;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:28px}
#titleScreen{position:fixed;inset:0;background:rgba(11,18,32,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
button{background:#3a8dff;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer}
#gameWrapper{display:flex;gap:20px;align-items:flex-start}
main{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:40px;gap:2px;background:transparent}
ins,del{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;text-transform:uppercase}
del{background:#000}
ins{background:#fff;color:#071123;border:1px solid #9aa3b2;position:relative}
ins[data-clue]:before{content:attr(data-clue);position:absolute;top:2px;left:4px;font-size:10px;color:#333}
.highlight{background:#d8f1ff!important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3!important}
#panelWrapper{width:280px}
ul{list-style:none;padding:0;margin:0}
li.heading{font-weight:700;margin:8px 0}
li[data-clue]{cursor:pointer;padding:6px 4px;border-radius:6px}
li.current{background:rgba(58,141,255,.08);color:#3a8dff}
#timer{margin-bottom:12px;text-align:left}
</style>
</head>
<body>

<div id="titleScreen">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 — fixed layout</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameWrapper" style="display:none">
  <div>
    <div id="timer">Time: 0:00</div>
    <main id="grid">
      <!-- ROW 1: ALAKAZAM across cols1-8; down starts at cols10-12 -->
      <ins data-clues="across-1" data-answer="A" data-clue="1"></ins>
      <ins data-clues="across-1" data-answer="L"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="K"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="Z"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="M"></ins>
      <del></del>
      <ins data-clues="down-5" data-answer="A" data-clue="5"></ins>
      <ins data-clues="down-6" data-answer="A" data-clue="6"></ins>
      <ins data-clues="down-7" data-answer="M" data-clue="7"></ins>

      <!-- ROW 2 -->
      <ins data-clues="down-5" data-answer="B"></ins>
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <del></del>
      <ins data-clues="down-5" data-answer="B"></ins>
      <ins data-clues="down-6" data-answer="R"></ins>
      <ins data-clues="down-7" data-answer="A"></ins>

      <!-- ROW 3: EKANS across cols1-5 -->
      <ins data-clues="down-5" data-answer="R"></ins>
      <del></del>
      <ins data-clues="across-2 down-6" data-answer="E" data-clue="2"></ins>
      <ins data-clues="across-2" data-answer="K"></ins>
      <ins data-clues="across-2" data-answer="A"></ins>
      <ins data-clues="across-2" data-answer="N"></ins>
      <ins data-clues="across-2" data-answer="S"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-5" data-answer="R"></ins>
      <ins data-clues="down-6" data-answer="B"></ins>
      <ins data-clues="down-7" data-answer="N"></ins>

      <!-- ROW 4 -->
      <ins data-clues="down-5" data-answer="A"></ins>
      <del></del><del></del>
      <ins data-clues="down-6" data-answer="O"></ins>
      <del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-5" data-answer="A"></ins>
      <del></del><del></del>

      <!-- ROW 5: MEW across cols1-3 -->
      <ins data-clues="down-5" data-answer="A"></ins>
      <del></del><del></del>
      <ins data-clues="down-6" data-answer="B"></ins>
      <del></del>
      <ins data-clues="across-3" data-answer="M" data-clue="3"></ins>
      <ins data-clues="across-3" data-answer="E"></ins>
      <ins data-clues="across-3" data-answer="W"></ins>
      <del></del>
      <del></del><del></del><del></del>

      <!-- ROW 6 -->
      <del></del><del></del>
      <ins data-clues="down-6" data-answer="O"></ins>
      <del></del>
      <ins data-clues="down-6" data-answer="N"></ins>
      <del></del><del></del><del></del><del></del>
      <del></del><del></del><del></del><del></del>

      <!-- ROW 7: SNEASEL across cols1-7 -->
      <del></del><del></del>
      <ins data-clues="across-4" data-answer="S" data-clue="4"></ins>
      <ins data-clues="across-4" data-answer="N"></ins>
      <ins data-clues="across-4" data-answer="E"></ins>
      <ins data-clues="across-4" data-answer="A"></ins>
      <ins data-clues="across-4" data-answer="S"></ins>
      <ins data-clues="across-4" data-answer="E"></ins>
      <ins data-clues="across-4" data-answer="L"></ins>
      <del></del><del></del><del></del>

      <!-- ROW 8 -->
      <del></del><del></del><del></del><del></del><del></del>
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 9 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 10 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 11 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 12 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
    </main>
  </div>

  <div id="panelWrapper">
    <div id="timer">Time: 0:00</div>
    <div class="panels">
      <ul id="across">
        <li class="heading">Across</li>
        <li data-dir="across" data-clue="1" data-length="8">1. ALAKAZAM</li>
        <li data-dir="across" data-clue="2" data-length="5">2. EKANS</li>
        <li data-dir="across" data-clue="3" data-length="3">3. MEW</li>
        <li data-dir="across" data-clue="4" data-length="7">4. SNEASEL</li>
      </ul>

      <ul id="down">
        <li class="heading">Down</li>
        <li data-dir="down" data-clue="5" data-length="4">5. ABRA</li>
        <li data-dir="down" data-clue="6" data-length="5">6. ARBOK</li>
        <li data-dir="down" data-clue="7" data-length="4">7. MANA</li>
        <li data-dir="down" data-clue="8" data-length="4">8. ONIX</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* start + timer */
const startBtn=document.getElementById('startBtn');
const titleScreen=document.getElementById('titleScreen');
const gameWrapper=document.getElementById('gameWrapper');
const timerDisplay=document.querySelectorAll('#timer');
let seconds=0, timerInterval;
startBtn.addEventListener('click',()=>{
  titleScreen.style.display='none';
  gameWrapper.style.display='flex';
  seconds=0;
  document.querySelector('#panelWrapper #timer').textContent='Time: 0:00';
  timerInterval=setInterval(()=>{seconds++; const m=Math.floor(seconds/60); const s=seconds%60; document.querySelector('#panelWrapper #timer').textContent='Time: '+m+':'+(s<10?'0':'')+s;},1000);
});

/* core logic (same approach as yours, using unique clue numbers) */
const cells=Array.from(document.querySelectorAll('main ins'));
const clues=Array.from(document.querySelectorAll('li[data-clue]'));
let state={clue:null,dir:null,cursor:0};

function clearVisual(){cells.forEach(c=>c.classList.remove('highlight','cursor')); clues.forEach(l=>l.classList.remove('current'))}

function highlight(cnum,dir){
  clearVisual();
  cells.forEach(c=>{
    if(!c.dataset.clues) return;
    let map=c.dataset.clues.split(/\s+/);
    map.forEach(m=>{
      const [d,n]=m.split('-');
      if(d===dir && +n===+cnum) c.classList.add('highlight');
    });
  });
  state.cursor=0; moveCursor();
}

function moveCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  const h=cells.filter(c=>c.classList.contains('highlight'));
  if(h[state.cursor]) h[state.cursor].classList.add('cursor');
}

/* click clue items */
clues.forEach(li=>{
  li.addEventListener('click',function(){
    state.clue=+this.dataset.clue;
    state.dir=this.dataset.dir;
    this.classList.add('current');
    highlight(state.clue,state.dir);
    clues.forEach(l=>{ if(l!==this) l.classList.remove('current')});
  });
});

/* click a cell: pick its first clue (no shared cells in this layout) */
cells.forEach(cell=>{
  cell.addEventListener('click',()=>{
    if(!cell.dataset.clues) return;
    const first = cell.dataset.clues.split(/\s+/)[0];
    const [dir, num] = first.split('-');
    state.dir = dir; state.clue = +num; state.cursor = 0;
    highlight(state.clue,state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    const li=document.querySelector('li[data-clue="'+num+'"][data-dir="'+dir+'"]');
    if(li) li.classList.add('current');
  });
});

/* keyboard input */
document.addEventListener('keydown', e=>{
  if(!state.clue) return;
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(!highlighted.length) return;

  if(e.key==='ArrowRight' && state.dir==='across'){ if(state.cursor<highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return;}
  if(e.key==='ArrowLeft' && state.dir==='across'){ if(state.cursor>0) state.cursor--; moveCursor(); e.preventDefault(); return;}
  if(e.key==='ArrowDown' && state.dir==='down'){ if(state.cursor<highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return;}
  if(e.key==='ArrowUp' && state.dir==='down'){ if(state.cursor>0) state.cursor--; moveCursor(); e.preventDefault(); return;}

  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const target = highlighted[state.cursor];
    if(target){
      target.textContent = e.key.toUpperCase();
      target.classList.toggle('error', target.dataset.answer && target.textContent !== target.dataset.answer);
    }
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    e.preventDefault();
  }

  if(e.key==='Backspace'){
    const target = highlighted[state.cursor];
    if(target){ target.textContent=''; target.classList.remove('error'); }
    if(state.cursor>0) state.cursor--;
    moveCursor();
    e.preventDefault();
  }
});
</script>
</body>
</html>
