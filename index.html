<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --grey:#e0e0e0;
  --blue:#cfe3ff;
  --white:#ffffff;
  --red:#ffb3b3;
}

body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f2f2f2;
}

/* ===== TOP BAR ===== */
#topbar{
  height:48px;
  background:#9ac57a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  font-weight:600;
}

/* ===== SETTINGS ===== */
#settingsBtn{cursor:pointer}
#settings{
  display:none;
  position:fixed;
  top:56px;
  right:16px;
  background:white;
  border:1px solid #ccc;
  padding:12px;
  z-index:10;
}

/* ===== ACTIVE CLUE ===== */
#active-clue{
  background:white;
  padding:10px;
  border-bottom:1px solid #ccc;
  font-size:14px;
}

/* ===== LAYOUT ===== */
#game{
  display:grid;
  grid-template-columns:auto 320px;
  gap:16px;
  padding:16px;
  max-width:900px;
  margin:auto;
}

/* ===== GRID ===== */
#grid{
  display:grid;
  grid-template-columns:repeat(5,48px);
  gap:2px;
  background:black;
}

.cell{
  width:48px;
  height:48px;
  background:var(--grey);
  position:relative;
}

.cell.block{background:black}

.cell.active{background:var(--blue)}
.cell.complete{background:var(--white)}
.cell.error{background:var(--red)}

.cell input{
  width:100%;
  height:100%;
  border:none;
  background:transparent;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  text-transform:uppercase;
}

.cell input:focus{outline:none}

.number{
  position:absolute;
  top:3px;
  left:4px;
  font-size:9px;
  font-weight:600;
  pointer-events:none;
}

/* ===== CLUES ===== */
#clues{
  background:white;
  border:1px solid #ccc;
  padding:12px;
}

.clue{cursor:pointer;padding:4px}
.clue.active{background:var(--blue)}
</style>
</head>

<body>

<div id="topbar">
  <div id="timer">00:00</div>
  <div id="settingsBtn">⚙️</div>
</div>

<div id="settings">
  <label><input type="checkbox" id="errorCheck"> Error check mode</label>
</div>

<div id="active-clue"></div>

<div id="game">
  <div id="grid"></div>
  <div id="clues">
    <h3>Across</h3>
    <div class="clue" data-number="1">1. Learned</div>
    <div class="clue" data-number="5">5. Reader pause</div>
    <h3>Down</h3>
    <div class="clue" data-number="1">1. Puts down</div>
    <div class="clue" data-number="2">2. Eat</div>
  </div>
</div>

<script>
/* ===== TIMER ===== */
let t=0;
setInterval(()=>{
  t++;
  timer.textContent=
    String(Math.floor(t/60)).padStart(2,'0')+':' +
    String(t%60).padStart(2,'0');
},1000);

/* ===== GRID DATA ===== */
const gridData=[
 ['L','E','A','R','N'],
 ['A',null,'E',null,'A'],
 ['Y','O','U','R','E']
];

const clues={
 '1_across':[[0,0],[0,1],[0,2],[0,3],[0,4]],
 '5_across':[[2,0],[2,1],[2,2],[2,3],[2,4]],
 '1_down':[[0,0],[1,0],[2,0]],
 '2_down':[[0,2],[1,2],[2,2]]
};

const numbers={'0,0':1,'2,0':5,'0,2':2};

const grid=document.getElementById('grid');
const cells=[];

/* ===== BUILD GRID ===== */
for(let r=0;r<3;r++){
  cells[r]=[];
  for(let c=0;c<5;c++){
    const cell=document.createElement('div');
    cell.className='cell';

    if(gridData[r][c]==null){
      cell.classList.add('block');
    }else{
      const input=document.createElement('input');
      input.maxLength=1;
      cell.appendChild(input);

      const k=`${r},${c}`;
      if(numbers[k]){
        const n=document.createElement('div');
        n.className='number';
        n.textContent=numbers[k];
        cell.appendChild(n);
      }

      input.onfocus=()=>selectTile(r,c);
      input.oninput=()=>handleInput(r,c,input,cell);
    }

    grid.appendChild(cell);
    cells[r][c]=cell;
  }
}

/* ===== STATE ===== */
let activeNumber=1;
let activeDir='across';

/* ===== HELPERS ===== */
function keyFor(num,dir){return `${num}_${dir}`}

function activate(num,dir){
  activeNumber=num;
  activeDir=dir;

  document.querySelectorAll('.cell').forEach(c=>{
    c.classList.remove('active','complete');
  });
  document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));

  const key=keyFor(num,dir);
  clues[key].forEach(([r,c])=>cells[r][c].classList.add('active'));

  document.querySelectorAll(`.clue[data-number="${num}"]`)
    .forEach(c=>c.classList.add('active'));

  activeClue.textContent=
    (dir==='across'?'Across ':'Down ')+num;
}

/* ===== TILE CLICK ===== */
function selectTile(r,c){
  const matches=[];
  for(const k in clues){
    if(clues[k].some(p=>p[0]==r&&p[1]==c)) matches.push(k);
  }
  if(!matches.length)return;

  const current=keyFor(activeNumber,activeDir);
  if(matches.includes(current)){
    const other=matches.find(k=>k!==current);
    if(other){
      const [n,d]=other.split('_');
      activate(Number(n),d);
    }
  }else{
    const [n,d]=matches[0].split('_');
    activate(Number(n),d);
  }
}

/* ===== CLUE CLICK (TRUE TOGGLE) ===== */
document.querySelectorAll('.clue').forEach(clue=>{
  clue.onclick=()=>{
    const num=Number(clue.dataset.number);
    if(num===activeNumber){
      activate(num,activeDir==='across'?'down':'across');
    }else{
      activate(num,'across');
    }
  };
});

/* ===== INPUT / ERROR CHECK ===== */
function handleInput(r,c,input,cell){
  cell.classList.remove('error');

  if(!input.value)return;

  if(errorCheck.checked){
    if(input.value.toUpperCase()!==gridData[r][c]){
      cell.classList.add('error');
    }
  }
  checkComplete();
}

/* ===== WORD COMPLETE ===== */
function checkComplete(){
  const key=keyFor(activeNumber,activeDir);
  const done=clues[key].every(([r,c])=>{
    const i=cells[r][c].querySelector('input');
    return i && i.value.toUpperCase()===gridData[r][c];
  });
  clues[key].forEach(([r,c])=>{
    cells[r][c].classList.toggle('complete',done);
  });
}

/* ===== SETTINGS ===== */
settingsBtn.onclick=()=>{
  settings.style.display=settings.style.display==='block'?'none':'block';
};

/* ===== START ===== */
activate(1,'across');
</script>

</body>
</html>
