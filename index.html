<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen-1 Pokémon 10x10 Mini Crossword</title>
<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #0b1220;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
#titleScreen, #winScreen {
  position: absolute;
  top:0; left:0; right:0; bottom:0;
  background: rgba(11,18,32,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}
button {
  padding: 10px 25px;
  border-radius: 8px;
  border: none;
  font-size: 18px;
  cursor: pointer;
  background: #3a8dff;
  color: white;
}
button:hover { filter: brightness(1.15); }
#gameWrapper { max-width: 700px; width: 100%; text-align: center; }
h1 { text-align: center; margin: 10px 0; }
#timer { margin-bottom: 10px; font-size: 18px; }
main {
  display: grid;
  grid-template-columns: repeat(10, 40px);
  grid-template-rows: repeat(10, 40px);
  gap: 2px;
  justify-content: center;
  margin: 0 auto;
}
ins, del {
  border-radius: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  text-transform: uppercase;
  cursor: text;
  position: relative;
}
del { background: black; }
ins { background: white; border: 1px solid #666; color: black; }
ins[data-clue]:before {
  content: attr(data-clue);
  position: absolute;
  top: 1px;
  left: 2px;
  font-size: 10px;
  color: #333;
}
.highlight { background: #d8f1ff !important; }
.cursor { box-shadow: inset 0 0 0 3px #3399ff; }
.error { background: #ffb3b3 !important; }
.panels { display: flex; justify-content: center; gap: 40px; margin-top: 15px; }
ul { list-style: none; padding: 0; }
li.heading { font-weight: bold; margin-bottom: 5px; }
li[data-clue] { padding: 2px 0; cursor: pointer; }
li.current { color: #7cc8ff; }
</style>
</head>
<body>

<div id="titleScreen">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>10×10 Mini Crossword — 8 Pokémon</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="winScreen" style="display:none;">
  <h1>🎉 You Won! 🎉</h1>
  <p id="finalTime"></p>
  <button id="restartBtn">Restart Game</button>
</div>

<div id="gameWrapper">
<h1>Gen-1 Pokémon Crossword</h1>
<div id="timer">Time: 0:00</div>

<main id="grid">
<!-- 10x10 grid -->
<!-- Black tiles are <del></del>, letters are <ins> -->
<!-- Across: 1. Abra, 2. Eevee, 3. Sneasel, 4. Onix -->
<!-- Down: 1. Alakazam, 2. Pikachu, 3. Charmander, 4. Squirtle -->

<!-- Row 1 -->
<ins data-clues="across-1,down-1" data-answer="A" data-clue="1"></ins>
<ins data-clues="across-1" data-answer="B"></ins>
<ins data-clues="across-1" data-answer="R"></ins>
<ins data-clues="across-1" data-answer="A"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del>

<!-- Row 2 -->
<ins data-clues="down-1" data-answer="L"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2,across-2" data-answer="E" data-clue="2"></ins>
<ins data-clues="across-2" data-answer="E"></ins>
<ins data-clues="across-2" data-answer="V"></ins>
<ins data-clues="across-2" data-answer="E"></ins>
<ins data-clues="across-2" data-answer="E"></ins>
<del></del><del></del>

<!-- Row 3 -->
<ins data-clues="down-1" data-answer="A"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="V"></ins>
<del></del><ins data-clues="down-3,across-3" data-answer="S" data-clue="3"></ins>
<ins data-clues="across-3" data-answer="N"></ins>
<ins data-clues="across-3" data-answer="E"></ins>
<ins data-clues="across-3" data-answer="A"></ins>
<ins data-clues="across-3" data-answer="S"></ins>
<del></del>

<!-- Row 4 -->
<ins data-clues="down-1" data-answer="K"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="E"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="E"></ins>
<del></del><ins data-clues="down-4,across-4" data-answer="O" data-clue="4"></ins>
<ins data-clues="across-4" data-answer="N"></ins>

<!-- Row 5 -->
<ins data-clues="down-1" data-answer="A"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="E"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="A"></ins>
<del></del><ins data-clues="down-4" data-answer="N"></ins>
<del></del>

<!-- Row 6 -->
<ins data-clues="down-1" data-answer="Z"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="E"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="L"></ins>
<del></del><ins data-clues="down-4" data-answer="I"></ins>
<del></del>

<!-- Row 7 -->
<ins data-clues="down-1" data-answer="A"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="V"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="I"></ins>
<del></del><ins data-clues="down-4" data-answer="X"></ins>
<del></del>

<!-- Row 8 -->
<ins data-clues="down-1" data-answer="M"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="E"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="L"></ins>
<del></del><ins data-clues="down-4" data-answer="I"></ins>
<del></del>

<!-- Row 9 -->
<ins data-clues="down-1" data-answer="A"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="R"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="D"></ins>
<del></del><ins data-clues="down-4" data-answer="O"></ins>
<del></del>

<!-- Row 10 -->
<ins data-clues="down-1" data-answer="M"></ins>
<del></del><del></del><del></del>
<ins data-clues="down-2" data-answer="A"></ins>
<del></del><del></del><ins data-clues="down-3" data-answer="R"></ins>
<del></del><ins data-clues="down-4" data-answer="X"></ins>
<del></del>

</main>

<div class="panels">
<ul id="across">
<li class="heading">Across</li>
<li data-dir="across" data-clue="1" data-length="4">1. Abra</li>
<li data-dir="across" data-clue="2" data-length="5">2. Eevee</li>
<li data-dir="across" data-clue="3" data-length="6">3. Sneasel</li>
<li data-dir="across" data-clue="4" data-length="4">4. Onix</li>
</ul>

<ul id="down">
<li class="heading">Down</li>
<li data-dir="down" data-clue="1" data-length="8">1. Alakazam</li>
<li data-dir="down" data-clue="2" data-length="8">2. Pikachu</li>
<li data-dir="down" data-clue="3" data-length="10">3. Charmander</li>
<li data-dir="down" data-clue="4" data-length="7">4. Squirtle</li>
</ul>
</div>

<script>
// START + TIMER
let startBtn=document.getElementById("startBtn");
let restartBtn=document.getElementById("restartBtn");
let titleScreen=document.getElementById("titleScreen");
let winScreen=document.getElementById("winScreen");
let gameWrapper=document.getElementById("gameWrapper");
let timerElem=document.getElementById("timer");
let seconds=0, timerInterval;

startBtn.onclick=()=>{
  titleScreen.style.display="none";
  gameWrapper.style.display="block";
  seconds=0;
  timerInterval=setInterval(()=>{
    seconds++;
    let m=Math.floor(seconds/60);
    let s=seconds%60;
    timerElem.textContent="Time: "+m+":"+(s<10?"0":"")+s;
  },1000);
};
restartBtn.onclick=()=>location.reload();

// CROSSWORD LOGIC
const cells=Array.from(document.querySelectorAll("main ins"));
const clues=Array.from(document.querySelectorAll("li[data-clue]"));
let state={clue:null,dir:null,length:null,index:0,cursor:0};

function clearVisual(){
  cells.forEach(c=>c.classList.remove("highlight","cursor"));
  clues.forEach(c=>c.classList.remove("current"));
}

function highlight(cnum,dir,len){
  clearVisual();
  cells.forEach(cell=>{
    if(cell.dataset.clues){
      let map=cell.dataset.clues.split(",");
      for(let m of map){
        let [d,cl]=m.split("-");
        if(d===dir && parseInt(cl)===cnum) cell.classList.add("highlight");
      }
    }
  });
}

function moveCursor(){
  cells.forEach(c=>c.classList.remove("cursor"));
  let highlightCells=cells.filter(c=>c.classList.contains("highlight"));
  if(highlightCells[state.cursor]) highlightCells[state.cursor].classList.add("cursor");
}

function checkWin(){
  let won=cells.every(c=>!c.dataset.answer || c.textContent.toUpperCase()===c.dataset.answer);
  if(won){
    clearInterval(timerInterval);
    gameWrapper.style.display="none";
    document.getElementById("finalTime").textContent="Time: "+timerElem.textContent.replace("Time: ","");
    winScreen.style.display="flex";
  }
}

// click clue
clues.forEach(cl=>{
  cl.onclick=function(){
    state.clue=parseInt(this.dataset.clue);
    state.dir=this.dataset.dir;
    state.length=parseInt(this.dataset.length);
    state.cursor=0;
    let startIdx=cells.findIndex(c=>{
      if(c.dataset.clues){
        return c.dataset.clues.split(",").some(m=>{
          let [d,clNum]=m.split("-");
          return d===state.dir && parseInt(clNum)===state.clue;
        });
      }
      return false;
    });
    state.index=startIdx;
    clearVisual();
    highlight(state.clue,state.dir,state.length);
    moveCursor();
    clues.forEach(l=>l.classList.remove("current"));
    this.classList.add("current");
  };
});

// click cell
cells.forEach(cell=>{
  cell.onclick=()=>{
    if(!cell.dataset.clues) return;
    let map=cell.dataset.clues.split(",");
    let choice=map[0].split("-");
    if(state.clue && map.some(m=>m===state.dir+"-"+state.clue)){
      let alt=map.find(m=>m!==state.dir+"-"+state.clue);
      if(alt) choice=alt.split("-");
    }
    state.dir=choice[0];
    state.clue=parseInt(choice[1]);
    let startIdx=cells.findIndex(c=>{
      if(c.dataset.clues){
        return c.dataset.clues.split(",").some(m=>{
          let [d,clNum]=m.split("-");
          return d===state.dir && parseInt(clNum)===state.clue;
        });
      }
      return false;
    });
    state.index=startIdx;
    state.cursor=0;
    clearVisual();
    highlight(state.clue,state.dir,state.length);
    moveCursor();
    clues.forEach(l=>l.classList.remove("current"));
    let li=document.querySelector('li[data-clue="'+state.clue+'"][data-dir="'+state.dir+'"]');
    if(li) li.classList.add("current");
  };
});

// keyboard
document.addEventListener("keydown",e=>{
  if(state.clue===null) return;
  let highlightCells=cells.filter(c=>c.classList.contains("highlight"));
  let target=highlightCells[state.cursor];
  
  if(e.key.length===1 && e.key.match(/[a-z]/i) && target){
    target.textContent=e.key.toUpperCase();
    if(target.dataset.answer && target.textContent!==target.dataset.answer) target.classList.add("error");
    else target.classList.remove("error");
    if(state.cursor<state.length-1) state.cursor++;
    moveCursor();
    checkWin();
  }
  
  if(e.key==="Backspace" && target){
    target.textContent="";
    target.classList.remove("error");
    if(state.cursor>0) state.cursor--;
    moveCursor();
  }

  if(e.key==="ArrowRight" && state.dir==="across" && state.cursor<state.length-1){state.cursor++;moveCursor();}
  if(e.key==="ArrowLeft" && state.dir==="across" && state.cursor>0){state.cursor--;moveCursor();}
  if(e.key==="ArrowDown" && state.dir==="down" && state.cursor<state.length-1){state.cursor++;moveCursor();}
  if(e.key==="ArrowUp" && state.dir==="down" && state.cursor>0){state.cursor--;moveCursor();}
});
</script>
</body>
</html>
