<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Gen-1 Pokémon Crossword 12x12</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#eaf2ff;display:flex;justify-content:center;align-items:center}
#titleScreen{position:fixed;inset:0;background:rgba(3,6,12,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;z-index:50}
button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:16px}
#gameWrapper{display:none;gap:20px;padding:28px;align-items:flex-start;display:flex}
main#grid{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:40px;gap:2px;justify-content:center;align-content:center}
ins,del{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase;position:relative}
del{background:#000}
ins{background:#fff;color:#071322;border:1px solid #9aa3b2;cursor:text}
ins[data-clue]:before{content:attr(data-clue);position:absolute;top:2px;left:4px;font-size:10px;color:#333}
.highlight{background:#d8efff!important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3!important}
#panelWrapper{width:300px}
ul{list-style:none;padding:0;margin:0;max-height:500px;overflow-y:auto}
li.heading{font-weight:800;margin:8px 0}
li[data-clue]{padding:8px;border-radius:6px;cursor:pointer}
li.current{background:rgba(58,141,255,.08);color:var(--accent)}
#timer{margin-bottom:12px}
label{display:flex;align-items:center;gap:8px;font-size:14px}
</style>
</head>
<body>

<div id="titleScreen">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 — fixed layout</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameWrapper" aria-hidden="true">
  <div>
    <div id="timer">Time: 0:00</div>
    <main id="grid" aria-label="crossword grid">
      <!-- ROW 0 -->
      <ins data-clue="1" data-dir="across" data-answer="C"></ins>
      <ins data-clue="1" data-dir="across" data-answer="H"></ins>
      <ins data-clue="1" data-dir="across" data-answer="A"></ins>
      <ins data-clue="1" data-dir="across" data-answer="R"></ins>
      <ins data-clue="1" data-dir="across" data-answer="M"></ins>
      <ins data-clue="1" data-dir="across" data-answer="A"></ins>
      <ins data-clue="1" data-dir="across" data-answer="N"></ins>
      <ins data-clue="1" data-dir="across" data-answer="D"></ins>
      <ins></ins>
      <ins data-clue="2" data-dir="down" data-answer="R"></ins>
      <ins data-clue="3" data-dir="down" data-answer="A"></ins>
      <ins data-clue="4" data-dir="down" data-answer="M"></ins>

      <!-- ROW 1 -->
      <ins></ins><ins></ins><ins></ins><ins></ins><ins></ins><ins></ins><ins></ins><ins></ins>
      <ins></ins>
      <ins data-clue="2" data-dir="down" data-answer="A"></ins>
      <ins data-clue="3" data-dir="down" data-answer="B"></ins>
      <ins data-clue="4" data-dir="down" data-answer="E"></ins>

      <!-- ROW 2 -->
      <ins data-clue="5" data-dir="across" data-answer="G"></ins>
      <ins data-clue="5" data-dir="across" data-answer="Y"></ins>
      <ins data-clue="5" data-dir="across" data-answer="A"></ins>
      <ins data-clue="5" data-dir="across" data-answer="R"></ins>
      <ins data-clue="5" data-dir="across" data-answer="A"></ins>
      <ins data-clue="5" data-dir="across" data-answer="D"></ins>
      <ins data-clue="5" data-dir="across" data-answer="O"></ins>
      <ins data-clue="6" data-dir="down" data-answer="O"></ins>
      <ins></ins>
      <ins data-clue="2" data-dir="down" data-answer="Y"></ins>
      <ins data-clue="3" data-dir="down" data-answer="K"></ins>
      <ins></ins>

      <!-- ROW 3 -->
      <ins></ins><ins></ins><ins></ins><ins></ins><ins></ins><ins></ins>
      <ins></ins>
      <ins data-clue="6" data-dir="down" data-answer="N"></ins>
      <ins></ins><ins></ins><ins></ins><ins></ins>

      <!-- ROW 4 -->
      <ins data-clue="4" data-dir="across" data-answer="M"></ins>
      <ins data-clue="4" data-dir="across" data-answer="E"></ins>
      <ins data-clue="4" data-dir="across" data-answer="W"></ins>
      <ins></ins><ins></ins><ins></ins><ins></ins>
      <ins data-clue="6" data-dir="down" data-answer="I"></ins>
      <ins></ins><ins></ins>
      <ins data-clue="3" data-dir="down" data-answer="K"></ins>
      <ins></ins>

      <!-- ROW 5 -->
      <ins></ins><ins></ins><ins></ins><ins></ins><ins></ins><ins></ins>
      <ins></ins>
      <ins data-clue="6" data-dir="down" data-answer="X"></ins>
      <ins></ins><ins></ins><ins></ins><ins></ins>

      <!-- ROW 6 -->
      <ins data-clue="7" data-dir="across" data-answer="S"></ins>
      <ins data-clue="7" data-dir="across" data-answer="N"></ins>
      <ins data-clue="7" data-dir="across" data-answer="E"></ins>
      <ins data-clue="7" data-dir="across" data-answer="A"></ins>
      <ins data-clue="7" data-dir="across" data-answer="S"></ins>
      <ins data-clue="7" data-dir="across" data-answer="E"></ins>
      <ins data-clue="7" data-dir="across" data-answer="L"></ins>
      <ins></ins><ins></ins><ins></ins><ins></ins><ins></ins>

      <!-- ROW 7 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 8 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 9 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 10 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 11 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
    </main>
  </div>

  <div id="panelWrapper">
    <div id="timer">Time: 0:00</div>
    <label><input type="checkbox" id="errorToggle" checked> Error check</label>

    <ul id="across" style="margin-top:12px">
      <li class="heading">Across</li>
      <li data-dir="across" data-clue="1" data-length="10">1. CHARMANDER</li>
      <li data-dir="across" data-clue="4" data-length="3">4. MEW</li>
      <li data-dir="across" data-clue="5" data-length="8">5. GYARADOS</li>
      <li data-dir="across" data-clue="7" data-length="7">7. SNEASEL</li>
    </ul>

    <ul id="down" style="margin-top:12px">
      <li class="heading">Down</li>
      <li data-dir="down" data-clue="2" data-length="7">2. RAYQUAZA</li>
      <li data-dir="down" data-clue="3" data-length="4">3. ABRA</li>
      <li data-dir="down" data-clue="4" data-length="6">4. MEOWTH</li>
      <li data-dir="down" data-clue="6" data-length="6">6. ONIX</li>
    </ul>
  </div>
</div>

<script>
// TIMER
const startBtn=document.getElementById('startBtn');
const titleScreen=document.getElementById('titleScreen');
const gameWrapper=document.getElementById('gameWrapper');
const panelTimer=document.querySelector('#panelWrapper #timer');
let seconds=0, timerInterval;
startBtn.addEventListener('click', ()=>{
  titleScreen.style.display='none';
  gameWrapper.style.display='flex';
  gameWrapper.setAttribute('aria-hidden','false');
  seconds=0;
  panelTimer.textContent='Time: 0:00';
  timerInterval=setInterval(()=>{
    seconds++;
    const m=Math.floor(seconds/60), s=seconds%60;
    panelTimer.textContent='Time: '+m+':'+(s<10?'0':'')+s;
  },1000);
});

// CORE LOGIC
const cells = Array.from(document.querySelectorAll('main ins'));
const clues = Array.from(document.querySelectorAll('li[data-clue]'));
const errorToggle = document.getElementById('errorToggle');
let state = { clue:null, dir:null, cursor:0 };

function clearVisual(){ cells.forEach(c=>c.classList.remove('highlight','cursor')); clues.forEach(l=>l.classList.remove('current')) }
function highlight(clueNum, dir){
  clearVisual();
  cells.forEach(c=>{
    if(+c.dataset.clue===+clueNum && c.dataset.dir===dir) c.classList.add('highlight');
  });
  state.cursor=0; moveCursor();
}
function moveCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length===0) return;
  highlighted[Math.min(state.cursor, highlighted.length-1)].classList.add('cursor');
}
function checkErrors(){
  if(!errorToggle.checked) return;
  cells.forEach(c=>{
    if(!c.dataset.answer){ c.classList.remove('error'); return; }
    const txt = (c.textContent || '').trim().toUpperCase();
    c.classList.toggle('error', txt !== c.dataset.answer);
  });
}

clues.forEach(li=>{
  li.addEventListener('click', function(){
    state.clue = +this.dataset.clue;
    state.dir = this.dataset.dir;
    state.cursor = 0;
    highlight(state.clue, state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    this.classList.add('current');
  });
});

cells.forEach(cell=>{
  cell.addEventListener('click', ()=>{
    if(!cell.dataset.clue) return;
    state.clue = +cell.dataset.clue;
    state.dir = cell.dataset.dir;
    state.cursor = 0;
    highlight(state.clue, state.dir);
    const li = document.querySelector(`li[data-clue="${state.clue}"][data-dir="${state.dir}"]`);
    li && li.classList.add('current');
  });
});

document.addEventListener('keydown', e=>{
  if(state.clue === null) return;
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length === 0) return;

  if(e.key === 'ArrowRight' && state.dir==='across'){ if(state.cursor<highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowLeft'  && state.dir==='across'){ if(state.cursor>0) state.cursor--; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowDown'  && state.dir==='down'){ if(state.cursor<highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key === 'ArrowUp'    && state.dir==='down'){ if(state.cursor>0) state.cursor--; moveCursor(); e.preventDefault(); return; }

  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const t = highlighted[state.cursor];
    if(t){ t.textContent=e.key.toUpperCase(); if(errorToggle.checked && t.dataset.answer) t.classList.toggle('error', t.textContent!==t.dataset.answer); else t.classList.remove('error'); }
    if(state.cursor<highlighted.length-1) state.cursor++;
    moveCursor(); e.preventDefault(); return;
  }

  if(e.key==='Backspace'){
    const t = highlighted[state.cursor];
    if(t){ t.textContent=''; t.classList.remove('error'); }
    if(state.cursor>0) state.cursor--;
    moveCursor(); e.preventDefault(); return;
  }
});

errorToggle.addEventListener('change', checkErrors);
</script>
</body>
</html>
