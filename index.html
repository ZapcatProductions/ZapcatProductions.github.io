<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon 15×15 — Clean Crossword</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg:#b30000;           /* red background */
    --tile:#ffffff;         /* white tile */
    --tile-text:#071322;    /* tile text (black-blue) */
    --black-tile:#071322;   /* blacked out tile */
    --highlight:#1e90ff;    /* noticeable blue highlight */
    --direction:#ffd400;    /* yellow directional line */
    --error:#ff3b3b;        /* red for errors */
    --gap:4px;
    --size:36px;            /* tile size */
    --num-size:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:12px}
  #container{display:flex;gap:24px;align-items:flex-start;justify-content:center;max-width:1400px;width:100%}

  /* grid area centered */
  #gridWrap{display:flex;flex-direction:column;gap:12px;align-items:center}
  #title{font-weight:800;color:#fff;font-size:20px;letter-spacing:0.2px}
  #gridBorder{background:var(--black-tile);padding:8px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.4)}
  #grid{display:grid;grid-template-columns:repeat(15,var(--size));grid-auto-rows:var(--size);gap:var(--gap);background:transparent;border-radius:6px}

  /* tiles */
  .cell{
    width:var(--size);height:var(--size);
    background:var(--tile);color:var(--tile-text);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
    position:relative;user-select:none;cursor:text;border-radius:4px;border:1px solid rgba(0,0,0,0.06);line-height:1;
  }
  .black{width:var(--size);height:var(--size);background:var(--black-tile);border-radius:4px;border:1px solid rgba(0,0,0,0.35);box-sizing:border-box}
  /* bigger solid black number in corner, no flag */
  .num{position:absolute;top:4px;left:5px;font-size:var(--num-size);color:#000;font-weight:900;pointer-events:none}
  /* highlight & current */
  .highlight{background: rgba(30,144,255,0.12); border:1px solid rgba(30,144,255,0.18)}
  .cursor{outline:3px solid rgba(30,144,255,0.14);box-shadow:inset 0 0 0 2px rgba(30,144,255,0.04)}
  .current-clue{background: rgba(30,144,255,0.06)}
  /* directional yellow arrow on last tile of active word */
  .cell.arrow-right::after{
    content:"";
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    border-top:6px solid transparent;
    border-bottom:6px solid transparent;
    border-left:10px solid var(--direction);
    opacity:0.95;
  }
  .cell.arrow-down::after{
    content:"";
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:10px solid var(--direction);
    opacity:0.95;
  }
  /* error */
  .error{background:var(--error) !important;color:#fff !important}

  /* panel (right) */
  #panel{width:360px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .timers{font-size:13px;color:rgba(255,255,255,0.9)}
  .controls{display:flex;gap:8px;align-items:center}
  label{display:flex;align-items:center;gap:8px;color:#fff}
  ul{list-style:none;padding:0;margin:0;width:100%}
  li.heading{font-weight:800;margin:8px 0;color:#fff}
  li.clue{padding:8px;border-radius:6px;cursor:pointer;color:#fff}
  li.clue.current{background: rgba(255,255,255,0.04); color:var(--direction)}
  .note{font-size:13px;color:rgba(255,255,255,0.9)}

  @media (max-width:960px){
    #container{flex-direction:column;align-items:center}
    #panel{width:100%}
  }
</style>
</head>
<body>
  <div id="container">
    <div id="gridWrap">
      <div id="title">Gen-1 Pokémon — Mini Crossword</div>
      <div class="timers" id="gridTimer">Time: 0:00</div>
      <div id="gridBorder">
        <main id="grid" aria-label="crossword grid"></main>
      </div>
    </div>

    <aside id="panel">
      <div class="timers" id="panelTimer">Time: 0:00</div>
      <div class="controls">
        <label><input type="checkbox" id="errorToggle" checked> Error check</label>
        <div style="flex:1"></div>
        <div class="note">Tab to cycle clues · Esc to clear</div>
      </div>

      <ul class="clue-list" id="across" style="margin-top:12px">
        <li class="heading">Across</li>
        <li class="clue" data-dir="across" data-clue="1">1. CHARMANDER</li>
        <li class="clue" data-dir="across" data-clue="2">2. MEW</li>
        <li class="clue" data-dir="across" data-clue="3">3. GYARADOS</li>
        <li class="clue" data-dir="across" data-clue="4">4. SNEASEL</li>
      </ul>

      <ul class="clue-list" id="down" style="margin-top:12px">
        <li class="heading">Down</li>
        <li class="clue" data-dir="down" data-clue="5">5. RAYQUAZA</li>
        <li class="clue" data-dir="down" data-clue="6">6. ABRA</li>
        <li class="clue" data-dir="down" data-clue="7">7. MEOWTH</li>
        <li class="clue" data-dir="down" data-clue="8">8. ONIX</li>
      </ul>
    </aside>
  </div>

<script>
/* -------------------------
   Grid / words configuration
   ------------------------- */
const letters = "ABCDEFGHIJKLMNO";
const rows = 15, cols = 15;
const gridEl = document.getElementById('grid');

/* final placements chosen so overlaps only occur where letters match */
const words = [
  { id:1, word:"CHARMANDER", dir:"across", start:"B2" }, // B2..K2 (10 letters)
  { id:2, word:"MEW",        dir:"across", start:"J4" }, // J4..L4
  { id:3, word:"GYARADOS",   dir:"across", start:"B6" }, // B6..I6
  { id:4, word:"SNEASEL",    dir:"across", start:"B10" },// B10..H10 (keeps away from MEOWTH)
  { id:5, word:"RAYQUAZA",   dir:"down",   start:"K2" }, // K2..K9 (crosses CHARMANDER K2 R)
  { id:6, word:"ABRA",       dir:"down",   start:"D2" }, // D2..D5 (crosses CHARMANDER D2 A)
  { id:7, word:"MEOWTH",     dir:"down",   start:"H4" }, // H4..H9 (crosses GYARADOS H6 = O)
  { id:8, word:"ONIX",       dir:"down",   start:"L6" }, // L6..L9 (off to the right)
];

/* ---------- build empty grid (all black) ---------- */
const cellMap = new Map();
for(let r=1;r<=rows;r++){
  for(let c=0;c<cols;c++){
    const coord = letters[c] + r;
    const el = document.createElement('div');
    el.dataset.coord = coord;
    el.className = 'black';
    gridEl.appendChild(el);
    cellMap.set(coord, el);
    el._words = [];
  }
}

/* ---------- place words and create cell data ---------- */
function placeWords(){
  words.forEach(w=>{
    const col = w.start[0].charCodeAt(0) - 65;
    const row = parseInt(w.start.slice(1),10) - 1;
    for(let i=0;i<w.word.length;i++){
      const r = row + (w.dir === 'down' ? i : 0);
      const c = col + (w.dir === 'across' ? i : 0);
      if(r<0||r>=rows||c<0||c>=cols){ console.warn('out of bounds', w); continue; }
      const coord = letters[c] + (r+1);
      const el = cellMap.get(coord);
      if(!el) continue;
      if(el.classList.contains('black')) { el.className = 'cell'; el.textContent = ''; }
      // record membership; store authoritative answer (first-one-wins)
      el._words.push({ id: w.id, dir: w.dir, index: i, letter: w.word[i] });
      if(!el.dataset.answer) el.dataset.answer = w.word[i];
      else if(el.dataset.answer !== w.word[i]) {
        console.warn('overlap conflict at', coord, el.dataset.answer, 'vs', w.word[i]);
      }
      // first letter -> number (no flag, bigger and black)
      if(i===0 && !el.querySelector('.num')){
        el.dataset.clueNum = String(w.id);
        const span = document.createElement('span');
        span.className = 'num';
        span.textContent = String(w.id);
        el.appendChild(span);
      }
    }
  });
}
placeWords();

/* ---------- helpers ---------- */
function coordsForWord(w){
  const col = w.start[0].charCodeAt(0) - 65;
  const row = parseInt(w.start.slice(1),10) - 1;
  const arr = [];
  for(let i=0;i<w.word.length;i++){
    const r = row + (w.dir === 'down' ? i : 0);
    const c = col + (w.dir === 'across' ? i : 0);
    arr.push(letters[c] + (r+1));
  }
  return arr;
}
function groupCells(id, dir){
  const w = words.find(x=>x.id===Number(id) && x.dir===dir);
  if(!w) return [];
  return coordsForWord(w).map(coord => cellMap.get(coord)).filter(Boolean);
}
function allCellEls(){ return Array.from(document.querySelectorAll('.cell')); }

/* ---------- timers ---------- */
let seconds = 0;
const gridTimer = document.getElementById('gridTimer');
const panelTimer = document.getElementById('panelTimer');
function tick(){ seconds++; const m=Math.floor(seconds/60), s=seconds%60; const t=`Time: ${m}:${s<10?'0':''}${s}`; gridTimer.textContent=t; panelTimer.textContent=t }
setInterval(tick,1000);

/* ---------- state & UI ---------- */
const cluesEls = Array.from(document.querySelectorAll('li.clue'));
const errorToggle = document.getElementById('errorToggle');

let state = { activeId:null, dir:null, group:[], cursor:0, answers:{} };

function clearVisual(){
  allCellEls().forEach(c=> c.classList.remove('highlight','cursor','arrow-right','arrow-down','current-clue','error'));
  cluesEls.forEach(li=> li.classList.remove('current'));
}

function setActive(id, dir, cursorPos = 0){
  clearVisual();
  const group = groupCells(Number(id), dir);
  if(!group.length) return;
  state.activeId = Number(id);
  state.dir = dir;
  state.group = group;
  state.cursor = Math.max(0, Math.min(cursorPos, group.length-1));
  group.forEach(c => c.classList.add('highlight','current-clue'));
  group[state.cursor].classList.add('cursor');
  // directional arrow on the group's last cell
  const last = group[group.length - 1];
  if(last){
    last.classList.add(dir==='across' ? 'arrow-right' : 'arrow-down');
  }
  const li = document.querySelector(`.clue[data-clue='${id}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  const key = `${id}-${dir}`;
  if(!state.answers[key]) state.answers[key] = '';
  if(errorToggle.checked) checkErrors();
}

/* ---------- panel behavior (hover + click) ---------- */
cluesEls.forEach(li=>{
  li.addEventListener('mouseover', function(){
    const id = this.dataset.clue, dir = this.dataset.dir;
    const group = groupCells(Number(id), dir);
    group.forEach(g => g.classList.add('highlight'));
  });
  li.addEventListener('mouseout', function(){
    const id = this.dataset.clue, dir = this.dataset.dir;
    const group = groupCells(Number(id), dir);
    group.forEach(g => g.classList.remove('highlight'));
  });
  li.addEventListener('click', function(){
    const id = this.dataset.clue, dir = this.dataset.dir;
    setActive(id, dir, (state.answers[`${id}-${dir}`] || '').length);
    this.classList.add('current');
  });
});

/* ---------- clicking cells ---------- */
Array.from(cellMap.values()).forEach(cell=>{
  cell.addEventListener('click', function(){
    if(cell.classList.contains('black')) { clearVisual(); state.activeId=null; state.group=[]; state.cursor=0; return; }
    const members = cell._words || [];
    if(!members.length) return;
    // choose sensible member: pick across if available, else down; if both and same as current, toggle
    let pick = members.find(m=>m.dir==='across') || members[0];
    if(members.length>1){
      if(state.activeId === pick.id && state.dir === pick.dir){
        // choose the other one to toggle
        pick = members.find(m=> m.dir !== pick.dir) || pick;
      }
    }
    const group = groupCells(pick.id, pick.dir);
    const idx = group.indexOf(cell);
    setActive(pick.id, pick.dir, idx >= 0 ? idx : 0);
  });
});

/* ---------- keyboard input ---------- */
document.addEventListener('keydown', function(e){
  if(!state.activeId){
    if(e.key === 'Tab'){ e.preventDefault(); const first = cluesEls[0]; if(first) first.click(); }
    return;
  }

  if(e.key === 'Tab'){
    e.preventDefault();
    const allCl = Array.from(document.querySelectorAll('li.clue'));
    const current = document.querySelector('li.clue.current');
    let idx = allCl.indexOf(current);
    idx = e.shiftKey ? (idx - 1 + allCl.length) % allCl.length : (idx + 1) % allCl.length;
    clearVisual();
    allCl[idx].click();
    return;
  }

  // letters A-Z
  if(e.key.length === 1 && /[a-z]/i.test(e.key)){
    e.preventDefault();
    const ch = e.key.toUpperCase();
    const key = `${state.activeId}-${state.dir}`;
    state.answers[key] = state.answers[key] || '';
    const arr = state.answers[key].split('');
    arr[state.cursor] = ch;
    state.answers[key] = arr.join('').slice(0, words.find(w=>w.id===state.activeId && w.dir===state.dir).word.length);
    // update DOM across group (updates crosses)
    state.group.forEach((cell,i)=> cell.textContent = (state.answers[key][i] || ''));
    if(state.cursor < state.group.length - 1) state.cursor++;
    state.group.forEach(c=> c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // Backspace behaviour
  if(e.key === 'Backspace'){
    e.preventDefault();
    const key = `${state.activeId}-${state.dir}`;
    state.answers[key] = state.answers[key] || '';
    const curText = (state.group[state.cursor].textContent || '').trim();
    if(curText !== ''){
      const arr = state.answers[key].split('');
      arr[state.cursor] = '';
      state.answers[key] = arr.join('');
      state.group[state.cursor].textContent = '';
    } else {
      if(state.cursor > 0) state.cursor--;
      const arr = state.answers[key].split('');
      arr[state.cursor] = '';
      state.answers[key] = arr.join('');
      state.group[state.cursor].textContent = '';
    }
    state.group.forEach(c=> c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // arrow navigation inside active direction
  if(e.key === 'ArrowRight' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, state.group.length - 1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowLeft' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor - 1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowDown' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, state.group.length - 1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowUp' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor - 1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }

  if(e.key === 'Escape'){
    clearVisual();
    state.activeId = null; state.dir = null; state.group = []; state.cursor = 0;
    return;
  }
});

/* ---------- error checking (only flag entered wrong letters) ---------- */
function checkErrors(){
  allCellEls().forEach(cell=>{
    const ans = (cell.dataset.answer || '').toUpperCase();
    const txt = (cell.textContent || '').trim().toUpperCase();
    if(ans){
      if(txt !== '' && txt !== ans) cell.classList.add('error');
      else cell.classList.remove('error');
    } else {
      cell.classList.remove('error');
    }
  });
}
if(errorToggle.checked) checkErrors();
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) allCellEls().forEach(c=>c.classList.remove('error'));
  else checkErrors();
});

/* ---------- fit font so long words remain readable ---------- */
(function fitFont(){
  const tile = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size')) || 36;
  const size = Math.max(12, Math.min(16, Math.floor(tile * 0.45)));
  allCellEls().forEach(c => c.style.fontSize = size + 'px');
})();

/* expose for debug */
window._crossword = { words, cellMap, state, groupCells };

</script>
</body>
</html>
