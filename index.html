<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Blocks Adventure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family:sans-serif; background:#111; color:#fff; overflow:hidden; }
#gameCanvas { background:#222; display:block; margin:0 auto; border:2px solid #fff; }
#menu, #levelScreen, #gameOver {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  text-align:center; background:#333; padding:20px; border:2px solid #fff;
}
button { padding:10px 20px; margin:5px; cursor:pointer; font-size:16px; }
#controlsGuide { font-size:14px; color:#0f0; margin-top:10px; }
</style>
</head>
<body>

<div id="menu">
  <h1>Falling Blocks Adventure</h1>
  <p id="controlsGuide">
    Controls:<br>
    Arrow Left ← : Move Left<br>
    Arrow Right → : Move Right
  </p>
  <button id="startBtn">Start Game</button>
</div>

<div id="levelScreen" style="display:none;">
  <h2 id="levelText"></h2>
  <button id="nextLevelBtn">Continue</button>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div id="gameOver" style="display:none;">
  <h2 id="overText">Game Over!</h2>
  <p id="scoreText"></p>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x:180, y:550, w:40, h:40, speed:6 };
let obstacles = [];
let collectibles = [];
let score = 0;
let highScore = localStorage.getItem('highScore') || 0;
let level = 1;
let maxLevel = 50;
let gameRunning = false;
let keys = {};
let obstacleTimer = 0;
let collectibleTimer = 0;
let levelTimer = 0;
let levelDuration = 2000; // in frames (~33 fps * 60 = ~60 sec?)

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

const startBtn = document.getElementById('startBtn');
const menu = document.getElementById('menu');
const gameOverDiv = document.getElementById('gameOver');
const restartBtn = document.getElementById('restartBtn');
const scoreText = document.getElementById('scoreText');
const levelScreen = document.getElementById('levelScreen');
const levelText = document.getElementById('levelText');
const nextLevelBtn = document.getElementById('nextLevelBtn');

startBtn.onclick = () => startGame();
restartBtn.onclick = () => startGame();
nextLevelBtn.onclick = () => startNextLevel();

function startGame() {
  menu.style.display = 'none';
  gameOverDiv.style.display = 'none';
  levelScreen.style.display = 'none';
  player.x=180; player.y=550; score=0; level=1; obstacles=[]; collectibles=[];
  obstacleTimer=0; collectibleTimer=0; levelTimer=0;
  levelDuration = 600 + level*100; // Level 1 ~10s, increases per level
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}

function startNextLevel() {
  levelScreen.style.display='none';
  obstacles=[]; collectibles=[];
  player.x=180; player.y=550;
  obstacleTimer=0; collectibleTimer=0; levelTimer=0;
  levelDuration = 600 + level*100; // scale duration
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}

function endLevel() {
  gameRunning=false;
  if(level >= maxLevel) {
    endGame(true);
  } else {
    levelScreen.style.display='block';
    levelText.innerHTML = `Level ${level} Cleared!<br>Score: ${score}`;
  }
}

function endGame(victory=false) {
  gameRunning=false;
  if(score>highScore) {
    highScore = score;
    localStorage.setItem('highScore', highScore);
  }
  scoreText.innerHTML = victory ? 
    `You beat all levels!<br>Score: ${score}<br>High Score: ${highScore}` :
    `Game Over!<br>Score: ${score}<br>High Score: ${highScore}`;
  gameOverDiv.style.display='block';
}

function spawnObstacle() {
  const width = Math.random()*50+20;
  obstacles.push({ x:Math.random()*(canvas.width-width), y:-20, w:width, h:20, speed:2 + level*0.3 });
}

function spawnCollectible() {
  const size = 15;
  collectibles.push({ x:Math.random()*(canvas.width-size), y:-20, w:size, h:size, speed:1.5+level*0.2 });
}

function update() {
  if(keys['ArrowLeft'] && player.x>0) player.x -= player.speed;
  if(keys['ArrowRight'] && player.x+player.w<canvas.width) player.x += player.speed;

  obstacleTimer++;
  collectibleTimer++;
  levelTimer++;

  // Difficulty scaling: faster spawn rate as levels increase
  let obstacleSpawnRate = Math.max(20, 40 - level); // min 20
  let collectibleSpawnRate = Math.max(100, 150 - level*2);

  if(obstacleTimer > obstacleSpawnRate) { spawnObstacle(); obstacleTimer=0; }
  if(collectibleTimer > collectibleSpawnRate) { spawnCollectible(); collectibleTimer=0; }

  obstacles.forEach(ob => ob.y += ob.speed);
  obstacles = obstacles.filter(ob => ob.y < canvas.height);

  collectibles.forEach(col => col.y += col.speed);
  collectibles = collectibles.filter(col => col.y < canvas.height);

  // Collision with obstacles
  for(let ob of obstacles) {
    if(player.x < ob.x+ob.w && player.x+player.w>ob.x &&
       player.y < ob.y+ob.h && player.y+player.h>ob.y) {
      endGame();
    }
  }

  // Collision with collectibles
  for(let i=collectibles.length-1; i>=0; i--) {
    const col = collectibles[i];
    if(player.x < col.x+col.w && player.x+player.w>col.x &&
       player.y < col.y+col.h && player.y+player.h>col.y) {
      score += 50;
      collectibles.splice(i,1);
    }
  }

  score += 1;

  // Level complete if timer reaches duration
  if(levelTimer >= levelDuration) {
    level++;
    endLevel();
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle = '#0f0';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // obstacles
  ctx.fillStyle = '#f00';
  obstacles.forEach(ob => ctx.fillRect(ob.x, ob.y, ob.w, ob.h));

  // collectibles
  ctx.fillStyle = '#ff0';
  collectibles.forEach(col => ctx.fillRect(col.x, col.y, col.w, col.h));

  // UI: Score, High Score
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Score: ${score}  Level: ${level>maxLevel?maxLevel:level}`, 10,30);
  ctx.fillText(`High Score: ${highScore}`, 10,60);

  // Level timer indicator
  let secondsLeft = Math.max(0, Math.ceil((levelDuration - levelTimer)/60));
  ctx.fillText(`Survive ${secondsLeft}s for this level`, 10,90);
}

function gameLoop() {
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
