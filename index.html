<script>
const btnCreate = document.getElementById('btnCreate');
const btnPlay = document.getElementById('btnPlay');
const crosswordEl = document.getElementById('crossword');

let crosswordData = []; // [{word, clue, positions:[r,c,...]}]
let grid = [];
let gridRows = 15, gridCols = 15;

function createGrid() {
  crosswordEl.innerHTML = '';
  grid = Array.from({length:gridRows},()=>Array(gridCols).fill(''));
  crosswordData.forEach(entry=>{
    let r = Math.floor(Math.random()*(gridRows-entry.word.length));
    let c = Math.floor(Math.random()*(gridCols-entry.word.length));
    entry.positions = [];
    for(let i=0;i<entry.word.length;i++){
      grid[r][c+i] = entry.word[i].toUpperCase();
      entry.positions.push([r,c+i]);
    }
  });

  for(let r=0;r<gridRows;r++){
    const rowDiv = document.createElement('div');
    rowDiv.classList.add('crossrow');
    for(let c=0;c<gridCols;c++){
      const sq = document.createElement('div');
      sq.className = 'square';
      if(grid[r][c]){
        const input = document.createElement('input');
        input.type='text';
        input.maxLength=1;
        input.className='char';
        input.dataset.row=r;
        input.dataset.col=c;
        input.addEventListener('input', e=>{
          e.target.value=e.target.value.toUpperCase();
          moveNext(e.target);
        });
        sq.appendChild(input);
      } else {
        sq.classList.add('hide');
      }
      rowDiv.appendChild(sq);
    }
    crosswordEl.appendChild(rowDiv);
  }
}

function moveNext(input){
  const r = Number(input.dataset.row);
  const c = Number(input.dataset.col);
  // simple right movement
  for(let nc=c+1;nc<gridCols;nc++){
    const next = crosswordEl.querySelector(`input[data-row="${r}"][data-col="${nc}"]`);
    if(next){next.focus();break;}
  }
}

btnCreate.onclick = ()=>{
  const lines = document.querySelectorAll('.line');
  crosswordData = [];
  lines.forEach(line=>{
    const word = line.querySelector('.word').value.trim();
    const clue = line.querySelector('.clue').value.trim();
    if(word) crosswordData.push({word, clue});
  });
  createGrid();
};

btnPlay.onclick = ()=>{
  const firstInput = crosswordEl.querySelector('input.char');
  if(firstInput) firstInput.focus();
};
</script>
