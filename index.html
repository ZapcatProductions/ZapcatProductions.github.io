<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon 15×15 Mini Crossword</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#eaf2ff;display:flex;align-items:flex-start;justify-content:center;padding:28px}
#wrapper{display:flex;gap:28px;align-items:flex-start;max-width:1600px;width:100%}
#gridWrap { display:flex; flex-direction:column; gap:12px; align-items:center; }
#gridTitle { font-weight:700; font-size:16px; color:#cfe8ff; }
#grid{display:grid;grid-template-columns:repeat(15,44px);grid-auto-rows:44px;gap:6px;background:transparent;border:3px solid #eaf2ff;border-radius:12px;padding:6px}
.cell{width:44px;height:44px;background:#fff;color:#071322;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;user-select:none;cursor:text;border:1px solid #9aa3b2;line-height:1}
.black{width:44px;height:44px;background:#071322;border-radius:8px;border:1px solid #0b1220}
.coord{position:absolute;top:4px;left:6px;font-size:10px;color:rgba(7,19,34,0.45);pointer-events:none;font-weight:700}
.highlight{background:#d8efff !important;color:#071322 !important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3 !important}
#panel{width:360px}
#timers{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.clue-list{background:transparent;padding:0;margin:0;list-style:none;max-height:600px;overflow:auto}
li.heading{font-weight:800;margin:8px 0}
li.clue{padding:10px;border-radius:8px;cursor:pointer}
li.clue.current{background:rgba(58,141,255,.08);color:var(--accent)}
label{display:flex;align-items:center;gap:8px}
.small-muted { font-size:13px; color: #bcd6ff; margin-bottom:6px; }
@media (max-width:960px){html,body{padding:14px} #wrapper{flex-direction:column;align-items:center} #panel{width:100%}}
</style>
</head>
<body>
<div id="wrapper">

  <!-- GRID -->
  <div id="gridWrap">
    <div id="gridTitle">Gen-1 Pokémon 15×15 — Mini Crossword</div>
    <div id="gridTimer" class="small-muted">Time: 0:00</div>
    <main id="grid" aria-label="crossword grid"></main>
  </div>

  <!-- PANEL -->
  <aside id="panel">
    <div id="panelTimer">Time: 0:00</div>
    <label style="margin-top:8px"><input type="checkbox" id="errorToggle" checked> Error check</label>

    <ul class="clue-list" id="across" style="margin-top:12px">
      <li class="heading">Across</li>
      <li class="clue" data-dir="across" data-clue="1">1. CHARMANDER</li>
      <li class="clue" data-dir="across" data-clue="2">2. MEW</li>
      <li class="clue" data-dir="across" data-clue="3">3. GYARADOS</li>
      <li class="clue" data-dir="across" data-clue="4">4. SNEASEL</li>
    </ul>

    <ul class="clue-list" id="down" style="margin-top:12px">
      <li class="heading">Down</li>
      <li class="clue" data-dir="down" data-clue="5">5. RAYQUAZA</li>
      <li class="clue" data-dir="down" data-clue="6">6. ABRA</li>
      <li class="clue" data-dir="down" data-clue="7">7. MEOWTH</li>
      <li class="clue" data-dir="down" data-clue="8">8. ONIX</li>
    </ul>
  </aside>

</div>

<script>
/* ---------------------------
   GRID + WORD PLACEMENT
   --------------------------- */
const letters = "ABCDEFGHIJKLMNO"; // 15 columns A..O
const rows = 15;
const cols = 15;
const gridEl = document.getElementById('grid');

// word definitions (kept as you provided)
const words = [
  {word:"CHARMANDER",dir:"across",start:"B2"},
  {word:"MEW",dir:"across",start:"D4"},
  {word:"GYARADOS",dir:"across",start:"B6"},
  {word:"SNEASEL",dir:"across",start:"B8"},
  {word:"RAYQUAZA",dir:"down",start:"K2"},
  {word:"ABRA",dir:"down",start:"L2"},
  {word:"MEOWTH",dir:"down",start:"D4"},
  {word:"ONIX",dir:"down",start:"H6"},
];

// create a map of coord -> element (including black cells)
const cellMap = new Map();

// create grid DOM
for(let r=1;r<=rows;r++){
  for(let c=0;c<cols;c++){
    const coord = letters[c] + r;
    // border blacks
    const isBorder = (r===1||r===rows||c===0||c===cols-1);
    const div = document.createElement('div');
    div.setAttribute('data-coord', coord);
    if(isBorder){
      div.className = 'black';
    } else {
      div.className = 'cell';
      // placeholder text cleared; will be filled via keyboard
    }
    gridEl.appendChild(div);
    cellMap.set(coord, div);
  }
}

// utility to place words: sets data-word for all letters, sets data-dir, data-answer
words.forEach((w,wi)=>{
  const col = w.start[0].charCodeAt(0) - 65; // A->0
  const row = parseInt(w.start.slice(1),10) - 1; // 1->0
  for(let i=0;i<w.word.length;i++){
    const r = row + (w.dir === 'down' ? i : 0);
    const c = col + (w.dir === 'across' ? i : 0);
    if(c < 0 || c >= cols || r < 0 || r >= rows) continue;
    const coord = letters[c] + (r+1);
    const el = cellMap.get(coord);
    if(!el) continue;
    if(el.classList.contains('black')) {
      // conflict with black cell — skip placement (you can adjust words if needed)
      console.warn('Word placement conflict at', coord, 'for', w.word);
      continue;
    }
    // mark the cell as part of this word
    el.dataset.word = String(wi+1);      // word id 1..N
    el.dataset.dir = w.dir;             // "across" or "down"
    el.dataset.answer = w.word[i];      // the correct letter for this position
    // if first letter of this word, label with clue number (only once)
    if(i === 0){
      // put small number in top-left
      el.dataset.clueNum = String(wi+1);
      const span = document.createElement('span');
      span.className = 'coord';
      span.textContent = String(wi+1);
      el.appendChild(span);
    }
  }
});

/* ---------------------------
   TIMERS
   --------------------------- */
let seconds = 0;
const gridTimer = document.getElementById('gridTimer');
const panelTimer = document.getElementById('panelTimer');
function tick(){ seconds++; const m=Math.floor(seconds/60), s=seconds%60; const t=`Time: ${m}:${s<10?'0':''}${s}`; gridTimer.textContent=t; panelTimer.textContent=t }
setInterval(tick,1000);

/* ---------------------------
   CORE UI LOGIC
   --------------------------- */
const allCells = Array.from(document.querySelectorAll('.cell'));
const cluesEls = Array.from(document.querySelectorAll('.clue'));
const errorToggle = document.getElementById('errorToggle');

let state = { num:null, dir:null, cursor:0, group:[] };

function clearVisual(){
  allCells.forEach(c=>c.classList.remove('highlight','cursor','error'));
  cluesEls.forEach(l=>l.classList.remove('current'));
}

function buildGroup(num, dir){
  // find all cells that belong to word id num AND match the direction
  return allCells.filter(c => c.dataset.word === String(num) && c.dataset.dir === dir)
                 // ensure in reading order (row-major)
                 .sort((a,b)=>{
                    const ar = parseInt(a.dataset.coord.slice(1)), ac = a.dataset.coord.charCodeAt(0);
                    const br = parseInt(b.dataset.coord.slice(1)), bc = b.dataset.coord.charCodeAt(0);
                    if(ac === bc) return ar - br;
                    return ac - bc;
                 });
}

function highlightClue(num, dir){
  clearVisual();
  const group = buildGroup(num, dir);
  group.forEach((c)=>c.classList.add('highlight'));
  if(group[0]) group[0].classList.add('cursor');
  const li = document.querySelector(`.clue[data-clue='${num}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  state = { num, dir, cursor:0, group };
  updateCursor();
  // immediately run error check if toggled
  if(errorToggle.checked) checkErrors();
}

function updateCursor(){
  allCells.forEach(c=>c.classList.remove('cursor'));
  if(state.group.length){
    const idx = Math.min(Math.max(0, state.cursor), state.group.length - 1);
    state.group[idx].classList.add('cursor');
  }
}

cluesEls.forEach(li => li.addEventListener('click', ()=>{
  highlightClue(Number(li.dataset.clue), li.dataset.dir);
}));

// clicking a cell: if it belongs to a word, highlight that word and move cursor to the clicked index
allCells.forEach(cell => {
  cell.addEventListener('click', ()=>{
    if(cell.dataset.word){
      highlightClue(Number(cell.dataset.word), cell.dataset.dir);
      // set cursor to clicked cell within group
      const idx = state.group.indexOf(cell);
      if(idx >= 0){
        state.cursor = idx;
        updateCursor();
      }
    } else {
      // clicking a blank cell clears selection
      clearVisual();
      state = {num:null,dir:null,cursor:0,group:[]};
    }
  });
});

/* KEYBOARD INPUT */
document.addEventListener('keydown', (e)=>{
  if(!state.group || state.group.length === 0) return;

  // printable letters A-Z
  if(e.key.length === 1 && /[a-z]/i.test(e.key)){
    const cell = state.group[state.cursor];
    if(cell){
      cell.textContent = e.key.toUpperCase();
      // after input, advance cursor if possible
      if(state.cursor < state.group.length - 1) state.cursor++;
      updateCursor();
      if(errorToggle.checked) checkErrors();
    }
    e.preventDefault();
    return;
  }

  if(e.key === 'Backspace'){
    e.preventDefault();
    const cell = state.group[state.cursor];
    if(cell && (cell.textContent || '').trim() !== ''){
      // clear current cell (don't move)
      cell.textContent = '';
    } else {
      // if current empty, move left (or up) then clear
      if(state.cursor > 0) state.cursor--;
      const c = state.group[state.cursor];
      if(c) c.textContent = '';
    }
    updateCursor();
    if(errorToggle.checked) checkErrors();
    return;
  }

  // movement based on direction of the active clue
  if(state.dir === 'across'){
    if(e.key === 'ArrowRight'){ if(state.cursor < state.group.length - 1) state.cursor++; updateCursor(); e.preventDefault(); return; }
    if(e.key === 'ArrowLeft'){ if(state.cursor > 0) state.cursor--; updateCursor(); e.preventDefault(); return; }
    // let Up/Down optionally jump to crossing cells if desired (kept simple: move no-op)
  } else if(state.dir === 'down'){
    if(e.key === 'ArrowDown'){ if(state.cursor < state.group.length - 1) state.cursor++; updateCursor(); e.preventDefault(); return; }
    if(e.key === 'ArrowUp'){ if(state.cursor > 0) state.cursor--; updateCursor(); e.preventDefault(); return; }
  }

  // allow Esc to clear selection
  if(e.key === 'Escape'){ clearVisual(); state = {num:null,dir:null,cursor:0,group:[]}; e.preventDefault(); return; }
});

/* ---------------------------
   ERROR CHECKING
   --------------------------- */
function checkErrors(){
  allCells.forEach(c=>{
    const ans = (c.dataset.answer || '').toUpperCase();
    const txt = (c.textContent || '').trim().toUpperCase();
    if(ans){
      c.classList.toggle('error', txt !== ans);
    } else {
      c.classList.remove('error');
    }
  });
}

// initial run (if checkbox is checked)
if(errorToggle.checked) checkErrors();
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked){ allCells.forEach(c=>c.classList.remove('error')); return; }
  checkErrors();
});

/* ---------------------------
   Helpful: expose some debug tools (console)
   --------------------------- */
window._crossword = {
  cellMap,
  words,
  allCells,
  highlightClue
};
</script>
</body>
</html>
