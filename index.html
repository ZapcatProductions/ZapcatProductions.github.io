<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen-1 Pokémon 12x12 Mini Crossword</title>

<style>
body{
  margin:0;
  font-family:system-ui, Arial, sans-serif;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
#titleScreen{
  position:fixed;
  inset:0;
  background:rgba(11,18,32,0.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
}
#gameWrapper{display:flex;gap:20px;}
main{
  display:grid;
  grid-template-columns:repeat(12,40px);
  grid-template-rows:repeat(12,40px);
  gap:2px;
}
ins,del{
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  text-transform:uppercase;
  position:relative;
}
del{background:black;}
ins{
  background:white;
  color:black;
  cursor:text;
}
ins[data-clue]:before{
  content:attr(data-clue);
  position:absolute;
  top:2px;
  left:3px;
  font-size:10px;
  color:#333;
}
.highlight{background:#d9edff!important;}
.cursor{outline:3px solid #3399ff;}
.error{background:#ffb5b5!important;}

button{
  padding:10px 20px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#3a8dff;
  color:white;
  cursor:pointer;
}
button:hover{filter:brightness(1.15);}
</style>
</head>

<body>

<div id="titleScreen">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 Mini Crossword — 8 Pokémon</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameWrapper">

<main id="grid">

<!-- 12×12 GRID BUILT CLEAN -->

<!-- row 1 ALAKAZAM (ACROSS 1) -->
<ins data-answer="A" data-clue="1" data-clues="across-1,down-1"></ins>
<ins data-answer="L" data-clues="across-1"></ins>
<ins data-answer="A" data-clues="across-1"></ins>
<ins data-answer="K" data-clues="across-1"></ins>
<ins data-answer="A" data-clues="across-1,down-4"></ins>
<ins data-answer="Z" data-clues="across-1"></ins>
<ins data-answer="A" data-clues="across-1"></ins>
<ins data-answer="M" data-clues="across-1"></ins>
<del></del><del></del><del></del><del></del>

<!-- row 2 -->
<ins data-answer="B" data-clues="down-1"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>
<del></del><del></del><del></del><del></del>

<!-- row 3 EKANS (ACROSS 2) -->
<ins data-answer="R" data-clues="down-1"></ins>
<ins data-answer="E" data-clue="2" data-clues="across-2,down-2"></ins>
<ins data-answer="K" data-clues="across-2"></ins>
<ins data-answer="A" data-clues="across-2"></ins>
<ins data-answer="N" data-clues="across-2"></ins>
<ins data-answer="S" data-clues="across-2"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 4 -->
<ins data-answer="A" data-clues="down-1"></ins>
<del></del>
<ins data-answer="R" data-clues="down-2"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 5 MEW (ACROSS 3) -->
<ins data-answer="M" data-clues="down-1,across-3" data-clue="3"></ins>
<ins data-answer="E" data-clues="across-3"></ins>
<ins data-answer="W" data-clues="across-3,down-3"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 6 -->
<ins data-answer="Z" data-clues="down-1"></ins>
<del></del><del></del>
<ins data-answer="E" data-clues="down-3"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 7 SNEASEL (ACROSS 4) -->
<ins data-answer="A" data-clues="down-1"></ins>
<del></del>
<ins data-answer="S" data-clue="4" data-clues="across-4"></ins>
<ins data-answer="N" data-clues="across-4,down-4"></ins>
<ins data-answer="E" data-clues="across-4"></ins>
<ins data-answer="A" data-clues="across-4"></ins>
<ins data-answer="S" data-clues="across-4"></ins>
<ins data-answer="E" data-clues="across-4"></ins>
<ins data-answer="L" data-clues="across-4"></ins>
<del></del><del></del><del></del>

<!-- row 8 -->
<ins data-answer="M" data-clues="down-1"></ins>
<del></del><del></del>
<ins data-answer="O" data-clues="down-4"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 9 -->
<ins data-answer="A" data-clues="down-1"></ins>
<del></del><del></del>
<ins data-answer="N" data-clues="down-4"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 10 -->
<ins data-answer="M" data-clues="down-1"></ins>
<del></del><del></del>
<ins data-answer="I" data-clues="down-4"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 11 -->
<ins data-answer="A" data-clues="down-1"></ins>
<del></del><del></del>
<ins data-answer="X" data-clues="down-4"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- row 12 -->
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

</main>

<div>
<ul>
<li><b>Across</b></li>
<li>1 ALAKAZAM</li>
<li>2 EKANS</li>
<li>3 MEW</li>
<li>4 SNEASEL</li>
</ul>
<br>
<ul>
<li><b>Down</b></li>
<li>1 ABRA</li>
<li>2 ARBOK</li>
<li>3 MEW</li>
<li>4 ONIX</li>
</ul>
</div>

</div>

<script>
document.getElementById("startBtn").onclick=()=>document.getElementById("titleScreen").style.display="none";

const cells=[...document.querySelectorAll("ins")];

document.addEventListener("keydown",e=>{
  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const focused=document.querySelector(".cursor")||cells[0];
    focused.textContent=e.key.toUpperCase();
    focused.classList.toggle("error",focused.textContent!==focused.dataset.answer);
  }
});
</script>

</body>
</html>
