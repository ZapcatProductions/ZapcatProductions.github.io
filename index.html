<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gen-1 Pokémon 12x12 — Fixed</title>
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#eaf2ff}
#titleScreen{position:fixed;inset:0;background:rgba(3,6,12,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:16px}
#gameWrapper{display:none;gap:20px;padding:28px;align-items:flex-start;display:flex}
main#grid{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:40px;gap:2px}
ins,del{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase}
del{background:#000}
ins{background:#fff;color:#051322;border:1px solid #9aa3b2;position:relative}
ins[data-clue]:before{content:attr(data-clue);position:absolute;top:2px;left:4px;font-size:10px;color:#444}
.highlight{background:#d8f1ff !important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3 !important}
#panelWrapper{width:300px}
ul{list-style:none;padding:0;margin:0}
li.heading{font-weight:800;margin:8px 0}
li[data-clue]{padding:8px;border-radius:6px;cursor:pointer}
li.current{background:rgba(58,141,255,.08);color:var(--accent)}
#timer{margin-bottom:12px}
label{display:flex;align-items:center;gap:8px;font-size:14px}
</style>
</head>
<body>

<!-- START OVERLAY -->
<div id="titleScreen" role="dialog" aria-modal="true">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 — 8 Pokémon (4 across, 4 down)</p>
  <button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="gameWrapper" aria-hidden="true">
  <div>
    <div id="timer">Time: 0:00</div>
    <main id="grid" aria-label="crossword grid">
      <!-- ROW 1 -->
      <ins data-clues="across-1" data-answer="A" data-clue="1"></ins>
      <ins data-clues="across-1" data-answer="L"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="K"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="Z"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <ins data-clues="across-1" data-answer="M"></ins>
      <!-- columns 9-12: down starts -->
      <ins data-clues="down-5" data-answer="A" data-clue="5"></ins>
      <ins data-clues="down-6" data-answer="P" data-clue="6"></ins>
      <ins data-clues="down-7" data-answer="A" data-clue="7"></ins>
      <ins data-clues="down-8" data-answer="S" data-clue="8"></ins>

      <!-- ROW 2 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-5" data-answer="B"></ins>
      <ins data-clues="down-6" data-answer="I"></ins>
      <ins data-clues="down-7" data-answer="R"></ins>
      <ins data-clues="down-8" data-answer="Q"></ins>

      <!-- ROW 3 (EKANS across cols1-5) -->
      <ins data-clues="across-2" data-answer="E" data-clue="2"></ins>
      <ins data-clues="across-2" data-answer="K"></ins>
      <ins data-clues="across-2" data-answer="A"></ins>
      <ins data-clues="across-2" data-answer="N"></ins>
      <ins data-clues="across-2" data-answer="S"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-5" data-answer="R"></ins>
      <ins data-clues="down-6" data-answer="K"></ins>
      <ins data-clues="down-7" data-answer="B"></ins>
      <ins data-clues="down-8" data-answer="U"></ins>

      <!-- ROW 4 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-5" data-answer="A"></ins>
      <ins data-clues="down-6" data-answer="A"></ins>
      <ins data-clues="down-7" data-answer="O"></ins>
      <ins data-clues="down-8" data-answer="I"></ins>

      <!-- ROW 5 (MEW across cols1-3) -->
      <ins data-clues="across-3" data-answer="M" data-clue="3"></ins>
      <ins data-clues="across-3" data-answer="E"></ins>
      <ins data-clues="across-3" data-answer="W"></ins>
      <del></del><del></del><del></del><del></del><del></del>
      <del></del>
      <ins data-clues="down-6" data-answer="C"></ins>
      <ins data-clues="down-7" data-answer="K"></ins>
      <ins data-clues="down-8" data-answer="R"></ins>

      <!-- ROW 6 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <del></del
      ><ins data-clues="down-6" data-answer="H"></ins>
      <del></del>
      <del></del>
      <ins data-clues="down-8" data-answer="T"></ins>

      <!-- ROW 7 (GYARADOS across cols1-8) -->
      <ins data-clues="across-4" data-answer="G" data-clue="4"></ins>
      <ins data-clues="across-4" data-answer="Y"></ins>
      <ins data-clues="across-4" data-answer="A"></ins>
      <ins data-clues="across-4" data-answer="R"></ins>
      <ins data-clues="across-4" data-answer="A"></ins>
      <ins data-clues="across-4" data-answer="D"></ins>
      <ins data-clues="across-4" data-answer="O"></ins>
      <ins data-clues="across-4" data-answer="S"></ins>
      <del></del>
      <ins data-clues="down-6" data-answer="U"></ins>
      <del></del>
      <ins data-clues="down-8" data-answer="L"></ins>

      <!-- ROW 8 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
      <ins data-clues="down-8" data-answer="E"></ins>

      <!-- ROW 9 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 10 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 11 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- ROW 12 -->
      <del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>
    </main>
  </div>

  <div id="panelWrapper">
    <div id="timer">Time: 0:00</div>
    <label><input type="checkbox" id="errorToggle" checked> Error check</label>
    <div class="panels">
      <ul id="across">
        <li class="heading">Across</li>
        <li data-dir="across" data-clue="1" data-length="8">1. ALAKAZAM</li>
        <li data-dir="across" data-clue="2" data-length="5">2. EKANS</li>
        <li data-dir="across" data-clue="3" data-length="3">3. MEW</li>
        <li data-dir="across" data-clue="4" data-length="8">4. GYARADOS</li>
      </ul>

      <ul id="down" style="margin-top:12px">
        <li class="heading">Down</li>
        <li data-dir="down" data-clue="5" data-length="4">5. ABRA</li>
        <li data-dir="down" data-clue="6" data-length="7">6. PIKACHU</li>
        <li data-dir="down" data-clue="7" data-length="5">7. ARBOK</li>
        <li data-dir="down" data-clue="8" data-length="8">8. SQUIRTLE</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* START + TIMER */
const startBtn = document.getElementById('startBtn');
const titleScreen = document.getElementById('titleScreen');
const gameWrapper = document.getElementById('gameWrapper');
const panelTimer = document.querySelector('#panelWrapper #timer');
let seconds=0, timerInterval;
startBtn.addEventListener('click', ()=>{
  titleScreen.style.display='none';
  gameWrapper.style.display='flex';
  gameWrapper.setAttribute('aria-hidden','false');
  seconds=0;
  panelTimer.textContent='Time: 0:00';
  timerInterval = setInterval(()=>{
    seconds++;
    const m=Math.floor(seconds/60), s=seconds%60;
    panelTimer.textContent = 'Time: '+m+':'+(s<10?'0':'')+s;
  },1000);
});

/* CORE LOGIC */
const cells = Array.from(document.querySelectorAll('main ins'));
const clues = Array.from(document.querySelectorAll('li[data-clue]'));
const errorToggle = document.getElementById('errorToggle');
let state = { clue:null, dir:null, cursor:0 };

/* helpers */
function clearVisual(){
  cells.forEach(c=>c.classList.remove('highlight','cursor'));
  clues.forEach(l=>l.classList.remove('current'));
}
function highlight(clueNum, dir){
  clearVisual();
  cells.forEach(c=>{
    if(!c.dataset.clues) return;
    const map = c.dataset.clues.split(',');
    for(const entry of map){
      const [d,num] = entry.split('-').map(s=>s.trim());
      if(d===dir && +num===+clueNum) { c.classList.add('highlight'); break; }
    }
  });
  state.cursor = 0;
  moveCursor();
}
function moveCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length===0) return;
  const target = highlighted[Math.min(state.cursor, highlighted.length-1)];
  target && target.classList.add('cursor');
}
function checkErrors(){
  if(!errorToggle.checked) return;
  cells.forEach(c=>{
    if(!c.dataset.answer){ c.classList.remove('error'); return; }
    const txt = (c.textContent || '').trim().toUpperCase();
    if(!txt) { c.classList.remove('error'); return; }
    c.classList.toggle('error', txt !== c.dataset.answer);
  });
}

/* clue clicks */
clues.forEach(li=>{
  li.addEventListener('click', function(){
    state.clue = +this.dataset.clue;
    state.dir = this.dataset.dir;
    state.cursor = 0;
    highlight(state.clue, state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    this.classList.add('current');
  });
});

/* cell clicks: toggle between clues on that cell (if multiple) */
cells.forEach(cell=>{
  cell.addEventListener('click', ()=>{
    if(!cell.dataset.clues) return;
    const map = cell.dataset.clues.split(',').map(s=>s.trim());
    // if current selected matches one in map, cycle to next; else choose first.
    let choice = map[0];
    if(state.clue !== null){
      const currentTag = `${state.dir}-${state.clue}`;
      const idx = map.indexOf(currentTag);
      if(idx !== -1){
        choice = map[(idx+1) % map.length];
      }
    }
    const [dir,num] = choice.split('-').map(s=>s.trim());
    state.dir = dir; state.clue = +num; state.cursor = 0;
    highlight(state.clue, state.dir);
    clues.forEach(l=>l.classList.remove('current'));
    const li = document.querySelector(`li[data-clue="${num}"][data-dir="${dir}"]`);
    li && li.classList.add('current');
  });
});

/* keyboard input */
document.addEventListener('keydown', e=>{
  if(state.clue===null) return;
  const highlighted = cells.filter(c=>c.classList.contains('highlight'));
  if(highlighted.length===0) return;

  // arrows
  if(e.key==='ArrowRight' && state.dir==='across'){ if(state.cursor < highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft' && state.dir==='across'){ if(state.cursor > 0) state.cursor--; moveCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowDown' && state.dir==='down'){ if(state.cursor < highlighted.length-1) state.cursor++; moveCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowUp' && state.dir==='down'){ if(state.cursor > 0) state.cursor--; moveCursor(); e.preventDefault(); return; }

  // letter input
  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const target = highlighted[state.cursor];
    if(target){
      target.textContent = e.key.toUpperCase();
      if(errorToggle.checked && target.dataset.answer) target.classList.toggle('error', target.textContent !== target.dataset.answer);
      else target.classList.remove('error');
    }
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    e.preventDefault();
    return;
  }

  // backspace
  if(e.key === 'Backspace'){
    const target = highlighted[state.cursor];
    if(target){ target.textContent = ''; target.classList.remove('error'); }
    if(state.cursor > 0) state.cursor--;
    moveCursor();
    e.preventDefault();
    return;
  }
});

/* error checkbox toggle re-check or clear */
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) cells.forEach(c=>c.classList.remove('error'));
  else checkErrors();
});
</script>
</body>
</html>
