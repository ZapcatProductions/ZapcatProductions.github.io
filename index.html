<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;font-family:system-ui,sans-serif;background:#0b1220;color:#eaf2ff;overflow:hidden;}
#header{height:48px;background:#1e3a8a;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:600;}
#title{font-size:16px;}
#header-right{display:flex;align-items:center;gap:12px;}
#timer{font-variant-numeric:tabular-nums;}
#settings-btn{cursor:pointer;}
#main{display:flex;height:calc(100vh-48px);padding:20px;}
#grid-wrap{flex:1;display:flex;justify-content:center;align-items:center;overflow:auto;}
#grid{display:grid;gap:2px;background:black;}
.cell{width:50px;height:50px;background:#1f2937;position:relative;display:flex;align-items:center;justify-content:center;}
.cell.block{background:black;}
.cell input{width:100%;height:100%;background:transparent;border:none;color:#eaf2ff;font-size:20px;text-align:center;text-transform:uppercase;caret-color:#93c5fd;}
.cell input:focus{outline:none;}
.cell.active{background:#60a5fa;}
.cell.highlight{background:#2563eb;}
.number{position:absolute;top:2px;left:4px;font-size:12px;opacity:0.8;}
#clues{width:280px;background:#0f172a;border-left:1px solid #1e3a8a;padding:14px;overflow-y:auto;}
.section{font-weight:bold;color:#60a5fa;margin-top:12px;}
.clue{padding:6px;cursor:pointer;}
.clue.active{background:#1e40af;}
#settings-panel{position:fixed;right:0;top:48px;width:260px;height:calc(100vh-48px);background:#020617;border-left:1px solid #1e3a8a;padding:14px;display:none;z-index:5000;}
.setting{margin-bottom:12px;}
.setting label{display:flex;justify-content:space-between;cursor:pointer;}
#start-container{position:fixed;inset:0;background:rgba(11,18,32,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;}
#start-container button{padding:10px 20px;font-size:18px;cursor:pointer;background:#2563eb;border:none;color:white;border-radius:6px;margin-top:10px;}
#thankyou{margin-top:20px;font-size:14px;color:#93c5fd;}
</style>
</head>
<body>
<div id="header">
  <div id="title">Mini Crossword</div>
  <div id="header-right">
    <div id="timer">00:00</div>
    <div id="settings-btn">⚙</div>
  </div>
</div>

<div id="main">
  <div id="grid-wrap"><div id="grid"></div></div>
  <div id="clues">
    <div class="section">ACROSS</div><div id="across"></div>
    <div class="section">DOWN</div><div id="down"></div>
  </div>
</div>

<div id="settings-panel">
  <div class="setting"><label>Auto-advance<input type="checkbox" id="auto-advance" checked></label></div>
  <div class="setting"><label>Show mistakes<input type="checkbox" id="show-mistakes"></label></div>
</div>

<div id="start-container">
  <div>Welcome to Mini Crossword!</div>
  <button id="start-game">Start Game</button>
  <div id="thankyou">Thank you for playing!</div>
</div>

<script>
// =========================
// PUZZLE DATA (MODULAR)
// =========================
let puzzleData = {
  grid:[
    ['B','U','L','B','A'],
    ['.','I','.','Y','S'],
    ['C','H','A','R','M'],
    ['.','E','.','L','E'],
    ['S','Q','U','I','R']
  ],
  across:{
    1:{text:"Grass starter",row:0,col:0,length:5},
    3:{text:"Middle fire",row:2,col:0,length:5},
    5:{text:"Water starter",row:4,col:0,length:5}
  },
  down:{
    1:{text:"Bulbasaur evolution",row:0,col:0,length:5},
    2:{text:"Charmander evolution",row:0,col:3,length:3},
    3:{text:"Squirtle evolution",row:2,col:4,length:3}
  }
};

// =========================
// GLOBALS
// =========================
const gridEl=document.getElementById('grid');
const acrossEl=document.getElementById('across');
const downEl=document.getElementById('down');
const startContainer=document.getElementById('start-container');
const startBtn=document.getElementById('start-game');
const settingsBtn=document.getElementById('settings-btn');
const settingsPanel=document.getElementById('settings-panel');
const timerEl=document.getElementById('timer');

let cells=[],activeEntry=null,direction='across',timerInterval=null,seconds=0;

// =========================
// TIMER
// =========================
function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{seconds++;let m=String(Math.floor(seconds/60)).padStart(2,'0');let s=String(seconds%60).padStart(2,'0');timerEl.textContent=`${m}:${s}`;},1000);}

// =========================
// SETTINGS
// =========================
settingsBtn.onclick=()=>{settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';}

// =========================
// GRID BUILD
// =========================
const rows=puzzleData.grid.length;
const cols=puzzleData.grid[0].length;
gridEl.style.gridTemplateColumns=`repeat(${cols},50px)`;

// AUTO NUMBERING
let clueNumber=1;
let acrossList=[],downList=[];
for(let r=0;r<rows;r++){
  cells[r]=[];
  for(let c=0;c<cols;c++){
    const cell=document.createElement('div');cell.className='cell';
    const val=puzzleData.grid[r][c];
    if(val==='.'||!val){cell.classList.add('block');gridEl.appendChild(cell);cells[r][c]=cell;continue;}
    const input=document.createElement('input');input.maxLength=1;input.dataset.row=r;input.dataset.col=c;cell.appendChild(input);

    // NUMBER LOGIC
    const startAcross=(c===0||!puzzleData.grid[r][c-1])&&(c<cols-1 && puzzleData.grid[r][c+1]);
    const startDown=(r===0||!puzzleData.grid[r-1][c])&&(r<rows-1 && puzzleData.grid[r+1][c]);
    if(startAcross||startDown){
      const n=document.createElement('div');n.className='number';n.textContent=clueNumber;cell.appendChild(n);
      if(startAcross){let list=[];let cc=c;while(cc<cols && puzzleData.grid[r][cc] && puzzleData.grid[r][cc]!=='.'){list.push([r,cc]);cc++;}acrossList.push({number:clueNumber,cells:list});}
      if(startDown){let list=[];let rr=r;while(rr<rows && puzzleData.grid[rr][c] && puzzleData.grid[rr][c]!=='.'){list.push([rr,c]);rr++;}downList.push({number:clueNumber,cells:list});}
      clueNumber++;
    }

    cell.onclick=()=>activateCell(r,c);
    gridEl.appendChild(cell);
    cells[r][c]=cell;
  }
}

// =========================
// RENDER CLUES
// =========================
function renderClues(){
  acrossEl.innerHTML='';downEl.innerHTML='';
  acrossList.forEach(entry=>{const div=document.createElement('div');div.className='clue';div.textContent=`${entry.number}. ${puzzleData.across[entry.number]?.text||''}`;div.onclick=()=>activateEntry(entry,'across');entry.el=div;acrossEl.appendChild(div);});
  downList.forEach(entry=>{const div=document.createElement('div');div.className='clue';div.textContent=`${entry.number}. ${puzzleData.down[entry.number]?.text||''}`;div.onclick=()=>activateEntry(entry,'down');entry.el=div;downEl.appendChild(div);});
}

// =========================
// ACTIVATION
// =========================
function activateEntry(entry,dir){
  clearHighlights();
  entry.cells.forEach(([r,c])=>{cells[r][c].classList.add('highlight');});
  const [r0,c0]=entry.cells[0];cells[r0][c0].classList.add('active');cells[r0][c0].querySelector('input')?.focus();
  direction=dir;activeEntry=entry;
  document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));entry.el.classList.add('active');
}

function activateCell(r,c){
  const hit=(direction==='across'?acrossList:downList).find(e=>e.cells.some(p=>p[0]===r&&p[1]===c))||
            (direction==='across'?downList:acrossList).find(e=>e.cells.some(p=>p[0]===r&&p[1]===c));
  if(hit)activateEntry(hit,direction==='across'?direction:'down');
}

// =========================
// INPUT HANDLING
// =========================
document.addEventListener('keydown',e=>{
  if(!activeEntry) return;
  const key=e.key.toUpperCase();const input=document.activeElement;
  const idx=activeEntry.cells.findIndex(([r,c])=>cells[r][c].querySelector('input')===input);
  if(key==='BACKSPACE'){input.value='';if(idx>0){const [r,c]=activeEntry.cells[idx-1];cells[r][c].querySelector('input').focus();}e.preventDefault();}
  else if(key.length===1 && key.match(/[A-Z]/i)){input.value=key;if(document.getElementById('auto-advance')?.checked){if(idx<activeEntry.cells.length-1){const [r,c]=activeEntry.cells[idx+1];cells[r][c].querySelector('input').focus();}}e.preventDefault();}
  else if(key==='ARROWLEFT'||key==='ARROWRIGHT'||key==='ARROWUP'||key==='ARROWDOWN'){let r=Number(input.dataset.row),c=Number(input.dataset.col);switch(key){case'ARROWLEFT':c--;break;case'ARROWRIGHT':c++;break;case'ARROWUP':r--;break;case'ARROWDOWN':r++;break;}if(cells[r]&&cells[r][c]&&!cells[r][c].classList.contains('block'))cells[r][c].querySelector('input').focus();e.preventDefault();}
});

// =========================
// HIGHLIGHTS RESET
// =========================
function clearHighlights(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active','highlight'));document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));}

// =========================
// START BUTTON
// =========================
startBtn.onclick=()=>{startContainer.style.display='none';renderClues();activateEntry(acrossList[0],'across');startTimer();}
</script>
</body>
</html>
