<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f2f2f2;
}

/* TOP BAR */
#topbar {
    background: #9ac57a;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-weight: 600;
}

/* SETTINGS */
#settingsBtn { cursor: pointer; }
#settings {
    display: none;
    position: fixed;
    top: 56px;
    right: 16px;
    background: white;
    border: 1px solid #ccc;
    padding: 12px;
    width: 220px;
    z-index: 10;
}

/* ACTIVE CLUE */
#active-clue {
    background: white;
    border-bottom: 1px solid #ccc;
    padding: 10px;
    font-size: 14px;
}

/* ERROR DISCLAIMER */
#errorDisclaimer {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffcccc;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    z-index: 30;
}

/* LAYOUT */
#game {
    display: grid;
    grid-template-columns: auto 320px;
    gap: 16px;
    padding: 16px;
    max-width: 900px;
    margin: auto;
    position: relative;
}

/* GRID */
#grid {
    display: grid;
    gap: 2px;
    background: black;
    border: 2px solid black;
}

.cell {
    width: 70px;
    height: 70px;
    background: #808080;
    position: relative;
    font-weight: bold;
    font-size: 28px;
    text-transform: uppercase;
    text-align: center;
    line-height: 70px;
    cursor: pointer;
}

.cell.block { background: black; }
.cell.highlight { background: #dbeaff; }
.cell.error { background: #ff4c4c; }
.cell.correct { background: white; }

.cell input {
    width: 100%;
    height: 100%;
    border: none;
    text-align: center;
    font-size: 28px;
    text-transform: uppercase;
    background: transparent;
    font-weight: bold;
    pointer-events: none;
}

.cell input:focus { outline: none; }

/* NUMBER */
.number {
    position: absolute;
    top: 3px;
    left: 4px;
    font-size: 10px;
    font-weight: 600;
}

/* CLUES */
#clues {
    background: white;
    border: 1px solid #ccc;
    padding: 12px;
    overflow-y: auto;
}

.clue {
    font-size: 14px;
    padding: 4px;
    cursor: pointer;
}

.clue.active { background: #dbeaff; }

/* PRELOADER */
#preloader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    opacity: 1;
    transition: opacity 0.8s ease;
    pointer-events: none;
}
</style>
</head>
<body>

<div id="topbar">
    ← Back
    <div id="timer">00:00</div>
    <div id="settingsBtn">⚙️</div>
</div>

<div id="settings">
    <strong>Settings</strong><br><br>
    <label><input type="checkbox" id="errorCheck" checked> Error Check Mode</label>
</div>

<div id="errorDisclaimer">Error Mode Enabled</div>

<div id="active-clue">
    <strong>Across 1.</strong> Having learned something
</div>

<div id="game">
    <div id="grid"></div>
    <div id="clues">
        <h3>Across</h3>
        <div class="clue" data-number="1" data-direction="across">1. Having learned something</div>
        <div class="clue" data-number="6" data-direction="across">6. What gives a reader pause?</div>
        <h3>Down</h3>
        <div class="clue" data-number="1" data-direction="down">1. Lays</div>
        <div class="clue" data-number="2" data-direction="down">2. Charged, in a way</div>
    </div>

    <div id="preloader">Loading...</div>
</div>

<script>
const gridData = [
    ['L','E','A','R','N'],
    ['P','A','U','S','E'],
    ['W','H','E','R','E'],
    [null,'C','H','I','P'],
    [null,'S','O','N','G']
];

const numbers = { '0,0':1, '1,0':6, '3,1':2 };
const cluesMap = {
    '1_across': [[0,0],[0,1],[0,2],[0,3],[0,4]],
    '6_across': [[1,0],[1,1],[1,2],[1,3],[1,4]],
    '1_down': [[0,0],[1,0],[2,0]],
    '2_down': [[3,1],[4,1]]
};

const grid = document.getElementById('grid');
const errorCheckToggle = document.getElementById('errorCheck');
const errorDisclaimer = document.getElementById('errorDisclaimer');

grid.style.gridTemplateColumns = `repeat(${gridData[0].length},70px)`;
grid.style.gridTemplateRows = `repeat(${gridData.length},70px)`;

const cells = [];
for (let r=0;r<gridData.length;r++){
    cells[r] = [];
    for (let c=0;c<gridData[r].length;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        if(gridData[r][c]===null){
            cell.classList.add('block');
        } else {
            const input = document.createElement('input');
            input.maxLength = 1;
            input.dataset.row = r;
            input.dataset.col = c;
            cell.appendChild(input);

            const key = `${r},${c}`;
            if(numbers[key]){
                const n = document.createElement('div');
                n.className = 'number';
                n.textContent = numbers[key];
                cell.appendChild(n);
            }

            // Input event for error checking & auto advance
            input.addEventListener('input', () => {
                const correct = gridData[r][c].toUpperCase();
                if(errorCheckToggle.checked){
                    if(input.value.toUpperCase() !== correct && input.value !== ''){
                        cell.classList.add('error');
                        cell.classList.remove('correct');
                    } else if(input.value.toUpperCase() === correct){
                        cell.classList.add('correct');
                        cell.classList.remove('error');
                    } else {
                        cell.classList.remove('error');
                        cell.classList.remove('correct');
                    }
                } else {
                    cell.classList.remove('error');
                    cell.classList.remove('correct');
                }

                // Auto-advance
                const positions = cluesMap[`${activeWord}_${activeDirection}`];
                if(!positions) return;
                const idx = positions.findIndex(([rr,cc])=>rr===r && cc===c);
                if(idx!==-1 && idx<positions.length-1){
                    const [nextR,nextC] = positions[idx+1];
                    const nextInput = cells[nextR][nextC].querySelector('input');
                    if(nextInput) nextInput.focus();
                }
            });

            // Click tile logic
            cell.addEventListener('click', () => {
                const matchingWords = [];
                for(const key in cluesMap){
                    if(cluesMap[key].some(([rr,cc])=>rr===r && cc===c)) matchingWords.push(key);
                }
                // Prefer current activeDirection if available
                const preferred = matchingWords.find(k=>k.endsWith(activeDirection)) || matchingWords[0];
                if(preferred){
                    const [num, dir] = preferred.split('_');
                    highlightWord(num, dir);
                }
            });

        }
        grid.appendChild(cell);
        cells[r][c] = cell;
    }
}

document.getElementById('settingsBtn').onclick = () => {
    const settings = document.getElementById('settings');
    settings.style.display = settings.style.display==='block' ? 'none':'block';
};

// Error disclaimer
errorCheckToggle.addEventListener('change', () => {
    errorDisclaimer.textContent = errorCheckToggle.checked ? 'Error Mode Enabled' : 'Error Mode Disabled';
    errorDisclaimer.style.opacity = 1;
    setTimeout(() => { errorDisclaimer.style.opacity = 0; }, 1200);
});

// Timer
let seconds = 0;
function updateTimer(){
    seconds++;
    const mins = String(Math.floor(seconds/60)).padStart(2,'0');
    const secs = String(seconds%60).padStart(2,'0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
}

// Highlight word
let activeWord = null;
let activeDirection = 'across';

function highlightWord(number,direction){
    cells.flat().forEach(cell => cell.classList.remove('highlight'));
    document.querySelectorAll('.clue').forEach(clue=>clue.classList.remove('active'));
    const key = `${number}_${direction}`;
    const positions = cluesMap[key];
    if(!positions) return;

    positions.forEach(([r,c]) => cells[r][c].classList.add('highlight'));

    const clueEl = document.querySelector(`.clue[data-number='${number}'][data-direction='${direction}']`);
    if(clueEl) clueEl.classList.add('active');

    document.getElementById('active-clue').innerHTML = `<strong>${direction.charAt(0).toUpperCase()+direction.slice(1)} ${number}.</strong> ${clueEl.textContent.split('. ').slice(1).join('. ')}`;

    const firstCell = cells[positions[0][0]][positions[0][1]];
    const input = firstCell.querySelector('input');
    if(input) input.focus();

    activeWord = number;
    activeDirection = direction;
}

// Click clues with toggle
document.querySelectorAll('.clue').forEach(clue => {
    clue.addEventListener('click', () => {
        const number = clue.dataset.number;
        const direction = clue.dataset.direction;

        if(activeWord == number){
            const otherDirection = activeDirection==='across'?'down':'across';
            if(cluesMap[`${number}_${otherDirection}`]){
                highlightWord(number,otherDirection);
                return;
            }
        }
        highlightWord(number,direction);
    });
});

// Initial highlight
highlightWord(1,'across');

// Preloader fade and timer start
window.addEventListener('load', () => {
    const preloader = document.getElementById('preloader');
    preloader.style.opacity = 0;
    setTimeout(() => { preloader.style.display = 'none'; }, 800);

    setInterval(updateTimer,1000);
});
</script>
</body>
</html>
