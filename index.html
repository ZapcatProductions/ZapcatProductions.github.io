<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Blocks Survival</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family:sans-serif; background:#111; color:#fff; overflow:hidden; }
#gameCanvas { background:#222; display:block; margin:0 auto; border:2px solid #fff; }
#menu, #gameOver { 
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
  text-align:center; background:#333; padding:20px; border:2px solid #fff;
}
button { padding:10px 20px; margin:5px; cursor:pointer; font-size:16px; }
#controlsGuide { font-size:14px; color:#0f0; margin-top:10px; }
</style>
</head>
<body>

<div id="menu">
  <h1>Falling Blocks Survival</h1>
  <p id="controlsGuide">
    Controls:<br>
    Arrow Left ← : Move Left<br>
    Arrow Right → : Move Right
  </p>
  <button id="startBtn">Start Game</button>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div id="gameOver" style="display:none;">
  <h2 id="overText">Game Over!</h2>
  <p id="scoreText"></p>
  <button id="restartBtn">Restart</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x:180, y:550, w:40, h:40, speed:6 };
let obstacles = [];
let collectibles = [];
let score = 0;
let highScore = localStorage.getItem('highScore') || 0;
let level = 1;
let gameRunning = false;
let keys = {};
let obstacleTimer = 0;
let collectibleTimer = 0;
let levelTime = 0;

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

const startBtn = document.getElementById('startBtn');
const menu = document.getElementById('menu');
const gameOverDiv = document.getElementById('gameOver');
const restartBtn = document.getElementById('restartBtn');
const scoreText = document.getElementById('scoreText');

startBtn.onclick = () => startGame();
restartBtn.onclick = () => startGame();

function startGame() {
  menu.style.display = 'none';
  gameOverDiv.style.display = 'none';
  player.x=180; player.y=550; score=0; level=1; obstacles=[]; collectibles=[];
  obstacleTimer=0; collectibleTimer=0; levelTime=0;
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning=false;
  if(score>highScore) {
    highScore = score;
    localStorage.setItem('highScore', highScore);
  }
  scoreText.innerHTML = `Score: ${score}<br>High Score: ${highScore}`;
  gameOverDiv.style.display='block';
}

function spawnObstacle() {
  const width = Math.random()*50+20;
  obstacles.push({ x:Math.random()*(canvas.width-width), y:-20, w:width, h:20, speed:2+level*0.5 });
}

function spawnCollectible() {
  const size = 15;
  collectibles.push({ x:Math.random()*(canvas.width-size), y:-20, w:size, h:size, speed:1.5+level*0.3 });
}

function update() {
  if(keys['ArrowLeft'] && player.x>0) player.x -= player.speed;
  if(keys['ArrowRight'] && player.x+player.w<canvas.width) player.x += player.speed;

  obstacleTimer++;
  collectibleTimer++;
  levelTime++;

  if(obstacleTimer > 30 - level*2) { spawnObstacle(); obstacleTimer=0; }
  if(collectibleTimer > 150 - level*5) { spawnCollectible(); collectibleTimer=0; }

  obstacles.forEach(ob => ob.y += ob.speed);
  obstacles = obstacles.filter(ob => ob.y < canvas.height);

  collectibles.forEach(col => col.y += col.speed);
  collectibles = collectibles.filter(col => col.y < canvas.height);

  // Collision with obstacles
  for(let ob of obstacles) {
    if(player.x < ob.x+ob.w && player.x+player.w>ob.x &&
       player.y < ob.y+ob.h && player.y+player.h>ob.y) {
      endGame();
    }
  }

  // Collision with collectibles
  for(let i=collectibles.length-1; i>=0; i--) {
    const col = collectibles[i];
    if(player.x < col.x+col.w && player.x+player.w>col.x &&
       player.y < col.y+col.h && player.y+player.h>col.y) {
      score += 50; // bonus points
      collectibles.splice(i,1);
    }
  }

  score += 1;
  if(levelTime % 1000 === 0) level++; // increase difficulty every ~1000 frames
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle = '#0f0';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // obstacles
  ctx.fillStyle = '#f00';
  obstacles.forEach(ob => ctx.fillRect(ob.x, ob.y, ob.w, ob.h));

  // collectibles
  ctx.fillStyle = '#ff0';
  collectibles.forEach(col => ctx.fillRect(col.x, col.y, col.w, col.h));

  // score
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Score: ${score}  Level: ${level}`, 10,30);
  ctx.fillText(`High Score: ${highScore}`, 10,60);
}

function gameLoop() {
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
