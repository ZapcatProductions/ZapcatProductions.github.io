<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword – Cute Animals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* GLOBAL RESET */
*{box-sizing:border-box;} 
html,body{margin:0;padding:0;height:100%;font-family:system-ui,sans-serif;background:#0b1220;color:#eaf2ff;overflow:hidden;}
/* HEADER */
#header{height:48px;background:#1e3a8a;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:600;}
#header #title{font-size:16px;}
#header-right{display:flex;align-items:center;gap:12px;}
#timer{font-variant-numeric:tabular-nums;}
#start-btn,#settings-btn{cursor:pointer;user-select:none;}
/* MAIN */
#main{display:flex;height:calc(100vh-48px-80px);padding:20px;} /* leave room for banner */
#grid-wrap{flex:1;display:flex;justify-content:center;align-items:center;}
#grid{display:grid;gap:2px;background:black;}
.cell{width:50px;height:50px;background:#1f2937;position:relative;display:flex;align-items:center;justify-content:center;}
.cell.block{background:black;}
.cell input{width:100%;height:100%;background:transparent;border:none;color:#eaf2ff;font-size:20px;text-align:center;text-transform:uppercase;caret-color:#93c5fd;}
.cell input:focus{outline:none;}
.cell.highlight{background:#2563eb;}
.cell.active{background:#60a5fa;}
.number{position:absolute;top:2px;left:4px;font-size:12px;opacity:0.8;}
/* CLUES */
#clues{width:280px;background:#0f172a;border-left:1px solid #1e3a8a;padding:14px;overflow-y:auto;}
.section{font-weight:bold;color:#60a5fa;margin-top:12px;}
.clue{padding:6px;cursor:pointer;}
.clue.active{background:#1e40af;}
/* SETTINGS */
#settings-panel{position:fixed;right:0;top:48px;width:260px;height:calc(100vh-48px);background:#020617;border-left:1px solid #1e3a8a;padding:14px;display:none;z-index:5000;}
.setting{margin-bottom:12px;}
.setting label{display:flex;justify-content:space-between;cursor:pointer;}
/* START */
#start-container{position:fixed;inset:0;background:rgba(11,18,32,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;}
#start-container button{padding:10px 20px;font-size:18px;cursor:pointer;background:#2563eb;border:none;color:white;border-radius:6px;margin-top:10px;}
#thankyou{margin-top:20px;font-size:14px;color:#93c5fd;}
/* BANNER AD */
#ad-banner{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:728px;height:auto;text-align:center;z-index:999;background:transparent;}
</style>
</head>
<body>

<div id="header">
  <div id="title">Mini Crossword – Cute Animals</div>
  <div id="header-right">
    <div id="timer">00:00</div>
    <div id="start-btn">▶ Start</div>
    <div id="settings-btn">⚙</div>
  </div>
</div>

<div id="main">
  <div id="grid-wrap"><div id="grid"></div></div>
  <div id="clues">
    <div class="section">ACROSS</div><div id="across"></div>
    <div class="section">DOWN</div><div id="down"></div>
  </div>
</div>

<div id="settings-panel">
  <div class="setting"><label>Auto-advance<input type="checkbox" id="auto-advance" checked></label></div>
  <div class="setting"><label>Show mistakes<input type="checkbox" id="show-mistakes"></label></div>
</div>

<div id="start-container">
  <div>Welcome to Mini Crossword!</div>
  <button id="start-game">Start Game</button>
  <div id="thankyou">Thank you for playing!</div>
</div>

<!-- BANNER AD: HighPerformanceFormat -->
<div id="ad-banner">
<script>
  atOptions = {
    'key' : '53132848729ca78c1b5d61c90db3f910',
    'format' : 'iframe',
    'height' : 600,
    'width' : 160,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/53132848729ca78c1b5d61c90db3f910/invoke.js"></script>
</div>

<script>
// =========================
// CONFIGURABLE PUZZLE DATA
// =========================
let puzzleData = {
  grid:[
    ['C','A','T','.','D','O','G'],
    ['A','.','R','.','O','.','O'],
    ['R','A','B','B','I','T','.'],
    ['.','.','.','.','G','.','.'],
    ['F','O','X','.','B','E','E']
  ],
  across:{
    1:{text:"Feline friend",row:0,col:0,length:3},
    4:{text:"Canine buddy",row:0,col:4,length:3},
    7:{text:"Hops around",row:2,col:0,length:6},
    11:{text:"Clever wild animal",row:4,col:0,length:3},
    13:{text:"Pollinating insect",row:4,col:4,length:3}
  },
  down:{
    2:{text:"Noisy farm animal",row:0,col:2,length:3},
    3:{text:"Lives in a den",row:0,col:6,length:3},
    5:{text:"Small orange animal",row:2,col:4,length:3}
  }
};

// =========================
// GLOBAL VARIABLES
// =========================
const gridEl=document.getElementById('grid');
const acrossEl=document.getElementById('across');
const downEl=document.getElementById('down');
const startContainer=document.getElementById('start-container');
const startBtn=document.getElementById('start-game');
const settingsBtn=document.getElementById('settings-btn');
const settingsPanel=document.getElementById('settings-panel');
const timerEl=document.getElementById('timer');

let timerInterval=null,seconds=0,activeEntry=null;
let cells=[];

// =========================
// TIMER
// =========================
function startTimer(){
  if(timerInterval) return;
  timerInterval=setInterval(()=>{
    seconds++;
    let m=String(Math.floor(seconds/60)).padStart(2,'0');
    let s=String(seconds%60).padStart(2,'0');
    timerEl.textContent=`${m}:${s}`;
  },1000);
}

// =========================
// SETTINGS TOGGLE
// =========================
settingsBtn.onclick=()=>{settingsPanel.style.display=settingsPanel.style.display==='block'?'none':'block';}

// =========================
// GRID GENERATION
// =========================
const rows=puzzleData.grid.length;
const cols=puzzleData.grid[0].length;
gridEl.style.gridTemplateColumns=`repeat(${cols},50px)`;

for(let r=0;r<rows;r++){
  cells[r]=[];
  for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    const letter=puzzleData.grid[r][c];
    if(letter==='.' || !letter){cell.classList.add('block');gridEl.appendChild(cell);cells[r][c]=cell;continue;}
    const input=document.createElement('input');input.maxLength=1;input.dataset.row=r;input.dataset.col=c;
    cell.appendChild(input);
    cell.onclick=()=>activateCell(r,c);
    gridEl.appendChild(cell);
    cells[r][c]=cell;
  }
}

// =========================
// RENDER CLUES
// =========================
function renderClues(){
  for(let n in puzzleData.across){
    const clue=puzzleData.across[n];
    const div=document.createElement('div');div.className='clue';
    div.textContent=`${n}. ${clue.text}`;
    div.onclick=()=>activateCell(clue.row,clue.col);
    acrossEl.appendChild(div); clue.el=div;
  }
  for(let n in puzzleData.down){
    const clue=puzzleData.down[n];
    const div=document.createElement('div');div.className='clue';
    div.textContent=`${n}. ${clue.text}`;
    div.onclick=()=>activateCell(clue.row,clue.col);
    downEl.appendChild(div); clue.el=div;
  }
}

// =========================
// CELL ACTIVATION
// =========================
function activateCell(r,c){
  clearHighlights();
  const cell=cells[r][c]; if(!cell) return;
  cell.classList.add('active');
  activeEntry={row:r,col:c};
  const input=cell.querySelector('input'); if(input) input.focus();
  for(let n in puzzleData.across){let clue=puzzleData.across[n];if(clue.row===r) clue.el.classList.add('active');}
  for(let n in puzzleData.down){let clue=puzzleData.down[n];if(clue.col===c) clue.el.classList.add('active');}
}

function clearHighlights(){
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active','highlight'));
  document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));
}

// =========================
// INPUT HANDLING
// =========================
document.addEventListener('input',e=>{
  const target=e.target; if(target.tagName!=='INPUT') return;
  const val=target.value.toUpperCase(); target.value=val;
  const r=Number(target.dataset.row); const c=Number(target.dataset.col);
  const correct=puzzleData.grid[r][c];
  if(document.getElementById('show-mistakes')?.checked){
    if(val!==correct) target.style.background='#991b1b';
    else target.style.background='transparent';
  }
  if(document.getElementById('auto-advance')?.checked){
    // Move to next non-block cell in row first, else down
    let nextC=c+1;
    while(nextC<cols && cells[r][nextC]?.classList.contains('block')) nextC++;
    if(nextC<cols && cells[r][nextC] && cells[r][nextC].querySelector('input')){cells[r][nextC].querySelector('input').focus(); return;}
    let nextR=r+1;
    while(nextR<rows && cells[nextR][c]?.classList.contains('block')) nextR++;
    if(nextR<rows && cells[nextR][c] && cells[nextR][c].querySelector('input')) cells[nextR][c].querySelector('input').focus();
  }
});

// =========================
// START BUTTON
// =========================
startBtn.onclick=()=>{
  startContainer.style.display='none';
  renderClues();
  activateCell(0,0);
  startTimer();
}
</script>
</body>
</html>
