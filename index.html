<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e0e0e0;
    font-family: sans-serif;
  }

  /* GAME CONTAINER (THE BOX IS THE GAME) */
  #game-container {
    width: 360px;
    height: 360px;
    background: white;
    border: 2px solid black;
    position: relative;
    box-sizing: border-box;
    padding: 12px;
  }

  /* GRID SCALES TO FIT CONTAINER */
  #grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 2px;
  }

  .cell {
    width: 100%;
    height: 100%;
    border: 1px solid black;
    box-sizing: border-box;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    text-transform: uppercase;
    outline: none;
  }

  .cell:focus {
    background: #eef;
  }

  .block {
    background: black;
  }

  /* AD OVERLAY */
  #ad-overlay {
    position: absolute;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    z-index: 10;
  }
</style>
</head>

<body>

<div id="game-container">

  <div id="grid"></div>

  <div id="ad-overlay">Loading…</div>

</div>

<script>
  /* MINI CROSSWORD LAYOUT
     Empty string = black square
  */
  const layout = [
    ["H","E","L","L","O"],
    ["A","","","", "R"],
    ["P","A","N","E","L"],
    ["P","","","", "O"],
    ["Y","E","A","R","S"]
  ];

  const grid = document.getElementById("grid");

  layout.forEach((row) => {
    row.forEach((letter) => {
      if (letter === "") {
        const block = document.createElement("div");
        block.className = "cell block";
        grid.appendChild(block);
      } else {
        const input = document.createElement("input");
        input.className = "cell";
        input.maxLength = 1;
        input.dataset.answer = letter;

        input.addEventListener("input", () => {
          input.value = input.value.toUpperCase();
          focusNext(input);
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value) {
            focusPrev(input);
          }
        });

        grid.appendChild(input);
      }
    });
  });

  function focusNext(current) {
    const cells = [...document.querySelectorAll(".cell:not(.block)")];
    const i = cells.indexOf(current);
    if (cells[i + 1]) cells[i + 1].focus();
  }

  function focusPrev(current) {
    const cells = [...document.querySelectorAll(".cell:not(.block)")];
    const i = cells.indexOf(current);
    if (cells[i - 1]) cells[i - 1].focus();
  }

  /* SIMULATED AD */
  setTimeout(() => {
    document.getElementById("ad-overlay").style.display = "none";
    const first = document.querySelector(".cell:not(.block)");
    if (first) first.focus();
  }, 3000);
</script>

</body>
</html>
