<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crosshare-style Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #1e1e1e;
  color: #fff;
}

/* HEADER */
#header {
  height: 48px;
  background: #7a4a24;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-weight: 600;
}

/* MAIN LAYOUT */
#main {
  display: grid;
  grid-template-columns: auto 360px;
  height: calc(100vh - 48px);
}

/* GRID */
#grid {
  display: grid;
  gap: 2px;
  background: black;
  padding: 16px;
  justify-content: center;
  align-content: start;
}

.cell {
  width: 52px;
  height: 52px;
  background: #444;
  position: relative;
}

.cell.block {
  background: black;
}

.cell input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  color: white;
  font-size: 24px;
  text-align: center;
  text-transform: uppercase;
}

.cell input:focus {
  outline: none;
}

.cell.highlight {
  background: #9c6a3d;
}

.cell.active {
  background: #c78a52;
}

.number {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 11px;
  opacity: 0.8;
}

/* CLUES */
#clues {
  background: #222;
  border-left: 1px solid #333;
  padding: 12px;
  overflow-y: auto;
}

.section-title {
  font-weight: bold;
  margin: 12px 0 6px;
  color: #c78a52;
}

.clue {
  padding: 4px;
  cursor: pointer;
}

.clue.active {
  background: #333;
}
</style>
</head>

<body>

<div id="header">
  <div>CROSSHARE</div>
  <div>00:00</div>
</div>

<div id="main">
  <div id="grid"></div>

  <div id="clues">
    <div class="section-title">ACROSS</div>
    <div id="across"></div>

    <div class="section-title">DOWN</div>
    <div id="down"></div>
  </div>
</div>

<script>
// ================= GRID DEFINITION =================
// null = black square
const GRID = [
  ['E','G','G',null,null],
  ['C',null,'U',null,null],
  ['L',null,'G','L','A'],
  ['A',null,null,null,null],
  ['I',null,'F','L','O']
];

// Clue text indexed by number
const ACROSS_CLUES = {
  1: "Sherlock's creator's monogram",
  4: "Attack en masse",
  6: "Collection of songs"
};

const DOWN_CLUES = {
  1: "He shrugged, according to Ayn Rand",
  2: "Serpentine yoga pose",
  3: "Celtic priest"
};

// ================= BUILD GRID =================
const gridEl = document.getElementById('grid');
const rows = GRID.length;
const cols = GRID[0].length;
gridEl.style.gridTemplateColumns = `repeat(${cols},52px)`;

const cells = [];
let number = 1;
const across = [];
const down = [];

function isLetter(r,c){
  return GRID[r]?.[c] !== null && GRID[r]?.[c] !== undefined;
}

for(let r=0;r<rows;r++){
  cells[r] = [];
  for(let c=0;c<cols;c++){
    const cell = document.createElement('div');
    cell.className = 'cell';

    if(!isLetter(r,c)){
      cell.classList.add('block');
      gridEl.appendChild(cell);
      cells[r][c] = cell;
      continue;
    }

    const input = document.createElement('input');
    input.maxLength = 1;
    cell.appendChild(input);

    const startAcross = isLetter(r,c) && !isLetter(r,c-1) && isLetter(r,c+1);
    const startDown = isLetter(r,c) && !isLetter(r-1,c) && isLetter(r+1,c);

    if(startAcross || startDown){
      const num = document.createElement('div');
      num.className = 'number';
      num.textContent = number;
      cell.appendChild(num);

      if(startAcross){
        let cc=c;
        const word=[];
        while(isLetter(r,cc)){
          word.push([r,cc]);
          cc++;
        }
        across.push({number, cells: word});
      }

      if(startDown){
        let rr=r;
        const word=[];
        while(isLetter(rr,c)){
          word.push([rr,c]);
          rr++;
        }
        down.push({number, cells: word});
      }

      number++;
    }

    gridEl.appendChild(cell);
    cells[r][c] = cell;
  }
}

// ================= CLUES =================
const acrossEl = document.getElementById('across');
const downEl = document.getElementById('down');

function renderClues(list, container, direction){
  list.forEach(entry=>{
    const div = document.createElement('div');
    div.className = 'clue';
    div.textContent = `${entry.number}. ${(direction==='across'?ACROSS_CLUES:DOWN_CLUES)[entry.number] || ''}`;
    div.onclick = ()=>activate(entry, direction);
    container.appendChild(div);
    entry.el = div;
  });
}

renderClues(across, acrossEl, 'across');
renderClues(down, downEl, 'down');

// ================= INTERACTION =================
let active = null;

function activate(entry, direction){
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('highlight','active'));
  document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));

  entry.cells.forEach(([r,c],i)=>{
    cells[r][c].classList.add('highlight');
    if(i===0) cells[r][c].classList.add('active');
  });

  entry.el.classList.add('active');

  const [r,c] = entry.cells[0];
  cells[r][c].querySelector('input').focus();
  active = entry;
}

// Auto-advance
document.addEventListener('input',e=>{
  if(!active) return;
  const input = e.target;
  if(input.tagName!=='INPUT') return;

  const pos = active.cells.findIndex(([r,c])=>cells[r][c].contains(input));
  if(pos>-1 && pos<active.cells.length-1){
    const [nr,nc] = active.cells[pos+1];
    cells[nr][nc].querySelector('input').focus();
  }
});

// Initial
activate(across[0],'across');
</script>

</body>
</html>
