<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:system-ui,sans-serif;background:#0b1220;color:#eaf2ff;display:flex;justify-content:center;align-items:flex-start;height:100vh;}
#crossword-container{display:flex;gap:20px;padding:20px;}
#grid{display:grid;grid-template-columns:repeat(5,60px);grid-gap:2px;}
.cell{width:60px;height:60px;position:relative;background:#1f2937;display:flex;justify-content:center;align-items:center;}
.cell.block{background:black;}
.cell input{width:100%;height:100%;border:none;background:transparent;color:#eaf2ff;font-size:24px;text-align:center;text-transform:uppercase;caret-color:#93c5fd;}
.cell input:focus{outline:none;}
.number{position:absolute;top:2px;left:3px;font-size:12px;opacity:0.7;}
.cell.highlight{background:#2563eb;}
.cell.active{background:#60a5fa;}
#clues{width:200px;background:#0f172a;padding:10px;overflow-y:auto;}
h3{color:#60a5fa;margin:5px 0;}
.clue{cursor:pointer;margin:2px 0;padding:2px;}
.clue.active{background:#1e40af;}
</style>
</head>
<body>
<div id="crossword-container">
  <div id="grid"></div>
  <div id="clues">
    <h3>ACROSS</h3><div id="across"></div>
    <h3>DOWN</h3><div id="down"></div>
  </div>
</div>
<script>
// ===== DATA MODEL =====
const puzzle={
  grid:[
    ['C','A','T',null,'S'],
    ['O',null,'O',null,'E'],
    ['W','A','R','S','H'],
    [null,'E',null,'T',null],
    ['F','O','X',null,'Y']
  ],
  clues:{
    across:{
      1:{text:"Feline pet",x:0,y:0,length:3,direction:"across"},
      2:{text:"Sneaky animal",x:4,y:0,length:3,direction:"across"},
      3:{text:"To clean with water",x:2,y:0,length:4,direction:"across"}
    },
    down:{
      1:{text:"Opposite of off",x:0,y:0,length:3,direction:"down"},
      2:{text:"Common greeting",x:0,y:4,length:3,direction:"down"},
      3:{text:"Bird sound",x:1,y:1,length:3,direction:"down"}
    }
  }
};

// ===== ENGINE =====
const gridEl=document.getElementById('grid');
const acrossEl=document.getElementById('across');
const downEl=document.getElementById('down');
const rows=puzzle.grid.length, cols=puzzle.grid[0].length;
const cells=[], across=[], down=[];
let clueCounter=1, activeWord=null;

// CREATE GRID
for(let r=0;r<rows;r++){
  cells[r]=[];
  for(let c=0;c<cols;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    const letter=puzzle.grid[r][c];
    if(!letter){cell.classList.add('block');gridEl.appendChild(cell);cells[r][c]=cell;continue;}
    const input=document.createElement('input'); input.maxLength=1; cell.appendChild(input);

    // check if clue starts here
    const startAcross = Object.values(puzzle.clues.across).some(cl=>cl.x===r && cl.y===c);
    const startDown = Object.values(puzzle.clues.down).some(cl=>cl.x===r && cl.y===c);
    if(startAcross || startDown){
      const n=document.createElement('div'); n.className='number'; n.textContent=clueCounter; cell.appendChild(n);
      if(startAcross){let cc=c,list=[]; while(cc<cols && puzzle.grid[r][cc]){list.push([r,cc]);cc++;} across.push({number:clueCounter,cells:list,el:null});}
      if(startDown){let rr=r,list=[]; while(rr<rows && puzzle.grid[rr][c]){list.push([rr,c]);rr++;} down.push({number:clueCounter,cells:list,el:null});}
      clueCounter++;
    }

    cell.onclick=()=>activateFromCell(r,c);
    gridEl.appendChild(cell);
    cells[r][c]=cell;
  }
}

// RENDER CLUES
function renderClues(list,el,map){for(const entry of list){const div=document.createElement('div');div.className='clue';div.textContent=`${entry.number}. ${map[entry.number]||''}`;div.onclick=()=>activate(entry);entry.el=div;el.appendChild(div);}}
renderClues(across,acrossEl,puzzle.clues.across);
renderClues(down,downEl,puzzle.clues.down);

// HIGHLIGHT LOGIC
function clearHighlights(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('highlight','active'));document.querySelectorAll('.clue').forEach(c=>c.classList.remove('active'));}
function activate(entry){clearHighlights();entry.cells.forEach(([r,c],i)=>{cells[r][c].classList.add('highlight');if(i===0)cells[r][c].classList.add('active');cells[r][c].querySelector('input').focus();});entry.el.classList.add('active');activeWord=entry;}
function activateFromCell(r,c){const hit=across.concat(down).find(a=>a.cells.some(p=>p[0]===r&&p[1]===c)); if(hit) activate(hit);}

// AUTO-ADVANCE
document.addEventListener('input',e=>{if(!activeWord)return; const idx=activeWord.cells.findIndex(([r,c])=>cells[r][c].contains(e.target)); if(idx>-1 && idx<activeWord.cells.length-1){const [nr,nc]=activeWord.cells[idx+1]; cells[nr][nc].querySelector('input').focus();}});
</script>
</body>
</html>
