<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen-1 Pokémon 12x12 Mini Crossword</title>

<style>
body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#titleScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(11,18,32,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:10}
button{padding:10px 25px;border-radius:8px;border:none;font-size:18px;cursor:pointer;background:#3a8dff;color:white}
button:hover{filter:brightness(1.15)}
#gameWrapper{display:flex;gap:20px;align-items:flex-start}
main{display:grid;grid-template-columns:repeat(12,40px);grid-template-rows:repeat(12,40px);gap:2px;justify-content:center}
ins,del{border-radius:5px;display:flex;justify-content:center;align-items:center;font-size:18px;text-transform:uppercase;cursor:text;position:relative}
del{background:black}
ins{background:white;border:1px solid #666;color:black}
ins[data-clue]:before{content:attr(data-clue);position:absolute;top:2px;left:2px;font-size:10px;color:#333}
.highlight{background:#d8f1ff!important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3!important}
#panelWrapper{display:flex;flex-direction:column;gap:15px}
.panels{display:flex;flex-direction:column;gap:10px}
ul{list-style:none;padding:0;margin:0}
li.heading{font-weight:bold;margin-bottom:5px}
li[data-clue]{cursor:pointer;padding:2px 0}
li.current{color:#7cc8ff}
#timer{text-align:center;margin-bottom:10px;font-size:16px}
</style>
</head>

<body>

<div id="titleScreen">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>12×12 Mini Crossword — 8 Pokémon</p>
  <button id="startBtn">Start Game</button>
</div>

<div id="gameWrapper">

<main id="grid">

<!-- Layout is 12×12. Non-answer cells are black. -->

<!-- ROW 1 – ALAKAZAM across + ABRA down start -->
<ins data-clues="across-1,down-1" data-answer="A" data-clue="1"></ins>
<ins data-clues="across-1" data-answer="L"></ins>
<ins data-clues="across-1" data-answer="A"></ins>
<ins data-clues="across-1" data-answer="K"></ins>
<ins data-clues="across-1" data-answer="A"></ins>
<ins data-clues="across-1" data-answer="Z"></ins>
<ins data-clues="across-1" data-answer="A"></ins>
<ins data-clues="across-1" data-answer="M"></ins>
<del></del><del></del><del></del><del></del>

<!-- ROW 2 -->
<ins data-clues="down-1" data-answer="B"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 3 – EKANS across, starts ARBOK down -->
<ins data-clues="down-1" data-answer="R"></ins>
<del></del>
<ins data-clues="across-2,down-2" data-answer="E" data-clue="2"></ins>
<ins data-clues="across-2" data-answer="K"></ins>
<ins data-clues="across-2" data-answer="A"></ins>
<ins data-clues="across-2" data-answer="N"></ins>
<ins data-clues="across-2" data-answer="S"></ins>
<del></del><del></del><del></del><del></del><del></del>

<!-- ROW 4 -->
<ins data-clues="down-1" data-answer="A"></ins>
<del></del>
<ins data-clues="down-2" data-answer="R"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 5 – MEW across + MEW down -->
<del></del>
<del></del>
<ins data-clues="across-3,down-3" data-answer="M" data-clue="3"></ins>
<ins data-clues="across-3" data-answer="E"></ins>
<ins data-clues="across-3" data-answer="W"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 6 -->
<del></del>
<del></del>
<ins data-clues="down-2" data-answer="B"></ins>
<del></del>
<ins data-clues="down-3" data-answer="E"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 7 – SNEASEL across + ONIX down -->
<del></del>
<del></del>
<ins data-clues="across-4,down-4" data-answer="S" data-clue="4"></ins>
<ins data-clues="across-4" data-answer="N"></ins>
<ins data-clues="across-4" data-answer="E"></ins>
<ins data-clues="across-4" data-answer="A"></ins>
<ins data-clues="across-4" data-answer="S"></ins>
<ins data-clues="across-4" data-answer="E"></ins>
<ins data-clues="across-4" data-answer="L"></ins>
<del></del><del></del><del></del>

<!-- ROW 8 -->
<del></del><del></del>
<ins data-clues="down-2" data-answer="O"></ins>
<del></del>
<ins data-clues="down-4" data-answer="N"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 9 -->
<del></del><del></del>
<ins data-clues="down-2" data-answer="K"></ins>
<del></del>
<ins data-clues="down-4" data-answer="I"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 10 -->
<del></del><del></del><del></del><del></del>
<ins data-clues="down-4" data-answer="X"></ins>
<del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 11 -->
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

<!-- ROW 12 all black -->
<del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del><del></del>

</main>

<div id="panelWrapper">

<div class="panels">
<ul id="across">
<li class="heading">Across</li>
<li data-dir="across" data-clue="1" data-length="8">1. ALAKAZAM</li>
<li data-dir="across" data-clue="2" data-length="5">2. EKANS</li>
<li data-dir="across" data-clue="3" data-length="3">3. MEW</li>
<li data-dir="across" data-clue="4" data-length="7">4. SNEASEL</li>
</ul>
</div>

<div class="panels">
<ul id="down">
<li class="heading">Down</li>
<li data-dir="down" data-clue="1" data-length="4">1. ABRA</li>
<li data-dir="down" data-clue="2" data-length="5">2. ARBOK</li>
<li data-dir="down" data-clue="3" data-length="3">3. MEW</li>
<li data-dir="down" data-clue="4" data-length="4">4. ONIX</li>
</ul>
</div>

</div>
</div>

<script>
// title screen / timer
let startBtn=document.getElementById("startBtn");
let titleScreen=document.getElementById("titleScreen");
let gameWrapper=document.getElementById("gameWrapper");
let seconds=0,timerInterval;
let timerElem=document.createElement("div");
timerElem.id="timer";
gameWrapper.prepend(timerElem);
startBtn.onclick=()=>{
 titleScreen.style.display="none";
 seconds=0;
 timerInterval=setInterval(()=>{
  seconds++;
  let m=Math.floor(seconds/60);
  let s=seconds%60;
  timerElem.textContent="Time: "+m+":"+(s<10?"0":"")+s;
 },1000);
};

// core crossword interactions
const cells=Array.from(document.querySelectorAll("main ins"));
const clues=Array.from(document.querySelectorAll("li[data-clue]"));
let state={clue:null,dir:null,cursor:0};

function clearVisual(){
 cells.forEach(c=>c.classList.remove("highlight","cursor"));
 clues.forEach(c=>c.classList.remove("current"));
}

function highlight(cnum,dir){
 clearVisual();
 cells.forEach(c=>{
  if(!c.dataset.clues)return;
  c.dataset.clues.split(",").forEach(tag=>{
    let[t,k]=tag.split("-");
    if(t===dir&&+k===cnum)c.classList.add("highlight");
  });
 });
 moveCursor();
}

function moveCursor(){
 cells.forEach(c=>c.classList.remove("cursor"));
 let h=cells.filter(c=>c.classList.contains("highlight"));
 if(h[state.cursor])h[state.cursor].classList.add("cursor");
}

clues.forEach(cl=>{
 cl.onclick=()=>{
  state.clue=+cl.dataset.clue;
  state.dir=cl.dataset.dir;
  state.cursor=0;
  highlight(state.clue,state.dir);
  cl.classList.add("current");
 }
});

cells.forEach(cell=>{
 cell.onclick=()=>{
  if(!cell.dataset.clues)return;
  let use=cell.dataset.clues.split(",")[0].split("-");
  state.dir=use[0];state.clue=+use[1];state.cursor=0;
  highlight(state.clue,state.dir);
 };
});

document.addEventListener("keydown",e=>{
 if(state.clue===null)return;
 let h=cells.filter(c=>c.classList.contains("highlight"));
 if(e.key==="ArrowRight"&&state.dir==="across"&&state.cursor<h.length-1){state.cursor++;return moveCursor();}
 if(e.key==="ArrowLeft"&&state.dir==="across"&&state.cursor>0){state.cursor--;return moveCursor();}
 if(e.key==="ArrowDown"&&state.dir==="down"&&state.cursor<h.length-1){state.cursor++;return moveCursor();}
 if(e.key==="ArrowUp"&&state.dir==="down"&&state.cursor>0){state.cursor--;return moveCursor();}
 if(e.key.length===1&&/[a-z]/i.test(e.key)){
  let t=h[state.cursor];
  if(t){
    t.textContent=e.key.toUpperCase();
    t.classList.toggle("error",t.dataset.answer!==t.textContent);
  }
  if(state.cursor<h.length-1){state.cursor++;moveCursor();}
 }
 if(e.key==="Backspace"){
  let t=h[state.cursor];
  if(t){t.textContent="";t.classList.remove("error");}
  if(state.cursor>0)state.cursor--;moveCursor();
 }
});
</script>

</body>
</html>
