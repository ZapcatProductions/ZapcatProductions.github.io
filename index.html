<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Pokémon Crossword</title>
<style>
  @import url('https://fonts.googleapis.com/css?family=Libre+Baskerville|Annie+Use+Your+Telescope');

  body {
    margin: 0;
    font-family: 'Libre Baskerville', serif;
    background-color: #c62828; /* Red background */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 2em;
    color: #fff;
    margin-bottom: 10px;
    text-align: center;
  }

  #ad {
    width: 100%;
    max-width: 900px;
    height: 50px;
    background: #fff;
    color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    border-radius: 8px;
  }

  main {
    display: grid;
    grid-template-columns: repeat(15, 40px);
    grid-template-rows: repeat(15, 40px);
    gap: 2px;
    background: transparent;
  }

  ins, del {
    border-radius: 4px;
    text-transform: uppercase;
    font-family: 'Annie Use Your Telescope', cursive;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: text;
    user-select: none;
  }

  ins {
    background: #fff;
    color: #000;
    border: 1px solid #444;
    font-size: 18px;
  }

  del {
    background: #000;
  }

  ins[data-clue]:before {
    content: attr(data-clue);
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 12px;
    font-weight: bold;
    color: #000;
  }

  /* Highlighting for selected word */
  ins.highlight {
    background-color: #bbdefb; /* light blue */
  }

  /* Active cursor */
  ins.cursor {
    box-shadow: inset 0 0 0 3px #2196f3; /* bright blue outline */
    animation: pulse 0.5s infinite alternate ease-in-out;
  }

  @keyframes pulse {
    from { box-shadow: inset 0 0 0 3px #2196f3; }
    to   { box-shadow: inset 0 0 0 5px #2196f3; }
  }

  /* Directional line */
  ins.direction {
    background-color: #ffeb3b; /* yellow behind */
    opacity: 0.3;
  }

  /* Error letters */
  ins.error {
    background-color: #f44336; /* red for wrong letters */
    color: #fff;
  }

  ul { list-style:none; padding:0; max-width:900px; margin-top:15px; }
  li.heading { font-weight:bold; padding: 10px 0; cursor:default; color:#fff; }
  li[data-clue] { padding:2px 5px; cursor:pointer; color:#fff; }
  #errorToggle { margin-left:5px; }
</style>
</head>
<body>

<h1>Pokémon Mini Crossword</h1>
<div id="ad">[Your Ad Here]</div>

<label style="color:#fff;">Error check <input type="checkbox" id="errorToggle" checked></label>

<main id="crossword"></main>

<ul>
  <li class="heading">Across</li>
  <li data-clue="1" data-dir="across" data-length="11">1. CHARMANDER</li>
  <li data-clue="4" data-dir="across" data-length="3">4. MEW</li>
  <li data-clue="5" data-dir="across" data-length="8">5. GYARADOS</li>
  <li data-clue="6" data-dir="across" data-length="7">6. SNEASEL</li>
</ul>

<ul>
  <li class="heading">Down</li>
  <li data-clue="1" data-dir="down" data-length="8">1. RAYQUAZA</li>
  <li data-clue="2" data-dir="down" data-length="4">2. ABRA</li>
  <li data-clue="3" data-dir="down" data-length="6">3. MEOWTH</li>
  <li data-clue="4" data-dir="down" data-length="4">4. ONIX</li>
</ul>

<script>
const grid = document.getElementById('crossword');
const letters = "ABCDEFGHIJKLMNO";

// Initialize 15x15 grid
let cells = [];
for(let r=1; r<=15; r++){
  for(let c=0; c<15; c++){
    const coord = letters[c]+r;
    const cell = document.createElement('ins');
    cell.dataset.coord = coord;
    cell.dataset.answer = "";
    // default all cells as black
    cell.classList.add('black-cell');
    grid.appendChild(cell);
    cells.push(cell);
  }
}

// Define Pokémon words and coordinates
const words = [
  {word:"CHARMANDER",dir:"across",start:"A1"},
  {word:"MEW",dir:"across",start:"C4"},
  {word:"GYARADOS",dir:"across",start:"B6"},
  {word:"SNEASEL",dir:"across",start:"B8"},
  {word:"RAYQUAZA",dir:"down",start:"K2"},
  {word:"ABRA",dir:"down",start:"L2"},
  {word:"MEOWTH",dir:"down",start:"D4"},
  {word:"ONIX",dir:"down",start:"H6"}
];

// Activate correct cells
words.forEach((w,i)=>{
  const col = w.start[0].charCodeAt(0)-65;
  const row = parseInt(w.start.slice(1))-1;
  for(let j=0;j<w.word.length;j++){
    let r = row + (w.dir==='down'?j:0);
    let c = col + (w.dir==='across'?j:0);
    const cell = cells[r*15+c];
    cell.classList.remove('black-cell');
    cell.dataset.answer = w.word[j];
    if(j===0) cell.dataset.clue = i+1;
  }
});

// Remove black-cell border styling
cells.forEach(c=>{ if(c.classList.contains('black-cell')) { c.style.background='#000'; c.textContent=''; } else { c.style.background='#fff'; } });

// CORE LOGIC
let state = {group:[],cursor:0,dir:null,num:null};
const errorToggle = document.getElementById('errorToggle');

// Highlight & cursor
function highlightWord(num, dir){
  state.group = cells.filter(c=>c.dataset.clue==num && (dir?c.dataset.answer: true));
  state.cursor = 0;
  state.dir = dir;
  state.num = num;
  cells.forEach(c=>c.classList.remove('highlight','cursor'));
  state.group.forEach(c=>c.classList.add('highlight'));
  if(state.group[0]) state.group[0].classList.add('cursor');
}

// Typing letters
document.addEventListener('keydown', e=>{
  if(!state.group.length) return;
  const cell = state.group[state.cursor];
  if(!cell) return;
  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    cell.textContent = e.key.toUpperCase();
    if(state.cursor<state.group.length-1) state.cursor++;
  } else if(e.key==="Backspace"){
    cell.textContent="";
    if(state.cursor>0) state.cursor--;
  } else if(e.key==="ArrowRight" || e.key==="ArrowDown") {
    if(state.cursor<state.group.length-1) state.cursor++;
  } else if(e.key==="ArrowLeft" || e.key==="ArrowUp") {
    if(state.cursor>0) state.cursor--;
  }
  cells.forEach(c=>c.classList.remove('cursor'));
  if(state.group[state.cursor]) state.group[state.cursor].classList.add('cursor');

  // Error checking
  if(errorToggle.checked){
    state.group.forEach(c=>{
      if(c.textContent && c.textContent.toUpperCase()!==c.dataset.answer) c.classList.add('error');
      else c.classList.remove('error');
    });
  }
});

// Click on starting tile to select
cells.forEach(c=>{
  c.addEventListener('click', ()=>{
    if(c.dataset.clue) highlightWord(c.dataset.clue, null);
  });
});
</script>
</body>
</html>
