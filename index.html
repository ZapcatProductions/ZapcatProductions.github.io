<!DOCTYPE html>

<title>Gen-1 Pokémon 12x12 Mini Crossword</title>
<style>
body{
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  background:#0b1220;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
main{
  display:grid;
  grid-template-columns:repeat(12,40px);
  grid-template-rows:repeat(12,40px);
  gap:2px;
}
ins,del{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  text-transform:uppercase;
  position:relative;
  border-radius:6px;
}
del{background:black;}
ins{background:white;color:black;border:1px solid #777;}
ins[data-clue]:before{
  content:attr(data-clue);
  position:absolute;
  top:2px;left:3px;
  font-size:10px;
  color:#333;
}
.highlight{background:#d9f1ff!important;}
.cursor{outline:3px solid #3a8dff;}
.error{background:#ffb3b3!important;}
#panelWrapper{margin-left:25px;}
</style>
</head>
