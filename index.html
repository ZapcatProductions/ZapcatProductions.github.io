<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon Mini Crossword (12×12) — Fixed overlap</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#eaf2ff;display:flex;align-items:flex-start;justify-content:center;padding:28px}
#wrapper{display:flex;gap:28px;align-items:flex-start;max-width:1200px;width:100%}
#grid{display:grid;grid-template-columns:repeat(12,44px);grid-auto-rows:44px;gap:6px;background:transparent}
.cell{width:44px;height:44px;background:#fff;color:#071322;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;user-select:none;cursor:text;border:1px solid #9aa3b2}
.black{width:44px;height:44px;background:#071322;border-radius:8px}
.topnum{position:absolute;top:4px;left:6px;font-size:10px;color:#334;pointer-events:none}
.highlight{background:#d8efff !important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3 !important}
#panel{width:360px}
#timers{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.clue-list{background:transparent;padding:0;margin:0;list-style:none;max-height:520px;overflow:auto}
li.heading{font-weight:800;margin:8px 0}
li.clue{padding:10px;border-radius:8px;cursor:pointer}
li.clue.current{background:rgba(58,141,255,.08);color:var(--accent)}
label{display:flex;align-items:center;gap:8px}
@media (max-width:880px){html,body{padding:14px} #wrapper{flex-direction:column;align-items:center} #panel{width:100%}}
</style>
</head>
<body>
<div id="wrapper">

  <!-- GRID -->
  <div>
    <div id="gridTimer">Time: 0:00</div>
    <main id="grid" aria-label="crossword grid">
      <!-- Row 0 -->
      <!-- CHARMANDER across (1) at row0 col0..9 -->
      <div class="cell" data-row="0" data-col="0" data-across="1" data-answer="C"><span class="topnum">1</span></div>
      <div class="cell" data-row="0" data-col="1" data-across="1" data-answer="H"></div>
      <div class="cell" data-row="0" data-col="2" data-across="1" data-answer="A"></div>
      <div class="cell" data-row="0" data-col="3" data-across="1" data-down="2" data-answer="R"><span class="topnum">2</span></div>
      <div class="cell" data-row="0" data-col="4" data-across="1" data-down="3" data-answer="M"><span class="topnum">3</span></div>
      <div class="cell" data-row="0" data-col="5" data-across="1" data-answer="A"></div>
      <div class="cell" data-row="0" data-col="6" data-across="1" data-answer="N"></div>
      <div class="cell" data-row="0" data-col="7" data-across="1" data-answer="D"></div>
      <div class="cell" data-row="0" data-col="8" data-across="1" data-answer="E"></div>
      <div class="cell" data-row="0" data-col="9" data-across="1" data-answer="R"></div>
      <!-- GYARADOS down (4) starts at row0 col10 -->
      <div class="cell" data-row="0" data-col="10" data-down="4" data-answer="G"><span class="topnum">4</span></div>
      <!-- MEW down (5) starts at row0 col11 -->
      <div class="cell" data-row="0" data-col="11" data-down="5" data-answer="M"><span class="topnum">5</span></div>

      <!-- Row 1 -->
      <div class="black" data-row="1" data-col="0"></div>
      <div class="black" data-row="1" data-col="1"></div>
      <div class="black" data-row="1" data-col="2"></div>
      <!-- RAYQUAZA runs down at col3 -->
      <div class="cell" data-row="1" data-col="3" data-down="2" data-answer="A"></div>
      <!-- MEOWTH down occupies col4 -->
      <div class="cell" data-row="1" data-col="4" data-down="3" data-answer="E"></div>
      <div class="black" data-row="1" data-col="5"></div>
      <div class="black" data-row="1" data-col="6"></div>
      <div class="black" data-row="1" data-col="7"></div>
      <div class="black" data-row="1" data-col="8"></div>
      <div class="black" data-row="1" data-col="9"></div>
      <div class="cell" data-row="1" data-col="10" data-down="4" data-answer="Y"></div>
      <div class="cell" data-row="1" data-col="11" data-down="5" data-answer="E"></div>

      <!-- Row 2 -->
      <div class="black" data-row="2" data-col="0"></div>
      <div class="black" data-row="2" data-col="1"></div>
      <div class="black" data-row="2" data-col="2"></div>
      <div class="cell" data-row="2" data-col="3" data-down="2" data-answer="Y"></div>
      <div class="cell" data-row="2" data-col="4" data-down="3" data-answer="O"></div>
      <div class="black" data-row="2" data-col="5"></div>
      <!-- ONIX across (6) placed at row2 col6..9 -->
      <div class="cell" data-row="2" data-col="6" data-across="6" data-answer="O"><span class="topnum">6</span></div>
      <div class="cell" data-row="2" data-col="7" data-across="6" data-answer="N"></div>

      <div class="cell" data-row="2" data-col="10" data-down="4" data-answer="A"></div>
      <div class="cell" data-row="2" data-col="11" data-down="5" data-answer="W"></div>

      <!-- Row 3 -->
      <div class="black" data-row="3" data-col="0"></div>
      <div class="black" data-row="3" data-col="1"></div>
      <div class="black" data-row="3" data-col="2"></div>
      <div class="cell" data-row="3" data-col="3" data-down="2" data-answer="Q"></div>
      <div class="cell" data-row="3" data-col="4" data-down="3" data-answer="W"></div>
      <div class="black" data-row="3" data-col="5"></div>
      <div class="black" data-row="3" data-col="6"></div>
      <div class="black" data-row="3" data-col="7"></div>
      <div class="black" data-row="3" data-col="8"></div>
      <div class="black" data-row="3" data-col="9"></div>
      <div class="cell" data-row="3" data-col="10" data-down="4" data-answer="R"></div>
      <div class="black" data-row="3" data-col="11"></div>

      <!-- Row 4 -->
      <div class="black" data-row="4" data-col="0"></div>
      <div class="black" data-row="4" data-col="1"></div>
      <div class="black" data-row="4" data-col="2"></div>
      <div class="cell" data-row="4" data-col="3" data-down="2" data-answer="U"></div>
      <div class="cell" data-row="4" data-col="4" data-down="3" data-answer="T"></div>
      <div class="black" data-row="4" data-col="5"></div>
      <div class="black" data-row="4" data-col="6"></div>
      <div class="black" data-row="4" data-col="7"></div>
      <div class="black" data-row="4" data-col="8"></div>
      <div class="black" data-row="4" data-col="9"></div>
      <div class="cell" data-row="4" data-col="10" data-down="4" data-answer="A"></div>
      <div class="black" data-row="4" data-col="11"></div>

      <!-- Row 5 -->
      <!-- ABRA across (7) row5 col0..3 -->
      <div class="cell" data-row="5" data-col="0" data-across="7" data-answer="A"><span class="topnum">7</span></div>
      <div class="cell" data-row="5" data-col="1" data-across="7" data-answer="B"></div>
      <div class="cell" data-row="5" data-col="2" data-across="7" data-answer="R"></div>
      <div class="cell" data-row="5" data-col="3" data-across="7" data-down="2" data-answer="A"></div>
      <div class="cell" data-row="5" data-col="4" data-down="3" data-answer="H"></div>
      <div class="black" data-row="5" data-col="5"></div>

      <div class="black" data-row="5" data-col="7"></div>
      <div class="black" data-row="5" data-col="8"></div>
      <div class="black" data-row="5" data-col="9"></div>
      <div class="cell" data-row="5" data-col="10" data-down="4" data-answer="D"></div>
      <div class="black" data-row="5" data-col="11"></div>

      <!-- Row 6 -->
      <div class="black" data-row="6" data-col="0"></div>
      <div class="black" data-row="6" data-col="1"></div>
      <div class="black" data-row="6" data-col="2"></div>
      <div class="cell" data-row="6" data-col="3" data-down="2" data-answer="Z"></div>
      <div class="black" data-row="6" data-col="4"></div>
      <div class="black" data-row="6" data-col="5"></div>
      <div class="black" data-row="6" data-col="6"></div>
      <div class="black" data-row="6" data-col="7"></div>
      <div class="black" data-row="6" data-col="8"></div>
      <div class="black" data-row="6" data-col="9"></div>
      <div class="cell" data-row="6" data-col="10" data-down="4" data-answer="O"></div>
      <div class="black" data-row="6" data-col="11"></div>

      <!-- Row 7 -->
      <div class="black" data-row="7" data-col="0"></div>
      <div class="black" data-row="7" data-col="1"></div>
      <div class="black" data-row="7" data-col="2"></div>
      <!-- THIS is Rayquaza's final A (row7 col3) — correct end of the down clue -->
      <div class="cell" data-row="7" data-col="3" data-down="2" data-answer="A"></div>
      <div class="black" data-row="7" data-col="4"></div>
      <div class="black" data-row="7" data-col="5"></div>
      <div class="black" data-row="7" data-col="6"></div>
      <div class="black" data-row="7" data-col="7"></div>
      <div class="black" data-row="7" data-col="8"></div>
      <div class="black" data-row="7" data-col="9"></div>
      <div class="cell" data-row="7" data-col="10" data-down="4" data-answer="S"></div>
      <div class="black" data-row="7" data-col="11"></div>

      <!-- Row 8 -->
      <!-- SNEASEL across (8) row8 col0..6 — its A is row8 col3 (separate cell, NOT part of Rayquaza) -->
      <div class="cell" data-row="8" data-col="0" data-across="8" data-answer="S"><span class="topnum">8</span></div>
      <div class="cell" data-row="8" data-col="1" data-across="8" data-answer="N"></div>
      <div class="cell" data-row="8" data-col="2" data-across="8" data-answer="E"></div>
      <div class="cell" data-row="8" data-col="3" data-across="8" data-answer="A"></div>
      <div class="cell" data-row="8" data-col="4" data-across="8" data-answer="S"></div>
      <div class="cell" data-row="8" data-col="5" data-across="8" data-answer="E"></div>
      <div class="cell" data-row="8" data-col="6" data-across="8" data-answer="L"></div>
      <div class="black" data-row="8" data-col="7"></div>
      <div class="black" data-row="8" data-col="8"></div>
      <div class="black" data-row="8" data-col="9"></div>
      <div class="black" data-row="8" data-col="10"></div>
      <div class="black" data-row="8" data-col="11"></div>

      <!-- Rows 9-11 are all black -->
      <div class="black" data-row="9" data-col="0"></div><div class="black" data-row="9" data-col="1"></div><div class="black" data-row="9" data-col="2"></div><div class="black" data-row="9" data-col="3"></div><div class="black" data-row="9" data-col="4"></div><div class="black" data-row="9" data-col="5"></div><div class="black" data-row="9" data-col="6"></div><div class="black" data-row="9" data-col="7"></div><div class="black" data-row="9" data-col="8"></div><div class="black" data-row="9" data-col="9"></div><div class="black" data-row="9" data-col="10"></div><div class="black" data-row="9" data-col="11"></div>
      <div class="black" data-row="10" data-col="0"></div><div class="black" data-row="10" data-col="1"></div><div class="black" data-row="10" data-col="2"></div><div class="black" data-row="10" data-col="3"></div><div class="black" data-row="10" data-col="4"></div><div class="black" data-row="10" data-col="5"></div><div class="black" data-row="10" data-col="6"></div><div class="black" data-row="10" data-col="7"></div><div class="black" data-row="10" data-col="8"></div><div class="black" data-row="10" data-col="9"></div><div class="black" data-row="10" data-col="10"></div><div class="black" data-row="10" data-col="11"></div>
      <div class="black" data-row="11" data-col="0"></div><div class="black" data-row="11" data-col="1"></div><div class="black" data-row="11" data-col="2"></div><div class="black" data-row="11" data-col="3"></div><div class="black" data-row="11" data-col="4"></div><div class="black" data-row="11" data-col="5"></div><div class="black" data-row="11" data-col="6"></div><div class="black" data-row="11" data-col="7"></div><div class="black" data-row="11" data-col="8"></div><div class="black" data-row="11" data-col="9"></div><div class="black" data-row="11" data-col="10"></div><div class="black" data-row="11" data-col="11"></div>
    </main>
  </div>

  <!-- PANEL -->
  <aside id="panel">
    <div id="panelTimer">Time: 0:00</div>
    <label><input type="checkbox" id="errorToggle" checked> Error check</label>

    <ul class="clue-list" id="across">
      <li class="heading">Across</li>
      <li class="clue" data-dir="across" data-clue="1" data-answer="CHARMANDER">1. CHARMANDER</li>
      <li class="clue" data-dir="across" data-clue="6" data-answer="ONIX">6. ONIX</li>
      <li class="clue" data-dir="across" data-clue="7" data-answer="ABRA">7. ABRA</li>
      <li class="clue" data-dir="across" data-clue="8" data-answer="SNEASEL">8. SNEASEL</li>
    </ul>

    <ul class="clue-list" id="down" style="margin-top:12px">
      <li class="heading">Down</li>
      <li class="clue" data-dir="down" data-clue="2" data-answer="RAYQUAZA">2. RAYQUAZA</li>
      <li class="clue" data-dir="down" data-clue="3" data-answer="MEOWTH">3. MEOWTH</li>
      <li class="clue" data-dir="down" data-clue="4" data-answer="GYARADOS">4. GYARADOS</li>
      <li class="clue" data-dir="down" data-clue="5" data-answer="MEW">5. MEW</li>
    </ul>
  </aside>

</div>

<script>
/* TIMER */
let seconds = 0;
const gridTimer = document.getElementById('gridTimer');
const panelTimer = document.getElementById('panelTimer');
function tick(){ seconds++; const m=Math.floor(seconds/60), s=seconds%60; const t=`Time: ${m}:${s<10?'0':''}${s}`; gridTimer.textContent=t; panelTimer.textContent=t }
setInterval(tick,1000);

/* CORE LOGIC */
const errorToggle = document.getElementById('errorToggle');
const allCells = Array.from(document.querySelectorAll('#grid .cell'));
const cluesEls = Array.from(document.querySelectorAll('.clue'));

function getGroupCells(clueNum, dir){
  const attr = dir === 'across' ? 'data-across' : 'data-down';
  const group = allCells.filter(c => c.getAttribute(attr) === String(clueNum));
  group.sort((a,b) => (+a.dataset.row - +b.dataset.row) || (+a.dataset.col - +b.dataset.col));
  return group;
}

let state = {num:null,dir:null,cursor:0,group:[]};

function clearVisual(){ allCells.forEach(c=>c.classList.remove('highlight','cursor')); cluesEls.forEach(l=>l.classList.remove('current')) }
function highlightClue(num,dir){
  clearVisual();
  const group = getGroupCells(num,dir);
  if(!group.length) return;
  group.forEach(c=>c.classList.add('highlight'));
  group[0].classList.add('cursor');
  const li = document.querySelector(`.clue[data-clue='${num}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  state = {num,dir,cursor:0,group};
}

/* clue click */
cluesEls.forEach(li => li.addEventListener('click', ()=> highlightClue(Number(li.dataset.clue), li.dataset.dir)));

/* cell click - prefer across if available */
allCells.forEach(cell => cell.addEventListener('click', ()=>{
  const a = cell.getAttribute('data-across'); const d = cell.getAttribute('data-down');
  if(a){ highlightClue(Number(a),'across'); return; }
  if(d){ highlightClue(Number(d),'down'); return; }
}));

function updateCursor(){ allCells.forEach(c=>c.classList.remove('cursor')); if(!state.group.length) return; const idx = Math.min(state.cursor, state.group.length-1); state.group[idx].classList.add('cursor'); }

function checkErrors(){
  if(!errorToggle.checked){ allCells.forEach(c=>c.classList.remove('error')); return; }
  allCells.forEach(c=>{
    const ans = c.dataset.answer; if(!ans) return;
    const txt = (c.textContent||'').trim().toUpperCase();
    c.classList.toggle('error', txt !== ans);
  });
}

/* typing/backspace/arrows */
document.addEventListener('keydown', (e)=>{
  if(state.num === null) return;
  const g = state.group;
  if(!g.length) return;

  if(e.key==='ArrowRight' && state.dir==='across'){ if(state.cursor<g.length-1) state.cursor++; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft' && state.dir==='across'){ if(state.cursor>0) state.cursor--; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowDown' && state.dir==='down'){ if(state.cursor<g.length-1) state.cursor++; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowUp' && state.dir==='down'){ if(state.cursor>0) state.cursor--; updateCursor(); e.preventDefault(); return; }

  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const cell = g[state.cursor];
    if(cell){ cell.textContent = e.key.toUpperCase(); if(errorToggle.checked && cell.dataset.answer) cell.classList.toggle('error', cell.textContent !== cell.dataset.answer); else cell.classList.remove('error'); }
    if(state.cursor < g.length-1) state.cursor++;
    updateCursor(); e.preventDefault(); return;
  }

  if(e.key==='Backspace'){
    const cell = g[state.cursor];
    if(cell){ cell.textContent=''; cell.classList.remove('error'); }
    if(state.cursor>0) state.cursor--;
    updateCursor(); e.preventDefault(); return;
  }
});

errorToggle.addEventListener('change', checkErrors);

/* allow clicking a highlighted cell to set cursor */
document.addEventListener('click', (ev)=>{
  const t = ev.target.closest('.cell');
  if(!t) return;
  if(t.classList.contains('highlight') && state.group.length){
    const idx = state.group.indexOf(t);
    if(idx >= 0){ state.cursor = idx; updateCursor(); }
  }
});
</script>
</body>
</html>
