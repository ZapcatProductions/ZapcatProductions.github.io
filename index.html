<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon 15×15 — Normal Crossword (fixed placements)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg:#0b1220;
    --panel:#0f1a2a;
    --tile:#ffffff;
    --tile-text:#071322;
    --accent:#3a8dff;
    --gap:4px;
    --size:34px; /* tile size */
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#eaf2ff;display:flex;align-items:flex-start;justify-content:center;padding:16px}
  #wrapper{display:flex;gap:20px;align-items:flex-start;max-width:1400px;width:100%}

  /* grid */
  #gridWrap{display:flex;flex-direction:column;gap:8px;align-items:center}
  #gridTitle{font-weight:700;color:#cfe8ff;font-size:16px}
  #gridBorder{background:#071322;padding:8px;border-radius:8px} /* black border around grid */
  #grid{display:grid;grid-template-columns:repeat(15, var(--size));grid-auto-rows:var(--size);gap:var(--gap);background:transparent;border-radius:6px}
  .cell{
    width:var(--size);height:var(--size);
    background:var(--tile);color:var(--tile-text);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
    position:relative;user-select:none;cursor:text;border-radius:4px;border:1px solid #c9d6ea;line-height:1;
  }
  .black{width:var(--size);height:var(--size);background:#071322;border-radius:4px;border:1px solid #0b1220;box-sizing:border-box}
  .num{position:absolute;top:3px;left:4px;font-size:10px;color:rgba(237,245,255,0.55);font-weight:700;pointer-events:none}
  .cursor{outline:3px solid rgba(58,141,255,0.14);box-shadow:inset 0 0 0 2px rgba(58,141,255,0.08)}
  .highlight{background:#e6f4ff}            /* subtle blue (not yellow) */
  .current-clue{background:rgba(58,141,255,0.06)}
  .error{background:#ffb3b3 !important;color:#071322 !important}

  /* panel */
  #panel{width:360px;background:transparent}
  .small-muted{font-size:13px;color:#bcd6ff;margin-bottom:8px}
  ul{list-style:none;padding:0;margin:0}
  li.heading{font-weight:800;margin:8px 0;color:#cfe8ff}
  li.clue{padding:8px;border-radius:6px;cursor:pointer;color:#eaf2ff}
  li.clue.current{background:rgba(58,141,255,0.08);color:var(--accent)}
  label{display:flex;align-items:center;gap:8px;margin-top:8px;color:#eaf2ff}

  @media (max-width:960px){
    html,body{padding:10px}
    #wrapper{flex-direction:column;align-items:center}
    #panel{width:100%}
  }
</style>
</head>
<body>
  <div id="wrapper">
    <div id="gridWrap">
      <div id="gridTitle">Gen-1 Pokémon 15×15 — Mini Crossword</div>
      <div id="gridTimer" class="small-muted">Time: 0:00</div>
      <div id="gridBorder">
        <main id="grid" aria-label="crossword grid"></main>
      </div>
    </div>

    <aside id="panel">
      <div id="panelTimer" class="small-muted">Time: 0:00</div>
      <label><input type="checkbox" id="errorToggle" checked> Error check</label>

      <ul class="clue-list" id="across" style="margin-top:12px">
        <li class="heading">Across</li>
        <li class="clue" data-dir="across" data-clue="1">1. CHARMANDER</li>
        <li class="clue" data-dir="across" data-clue="2">2. MEW</li>
        <li class="clue" data-dir="across" data-clue="3">3. GYARADOS</li>
        <li class="clue" data-dir="across" data-clue="4">4. SNEASEL</li>
      </ul>

      <ul class="clue-list" id="down" style="margin-top:12px">
        <li class="heading">Down</li>
        <li class="clue" data-dir="down" data-clue="5">5. RAYQUAZA</li>
        <li class="clue" data-dir="down" data-clue="6">6. ABRA</li>
        <li class="clue" data-dir="down" data-clue="7">7. MEOWTH</li>
        <li class="clue" data-dir="down" data-clue="8">8. ONIX</li>
      </ul>
    </aside>
  </div>

<script>
/* ---------- CONFIG ---------- */
const letters = "ABCDEFGHIJKLMNO";
const rows = 15, cols = 15;
const gridEl = document.getElementById('grid');

// Words (adjusted ONIX to I6 to remove conflict; ABRA remains L2)
const words = [
  { id:1, word:"CHARMANDER", dir:"across", start:"B2" },
  { id:2, word:"MEW", dir:"across", start:"D4" },
  { id:3, word:"GYARADOS", dir:"across", start:"B6" },
  { id:4, word:"SNEASEL", dir:"across", start:"B8" },
  { id:5, word:"RAYQUAZA", dir:"down", start:"K2" },
  { id:6, word:"ABRA", dir:"down", start:"L2" },   // 4 tiles
  { id:7, word:"MEOWTH", dir:"down", start:"D4" },
  { id:8, word:"ONIX", dir:"down", start:"I6" }    // moved from H6 -> I6 to avoid SNEASEL conflict
];

/* ---------- BUILD EMPTY GRID (start all black) ---------- */
const cellMap = new Map(); // coord -> element
for(let r=1;r<=rows;r++){
  for(let c=0;c<cols;c++){
    const coord = letters[c] + r;
    const el = document.createElement('div');
    el.setAttribute('data-coord', coord);
    el.className = 'black'; // default blacked out tile
    gridEl.appendChild(el);
    cellMap.set(coord, el);
    el._words = []; // word membership
  }
}

/* ---------- PLACE WORDS ---------- */
function placeWords(){
  words.forEach(w=>{
    const col = w.start[0].charCodeAt(0) - 65;
    const row = parseInt(w.start.slice(1),10) - 1;
    for(let i=0;i<w.word.length;i++){
      const r = row + (w.dir === 'down' ? i : 0);
      const c = col + (w.dir === 'across' ? i : 0);
      if(r<0||r>=rows||c<0||c>=cols) { console.warn('out of bounds', w, i); continue; }
      const coord = letters[c] + (r+1);
      const el = cellMap.get(coord);
      if(!el) continue;
      // convert black -> cell
      if(el.classList.contains('black')){
        el.className = 'cell';
        el.textContent = '';
      }
      // record membership and authoritative answer
      el._words.push({ id: w.id, dir: w.dir, index:i, letter: w.word[i] });
      if(!el.dataset.answer) el.dataset.answer = w.word[i];
      else if(el.dataset.answer !== w.word[i]) {
        console.warn('overlap conflict at', coord, el.dataset.answer, 'vs', w.word[i]);
        // keep first answer
      }
      // first letter -> add small number (only once)
      if(i===0 && !el.querySelector('.num')){
        el.dataset.clueNum = String(w.id);
        const span = document.createElement('span');
        span.className = 'num';
        span.textContent = String(w.id);
        el.appendChild(span);
      }
    }
  });
}
placeWords();

/* ---------- helpers ---------- */
function wordCoords(w){
  const col = w.start[0].charCodeAt(0) - 65;
  const row = parseInt(w.start.slice(1),10) - 1;
  const coords = [];
  for(let i=0;i<w.word.length;i++){
    const r = row + (w.dir === 'down' ? i : 0);
    const c = col + (w.dir === 'across' ? i : 0);
    coords.push(letters[c] + (r+1));
  }
  return coords;
}
function buildGroup(id, dir){
  const w = words.find(x=>x.id===Number(id) && x.dir===dir);
  if(!w) return [];
  return wordCoords(w).map(coord=>cellMap.get(coord)).filter(Boolean);
}

/* ---------- TIMERS ---------- */
let seconds = 0;
const gridTimer = document.getElementById('gridTimer');
const panelTimer = document.getElementById('panelTimer');
function tick(){ seconds++; const m=Math.floor(seconds/60), s=seconds%60; const t=`Time: ${m}:${s<10?'0':''}${s}`; gridTimer.textContent=t; panelTimer.textContent=t }
setInterval(tick,1000);

/* ---------- STATE ---------- */
function getAllCells() { return Array.from(document.querySelectorAll('.cell')); }
const allCells = getAllCells();
const cluesEls = Array.from(document.querySelectorAll('li.clue'));
const errorToggle = document.getElementById('errorToggle');

let state = {
  activeId: null,
  dir: null,
  group: [],
  cursor: 0,
  answers: {}  // "id-dir" => string
};

/* ---------- UI helpers ---------- */
function clearVisual(){
  getAllCells().forEach(c => c.classList.remove('highlight','cursor','current-clue'));
  cluesEls.forEach(l => l.classList.remove('current'));
}
function setActive(id, dir, cursorPos = 0){
  clearVisual();
  const group = buildGroup(Number(id), dir);
  if(!group.length) return;
  state.activeId = Number(id);
  state.dir = dir;
  state.group = group;
  state.cursor = Math.max(0, Math.min(cursorPos, group.length-1));
  group.forEach(g => g.classList.add('highlight'));
  group[state.cursor].classList.add('cursor');
  const li = document.querySelector(`.clue[data-clue='${id}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  const key = `${id}-${dir}`;
  if(!state.answers[key]) state.answers[key] = "";
  if(errorToggle.checked) checkErrors();
}

/* ---------- PANEL INTERACTION ---------- */
cluesEls.forEach(li=>{
  li.addEventListener('mouseover', function() {
    const id = this.dataset.clue, dir = this.dataset.dir;
    const group = buildGroup(Number(id), dir);
    group.forEach(g => g.classList.add('highlight'));
  });
  li.addEventListener('mouseout', function() {
    const id = this.dataset.clue, dir = this.dataset.dir;
    const group = buildGroup(Number(id), dir);
    group.forEach(g => g.classList.remove('highlight'));
  });
  li.addEventListener('click', function() {
    const id = this.dataset.clue, dir = this.dataset.dir;
    setActive(id, dir, (state.answers[`${id}-${dir}`] || '').length);
    this.classList.add('current');
  });
});

/* ---------- CELL CLICK ---------- */
Array.from(cellMap.values()).forEach(cell=>{
  cell.addEventListener('click', function(){
    if(cell.classList.contains('black')) { clearVisual(); state.activeId=null; state.dir=null; state.group=[]; state.cursor=0; return; }
    const members = cell._words || [];
    if(!members.length) return;
    // prefer across unless user is already editing across
    let pick = members.find(m=>m.dir==='across') || members[0];
    // if currently active across and cell only has across, choose across; if both exist, toggle logic: prefer opposite of current
    if(members.length>1){
      if(state.dir === 'across') pick = members.find(m=>m.dir==='down') || pick;
      else pick = members.find(m=>m.dir==='across') || pick;
    }
    const group = buildGroup(pick.id, pick.dir);
    const idx = group.indexOf(cell);
    setActive(pick.id, pick.dir, idx >= 0 ? idx : 0);
    const li = document.querySelector(`.clue[data-clue='${pick.id}'][data-dir='${pick.dir}']`);
    if(li) li.classList.add('current');
  });
});

/* ---------- KEYBOARD ---------- */
document.addEventListener('keydown', function(e){
  if(!state.activeId){
    if(e.key === 'Tab'){
      e.preventDefault();
      const first = cluesEls[0];
      if(first) first.click();
    }
    return;
  }

  // Tab cycles clues
  if(e.key === 'Tab'){
    e.preventDefault();
    const allCl = Array.from(document.querySelectorAll('li.clue'));
    const current = document.querySelector('li.clue.current');
    let idx = allCl.indexOf(current);
    idx = e.shiftKey ? (idx - 1 + allCl.length) % allCl.length : (idx + 1) % allCl.length;
    clearVisual();
    allCl[idx].click();
    return;
  }

  // letters
  if(e.key.length === 1 && /[a-z]/i.test(e.key)){
    e.preventDefault();
    const letter = e.key.toUpperCase();
    const key = `${state.activeId}-${state.dir}`;
    state.answers[key] = state.answers[key] || '';
    // place letter at cursor
    const arr = state.answers[key].split('');
    arr[state.cursor] = letter;
    state.answers[key] = arr.join('').slice(0, words.find(w=>w.id===state.activeId && w.dir===state.dir).word.length);
    // update DOM for entire group
    state.group.forEach((cell,i)=> cell.textContent = (state.answers[key][i] || ''));
    // advance cursor
    if(state.cursor < state.group.length - 1) state.cursor++;
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // Backspace behavior: clear current if not empty, otherwise move left and clear
  if(e.key === 'Backspace'){
    e.preventDefault();
    const key = `${state.activeId}-${state.dir}`;
    state.answers[key] = state.answers[key] || '';
    const currentText = (state.group[state.cursor].textContent || '').trim();
    if(currentText !== ''){
      const arr = state.answers[key].split('');
      arr[state.cursor] = '';
      state.answers[key] = arr.join('');
      state.group[state.cursor].textContent = '';
    } else {
      if(state.cursor > 0) state.cursor--;
      const arr = state.answers[key].split('');
      arr[state.cursor] = '';
      state.answers[key] = arr.join('');
      state.group[state.cursor].textContent = '';
    }
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // arrows based on direction
  if(e.key === 'ArrowRight' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor+1, state.group.length-1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowLeft' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor-1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowDown' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor+1, state.group.length-1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowUp' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor-1);
    state.group.forEach(c=>c.classList.remove('cursor'));
    state.group[state.cursor].classList.add('cursor');
    return;
  }

  if(e.key === 'Escape'){
    clearVisual();
    state.activeId = null; state.dir=null; state.group=[]; state.cursor=0;
    return;
  }
});

/* ---------- ERROR CHECK ---------- */
function checkErrors(){
  // Only flag if cell has an authoritative answer AND user has typed a letter that is wrong.
  getAllCells().forEach(cell=>{
    const ans = (cell.dataset.answer || '').toUpperCase();
    const txt = (cell.textContent || '').trim().toUpperCase();
    if(ans){
      // only mark error when user has entered something and it doesn't match
      if(txt !== '' && txt !== ans) cell.classList.add('error');
      else cell.classList.remove('error');
    } else {
      cell.classList.remove('error');
    }
  });
}
if(errorToggle.checked) checkErrors();
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) getAllCells().forEach(c=>c.classList.remove('error'));
  else checkErrors();
});

/* ---------- expose debug ---------- */
window._crossword = { words, cellMap, state, buildGroup };

/* ---------- final font-size tweak so letters fit ---------- */
(function adjustFont(){
  const longest = Math.max(...words.map(w=>w.word.length));
  const tile = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size')) || 34;
  const size = Math.max(12, Math.min(16, Math.floor(tile * 0.45)));
  getAllCells().forEach(c => c.style.fontSize = size + 'px');
})();
</script>
</body>
</html>
