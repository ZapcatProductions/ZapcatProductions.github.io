<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Crossword 8x8</title>

<!-- Popunder ad -->
<script src="https://pl28419326.effectivegatecpm.com/d6/38/78/d6387853e29db763a5be0b204d627343.js"></script>

<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #0b1220;
    color: #eaf2ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  /* Banner Ad Container */
  #banner-ad {
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  /* Crossword Grid */
  #crossword {
    display: grid;
    grid-template-columns: repeat(8, 40px);
    grid-template-rows: repeat(8, 40px);
    gap: 2px;
    margin: 0 auto;
  }

  #crossword input {
    width: 100%;
    height: 100%;
    text-align: center;
    font-size: 20px;
    background: #1a2436;
    color: #eaf2ff;
    border: 1px solid #3a8dff;
    text-transform: uppercase;
  }

  /* Responsive adjustments */
  @media(max-width:500px){
    #crossword {
      grid-template-columns: repeat(8, 30px);
      grid-template-rows: repeat(8, 30px);
    }

    #crossword input {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<h1>Mini Crossword 8x8</h1>

<!-- Banner Ad -->
<div id="banner-ad">
<script>
  atOptions = {
    'key' : '53132848729ca78c1b5d61c90db3f910',
    'format' : 'iframe',
    'height' : 600,
    'width' : 160,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/53132848729ca78c1b5d61c90db3f910/invoke.js"></script>
</div>

<!-- Crossword Grid -->
<div id="crossword"></div>

<script>
  // Generate 8x8 crossword grid
  const crossword = document.getElementById('crossword');
  const size = 8;

  for(let i=0; i<size*size; i++){
    const input = document.createElement('input');
    input.setAttribute('maxlength', 1);
    input.addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase();
    });
    crossword.appendChild(input);
  }
</script>

</body>
</html>
