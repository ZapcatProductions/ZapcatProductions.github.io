<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon 15×15 Mini Crossword — Fixed</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--bg:#0b1220;--accent:#3a8dff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#eaf2ff;display:flex;align-items:flex-start;justify-content:center;padding:18px}
  #wrapper{display:flex;gap:18px;align-items:flex-start;max-width:1600px;width:100%}

  /* grid */
  #gridWrap{display:flex;flex-direction:column;gap:8px;align-items:center}
  #gridTitle{font-weight:700;color:#cfe8ff}
  #grid{display:grid;grid-template-columns:repeat(15,44px);grid-auto-rows:44px;gap:6px;padding:6px;border-radius:10px}
  .cell{width:44px;height:44px;background:#fff;color:#071322;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;user-select:none;cursor:text;border:1px solid #9aa3b2;line-height:1}
  .black{width:44px;height:44px;background:#071322;border-radius:8px;border:1px solid #0b1220}
  .num{position:absolute;top:3px;left:5px;font-size:10px;color:rgba(7,19,34,0.45);font-weight:700;pointer-events:none}
  .highlight{background:#ffd;color:#071322}
  .editting{background:#ffb;color:#071322}
  .cursor{box-shadow:inset 0 0 0 4px #BBB}
  .error{background:#ffb3b3 !important}
  .small-muted{font-size:13px;color:#bcd6ff}

  /* panel */
  #panel{width:360px}
  ul{list-style:none;padding:0;margin:0}
  li.heading{font-weight:800;margin:8px 0}
  li.clue{padding:8px;border-radius:6px;cursor:pointer}
  li.clue.current{background:rgba(58,141,255,.08);color:var(--accent)}
  label{display:flex;align-items:center;gap:8px;margin-top:8px}
  @media (max-width:960px){html,body{padding:10px} #wrapper{flex-direction:column;align-items:center} #panel{width:100%}}
</style>
</head>
<body>
  <div id="wrapper">
    <!-- GRID -->
    <div id="gridWrap">
      <div id="gridTitle">Gen-1 Pokémon 15×15 — Mini Crossword</div>
      <div id="gridTimer" class="small-muted">Time: 0:00</div>
      <main id="grid" aria-label="crossword grid"></main>
    </div>

    <!-- PANEL -->
    <aside id="panel">
      <div id="panelTimer" class="small-muted">Time: 0:00</div>
      <label><input type="checkbox" id="errorToggle" checked> Error check</label>

      <ul class="clue-list" id="across" style="margin-top:12px">
        <li class="heading">Across</li>
        <li class="clue" data-dir="across" data-clue="1">1. CHARMANDER</li>
        <li class="clue" data-dir="across" data-clue="2">2. MEW</li>
        <li class="clue" data-dir="across" data-clue="3">3. GYARADOS</li>
        <li class="clue" data-dir="across" data-clue="4">4. SNEASEL</li>
      </ul>

      <ul class="clue-list" id="down" style="margin-top:12px">
        <li class="heading">Down</li>
        <li class="clue" data-dir="down" data-clue="5">5. RAYQUAZA</li>
        <li class="clue" data-dir="down" data-clue="6">6. ABRA</li>
        <li class="clue" data-dir="down" data-clue="7">7. MEOWTH</li>
        <li class="clue" data-dir="down" data-clue="8">8. ONIX</li>
      </ul>
    </aside>
  </div>

<script>
/* -------- config & word placements -------- */
const letters = "ABCDEFGHIJKLMNO"; // 15 columns A..O
const rows = 15, cols = 15;
const gridEl = document.getElementById('grid');

// your words (kept from your original)
const words = [
  {word:"CHARMANDER",dir:"across",start:"B2"},
  {word:"MEW",dir:"across",start:"D4"},
  {word:"GYARADOS",dir:"across",start:"B6"},
  {word:"SNEASEL",dir:"across",start:"B8"},
  {word:"RAYQUAZA",dir:"down",start:"K2"},
  {word:"ABRA",dir:"down",start:"L2"},
  {word:"MEOWTH",dir:"down",start:"D4"},
  {word:"ONIX",dir:"down",start:"H6"},
];

// build grid DOM and map
const cellMap = new Map(); // coord -> element
for(let r=1;r<=rows;r++){
  for(let c=0;c<cols;c++){
    const coord = letters[c] + r;
    const el = document.createElement('div');
    el.setAttribute('data-coord', coord);
    // border blacks (as in your earlier file)
    if(r===1 || r===rows || c===0 || c===cols-1){
      el.className = 'black';
    } else {
      el.className = 'cell';
    }
    gridEl.appendChild(el);
    cellMap.set(coord, el);
    // internal structure for JS (not in attributes)
    el._words = []; // word indices that include this cell
  }
}

// place words: fill dataset.answer and register word membership
words.forEach((w, wi)=>{
  const col = w.start[0].charCodeAt(0) - 65;
  const row = parseInt(w.start.slice(1),10) - 1;
  for(let i=0;i<w.word.length;i++){
    const r = row + (w.dir === 'down' ? i : 0);
    const c = col + (w.dir === 'across' ? i : 0);
    if(c<0||c>=cols||r<0||r>=rows) { console.warn('Out of bounds placement', w, i); continue; }
    const coord = letters[c] + (r+1);
    const cell = cellMap.get(coord);
    if(!cell) continue;
    if(cell.classList.contains('black')) {
      console.warn('Word placed on black', coord, w);
      continue;
    }
    cell._words.push({ id: wi+1, dir: w.dir, pos: i, letter: w.word[i] });
    // Set a single authoritative answer for the cell (should be same for all overlapping words)
    if(cell.dataset.answer && cell.dataset.answer !== w.word[i]) {
      // conflict detected — log it but keep first
      console.warn('Overlap conflict at', coord, cell.dataset.answer, 'vs', w.word[i]);
    } else {
      cell.dataset.answer = w.word[i];
    }
    // if first letter of word, put a small number
    if(i===0){
      cell.dataset.clueNum = String(wi+1);
      const span = document.createElement('span');
      span.className = 'num';
      span.textContent = String(wi+1);
      cell.appendChild(span);
    }
  }
});

/* -------- helpers to convert positions -------- */
function wordToCoords(wordObj){
  const col = wordObj.start[0].charCodeAt(0) - 65;
  const row = parseInt(wordObj.start.slice(1),10) - 1;
  const coords = [];
  for(let i=0;i<wordObj.word.length;i++){
    const r = row + (wordObj.dir === 'down' ? i : 0);
    const c = col + (wordObj.dir === 'across' ? i : 0);
    coords.push(letters[c] + (r+1));
  }
  return coords;
}

function buildGroup(num, dir){
  const widx = Number(num) - 1;
  const w = words[widx];
  if(!w || w.dir !== dir) return [];
  const coords = wordToCoords(w);
  return coords.map(coord => cellMap.get(coord)).filter(Boolean);
}

/* -------- timers -------- */
let seconds = 0;
const gridTimer = document.getElementById('gridTimer');
const panelTimer = document.getElementById('panelTimer');
function tick(){ seconds++; const m=Math.floor(seconds/60), s=seconds%60; const t=`Time: ${m}:${s<10?'0':''}${s}`; gridTimer.textContent=t; panelTimer.textContent=t }
setInterval(tick,1000);

/* -------- core state & UI logic (model mirrors your 6x6 example) -------- */
const allCells = Array.from(document.querySelectorAll('.cell'));
const cluesEls = Array.from(document.querySelectorAll('li.clue'));
const errorToggle = document.getElementById('errorToggle');

let state = { index:null, clue:null, dir:null, cursor:0, length:0, answers:{} };

function clearMarkers(){
  allCells.forEach(el => el.classList.remove('highlight','editting','cursor'));
  cluesEls.forEach(li => li.classList.remove('current'));
}

function highlightOnHover(){
  // bound to clue mouseover/mouseout
  const c = this.getAttribute('data-clue');
  const d = this.getAttribute('data-dir');
  const l = parseInt(this.getAttribute('data-length') || 0,10);
  // find start cell (the one with data-clue == c)
  // there may be multiple starts with same number (across & down). find the correct one for this dir.
  const startCell = Array.from(cellMap.values()).find(el => el.dataset.clueNum === String(c) && words[Number(c)-1] && words[Number(c)-1].dir === d);
  if(!startCell) return;
  const w = words[Number(c)-1];
  const group = buildGroup(c, d);
  group.forEach(g => g.classList.toggle('highlight'));
}

function editClue(){
  // bound to li click; 'this' is the li element
  clearMarkers();
  const c = this.getAttribute('data-clue');
  const d = this.getAttribute('data-dir');
  const widx = Number(c)-1;
  const w = words[widx];
  if(!w) return;
  const group = buildGroup(c,d);
  group.forEach(g => g.classList.add('editting'));
  // state
  state.clue = c;
  state.dir = d;
  state.index = group.length ? group[0].dataset.coord : null;
  state.length = w.word.length;
  state.cursor = (state.answers[c+'-'+d] || '').length;
  // cursor element
  const cursorCell = group[state.cursor] || group[group.length-1];
  if(cursorCell) cursorCell.classList.add('cursor');
  // mark the clue as current
  this.classList.add('current');
  // ensure error check updates
  if(errorToggle.checked) checkErrors();
}

cluesEls.forEach(clue=>{
  // preview highlight on hover
  clue.addEventListener('mouseover', highlightOnHover);
  clue.addEventListener('mouseout', highlightOnHover);
  // click to edit
  clue.addEventListener('click', editClue.bind(clue));
});

/* clicking a numbered cell should jump to its clue. If there's both across & down with same number, toggle by previous state.dir */
Array.from(document.querySelectorAll('[data-clue-num]'), document.querySelectorAll('[data-clue-num]')); // noop to quiet linter
Array.from(document.querySelectorAll('[data-clue-num]')).forEach(el=>{
  // but our cells' numbers are in dataset.clueNum, on the .cell element
});
Array.from(cellMap.values()).forEach(cell=>{
  cell.addEventListener('click', function(){
    if(this.classList.contains('black')) { clearMarkers(); state={index:null,clue:null,dir:null,cursor:0,length:0,answers:state.answers}; return; }
    const num = this.dataset.clueNum;
    if(!num){
      // if not numbered but part of word(s), jump to the first word containing it
      if(this._words && this._words.length){
        const pick = this._words[0];
        const lis = Array.from(document.querySelectorAll('li.clue[data-clue="'+pick.id+'"]'));
        if(lis.length) editClue.bind(lis[0])();
      }
      return;
    }
    const lis = Array.from(document.querySelectorAll('li.clue[data-clue="'+num+'"]'));
    if(lis.length===1){
      editClue.bind(lis[0])();
    } else if(lis.length>1){
      // determine toggle: if current active clue same number, switch; else try to pick across first
      let pickIndex = 0;
      if(state.clue === num){
        // pick the other one if possible
        pickIndex = lis.findIndex(li => li.getAttribute('data-dir') !== state.dir);
        if(pickIndex === -1) pickIndex = 0;
      } else {
        // prefer across if exists
        pickIndex = lis.findIndex(li => li.getAttribute('data-dir') === 'across');
        if(pickIndex === -1) pickIndex = 0;
      }
      editClue.bind(lis[pickIndex])();
    }
  });
});

/* keyboard input handling (letters, backspace, tab to cycle clues, arrow navigation) */
document.addEventListener('keydown', function(e){
  if(!state.clue) {
    // support Tab to jump to first clue if nothing active
    if(e.key === 'Tab') {
      e.preventDefault();
      const first = cluesEls[0];
      if(first) editClue.bind(first)();
    }
    return;
  }
  // prevent default for keys we handle
  if(e.key === 'Tab') {
    e.preventDefault();
    // cycle through ALL clues (across+down list order)
    const allClues = Array.from(document.querySelectorAll('li.clue'));
    const currentLi = document.querySelector('li.clue.current');
    let idx = allClues.indexOf(currentLi);
    if(e.shiftKey) idx = (idx - 1 + allClues.length) % allClues.length;
    else idx = (idx + 1) % allClues.length;
    clearMarkers();
    editClue.bind(allClues[idx])();
    return;
  }

  // letter input
  if(e.key.length === 1 && /[a-z]/i.test(e.key)){
    e.preventDefault();
    const key = e.key.toUpperCase();
    const keyId = state.clue + '-' + state.dir;
    state.answers[keyId] = state.answers[keyId] || '';
    if(state.answers[keyId].length < state.length){
      state.answers[keyId] += key;
    } else {
      // overwrite at cursor if at end
      const arr = state.answers[keyId].split('');
      arr[state.cursor] = key;
      state.answers[keyId] = arr.join('');
    }
    // place letters into cells for this word
    const group = buildGroup(state.clue, state.dir);
    for(let i=0;i<state.length;i++){
      group[i].textContent = (state.answers[keyId][i]||'');
    }
    // advance cursor
    if(state.cursor < state.length - 1) state.cursor++;
    // update cursor classes
    group.forEach(g => g.classList.remove('cursor'));
    group[Math.min(state.cursor, group.length-1)].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // Backspace — remove last char or move left then remove
  if(e.key === 'Backspace'){
    e.preventDefault();
    const keyId = state.clue + '-' + state.dir;
    state.answers[keyId] = state.answers[keyId] || '';
    if(state.answers[keyId].length > 0){
      // if cursor is at end, remove last char, else remove char before cursor and move cursor back
      if(state.cursor === state.answers[keyId].length){
        state.answers[keyId] = state.answers[keyId].slice(0, -1);
        state.cursor = state.answers[keyId].length;
      } else {
        // remove char at cursor-1
        const pos = Math.max(0, state.cursor-1);
        const arr = state.answers[keyId].split('');
        arr.splice(pos,1);
        state.answers[keyId] = arr.join('');
        state.cursor = pos;
      }
    } else if(state.cursor > 0){
      state.cursor--;
      const group = buildGroup(state.clue, state.dir);
      const pos = state.cursor;
      const arr = (state.answers[keyId]||'').split('');
      arr[pos] = '';
      state.answers[keyId] = arr.join('');
    }
    // refresh cells
    const group = buildGroup(state.clue, state.dir);
    for(let i=0;i<state.length;i++){
      group[i].textContent = (state.answers[state.clue+'-'+state.dir]||'')[i]||'';
    }
    group.forEach(g => g.classList.remove('cursor'));
    group[Math.min(state.cursor, group.length-1)].classList.add('cursor');
    if(errorToggle.checked) checkErrors();
    return;
  }

  // arrows: move cursor within active word
  if(e.key === 'ArrowRight' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, state.length - 1);
    const group = buildGroup(state.clue, state.dir);
    group.forEach(g => g.classList.remove('cursor'));
    if(group[state.cursor]) group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowLeft' && state.dir === 'across'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor - 1);
    const group = buildGroup(state.clue, state.dir);
    group.forEach(g => g.classList.remove('cursor'));
    if(group[state.cursor]) group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowDown' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.min(state.cursor + 1, state.length - 1);
    const group = buildGroup(state.clue, state.dir);
    group.forEach(g => g.classList.remove('cursor'));
    if(group[state.cursor]) group[state.cursor].classList.add('cursor');
    return;
  }
  if(e.key === 'ArrowUp' && state.dir === 'down'){
    e.preventDefault();
    state.cursor = Math.max(0, state.cursor - 1);
    const group = buildGroup(state.clue, state.dir);
    group.forEach(g => g.classList.remove('cursor'));
    if(group[state.cursor]) group[state.cursor].classList.add('cursor');
    return;
  }
});

/* -------- error checking -------- */
function checkErrors(){
  allCells.forEach(cell => {
    const ans = (cell.dataset.answer || '').toUpperCase();
    const txt = (cell.textContent || '').trim().toUpperCase();
    if(ans){
      cell.classList.toggle('error', txt !== ans);
    } else {
      cell.classList.remove('error');
    }
  });
}
if(errorToggle.checked) checkErrors();
errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) allCells.forEach(c=>c.classList.remove('error'));
  else checkErrors();
});

/* expose for debugging if needed */
window._cw = { words, cellMap, buildGroup, state };

/* optional: pre-fill overlapping letters that can be deduced from other answers (no auto-solve) */
/* (we intentionally do not auto-fill cross answers to preserve typing behavior) */
</script>
</body>
</html>
