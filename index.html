<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pokémon Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#0b1220;
  color:white;
  font-family:system-ui,Segoe UI,sans-serif;
}
#game-container{
  display:flex;
  gap:40px;
  align-items:flex-start;
  justify-content:center;
  margin-top:40px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(12,35px);
  gap:3px;
}
.cell{
  width:35px;
  height:35px;
  background:#09101f;
  border-radius:4px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cell input{
  width:100%;
  height:100%;
  text-align:center;
  font-size:18px;
  border:none;
  background:#fff;
  text-transform:uppercase;
}
.black{
  background:#000;
}
.number{
  position:absolute;
  top:2px;
  left:4px;
  font-size:10px;
}
.correct{
  background:#cde8ff !important;
}
.incorrect{
  background:#ffb6b6 !important;
}
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
}
button{
  padding:10px 18px;
  border-radius:6px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="overlay">
  <h1>Pokémon Mini Crossword</h1>
  <button onclick="startGame()">Start Game</button>
</div>

<div style="margin-left:40px;font-size:18px;">Time: <span id="timer">0:00</span></div>

<div id="game-container">

  <div class="grid" id="grid"></div>

  <div>
    <h2>Across</h2>
    1. ALAKAZAM<br>
    2. EKANS<br>
    3. MEW<br>
    4. SNEASEL<br><br>

    <h2>Down</h2>
    1. ABRA<br>
    2. ARBOK<br>
    3. MEW<br>
    4. ONIX
  </div>

</div>

<script>
const grid = document.getElementById("grid");

const SIZE = 12;

// Empty grid default
let solution = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
let isBlack = Array.from({length:SIZE},()=>Array(SIZE).fill(false));

/*
LAYOUT (12x12)

Across
1 ALAKAZAM  row1 col1
2 EKANS     row3 col2
3 MEW       row5 col3
4 SNEASEL   row7 col3

Down
1 ABRA      col1 row1
2 ARBOK     col2 row2
3 MEW       col5 row3
4 ONIX      col5 row7

NOTE:
SNEASEL and ONIX share ONLY the N
*/

function placeWord(word,r,c,dir){
  for(let i=0;i<word.length;i++){
    let rr=r+(dir==="down"?i:0);
    let cc=c+(dir==="across"?i:0);
    solution[rr][cc]=word[i];
    isBlack[rr][cc]=false;
  }
}

// mark all black first
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)isBlack[r][c]=true;

// ACROSS
placeWord("ALAKAZAM",0,0,"across");
placeWord("EKANS",2,1,"across");
placeWord("MEW",4,2,"across");
placeWord("SNEASEL",6,2,"across");

// DOWN
placeWord("ABRA",0,0,"down");
placeWord("ARBOK",1,1,"down");
placeWord("MEW",2,4,"down");
placeWord("ONIX",6,4,"down"); // <- crosses SNEASEL at N

// numbering
let clueNumber=1;
let numbers = Array.from({length:SIZE},()=>Array(SIZE).fill(null));

function shouldNumber(r,c){
  if(isBlack[r][c])return false;
  let startsAcross = (c===0 || isBlack[r][c-1]) && (c+1<SIZE && !isBlack[r][c+1]);
  let startsDown = (r===0 || isBlack[r-1][c]) && (r+1<SIZE && !isBlack[r+1][c]);
  return startsAcross || startsDown;
}

// build UI
for(let r=0;r<SIZE;r++){
  for(let c=0;c<SIZE;c++){
    const cell=document.createElement("div");
    cell.className="cell";
    if(isBlack[r][c]){
      cell.classList.add("black");
    }else{
      const inp=document.createElement("input");
      inp.maxLength=1;
      inp.dataset.r=r;
      inp.dataset.c=c;
      inp.addEventListener("input",checkCorrect);
      cell.appendChild(inp);

      if(shouldNumber(r,c)){
        numbers[r][c]=clueNumber++;
        const n=document.createElement("div");
        n.className="number";
        n.innerText=numbers[r][c];
        cell.appendChild(n);
      }
    }
    grid.appendChild(cell);
  }
}

function checkCorrect(){
  const inputs=document.querySelectorAll("input");
  inputs.forEach(inp=>{
    let r=+inp.dataset.r;
    let c=+inp.dataset.c;
    let val=inp.value.toUpperCase();
    if(!val){inp.className="";return;}
    if(val===solution[r][c]) inp.className="correct";
    else inp.className="incorrect";
  });
}

// timer + overlay
let secs=0,interval;

function startGame(){
  document.getElementById("overlay").style.display="none";
  interval=setInterval(()=>{
    secs++;
    const m=Math.floor(secs/60);
    const s=String(secs%60).padStart(2,"0");
    document.getElementById("timer").innerText=`${m}:${s}`;
  },1000);
}
</script>

</body>
</html>
