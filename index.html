<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>Gen-1 Pokémon Crossword 12x12</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--bg:#0b1220;--accent:#3a8dff}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#eaf2ff;display:flex;justify-content:center;align-items:flex-start;padding:24px}
#game{display:flex;gap:28px;align-items:flex-start}
#grid{display:grid;grid-template-columns:repeat(12,44px);grid-auto-rows:44px;gap:6px}
.cell{border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase;position:relative;background:#fff;color:#071322;border:1px solid #9aa3b2;cursor:text;font-size:20px}
.black{background:#071322;border-radius:6px;width:44px;height:44px}
.topnum{position:absolute;top:4px;left:6px;font-size:10px;color:#334}
.highlight{background:#d8efff!important}
.cursor{box-shadow:inset 0 0 0 3px #3399ff}
.error{background:#ffb3b3!important}
#panel{width:320px}
li.heading{font-weight:800;margin:8px 0}
li.clue{padding:8px;border-radius:6px;cursor:pointer}
li.clue.current{background:rgba(58,141,255,.08);color:var(--accent)}
label{display:flex;align-items:center;gap:8px}
#timers{margin-bottom:12px}

<div id="panel">
  <div id="panelTimer">Time: 0:00</div>
  <label><input type="checkbox" id="errorToggle" checked> Error check</label>

  <ul id="across" style="margin-top:12px">
    <li class="heading">Across</li>
    <li class="clue" data-dir="across" data-clue="1" data-answer="CHARMANDER">1. CHARMANDER</li>
    <li class="clue" data-dir="across" data-clue="10" data-answer="SNEASEL">10. SNEASEL</li>
    <li class="clue" data-dir="across" data-clue="12" data-answer="ONIX">12. ONIX</li>
    <li class="clue" data-dir="across" data-clue="16" data-answer="ABRA">16. ABRA</li>
  </ul>

  <ul id="down" style="margin-top:12px">
    <li class="heading">Down</li>
    <li class="clue" data-dir="down" data-clue="4" data-answer="RAYQUAZA">4. RAYQUAZA</li>
    <li class="clue" data-dir="down" data-clue="8" data-answer="GYARADOS">8. GYARADOS</li>
    <li class="clue" data-dir="down" data-clue="9" data-answer="MEOWTH">9. MEOWTH</li>
    <li class="clue" data-dir="down" data-clue="13" data-answer="MEW">13. MEW</li>
  </ul>
</div>
</div>

<script>
// timer
let seconds = 0; let timerInterval = setInterval(()=>{
  seconds++;
  const m=Math.floor(seconds/60), s=seconds%60;
  const tm = `Time: ${m}:${s<10?'0':''}${s}`;
  document.getElementById('gridTimer').textContent = tm;
  document.getElementById('panelTimer').textContent = tm;
},1000);

// collect cells
const cells = Array.from(document.querySelectorAll('#grid .cell'));
const errorToggle = document.getElementById('errorToggle');

// helper to get cells for a clue number and dir
function getClueCells(num, dir){
  const sel = dir==='across' ? 'data-across' : 'data-down';
  const filtered = cells.filter(c => c.getAttribute(sel)===String(num));
  // sort by row/col
  filtered.sort((a,b)=>{
    const ra=+a.dataset.row, ca=+a.dataset.col, rb=+b.dataset.row, cb=+b.dataset.col;
    if(ra!==rb) return ra-rb;
    return ca-cb;
  });
  return filtered;
}

function clearVisual(){
  cells.forEach(c=>c.classList.remove('highlight','cursor'));
  document.querySelectorAll('.clue').forEach(l=>l.classList.remove('current'));
}

function highlightClue(num, dir){
  clearVisual();
  const group = getClueCells(num, dir);
  group.forEach(c=>c.classList.add('highlight'));
  if(group.length) group[0].classList.add('cursor');
  const li = document.querySelector(`.clue[data-clue='${num}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  current.num=num; current.dir=dir; current.cursor=0; current.group=group;
}

let current = {num:null,dir:null,cursor:0,group:[]};

// click clues
document.querySelectorAll('.clue').forEach(li=>{
  li.addEventListener('click', ()=>{
    const num = li.dataset.clue; const dir=li.dataset.dir;
    highlightClue(Number(num), dir);
  });
});

// click cells: prefer across if available
cells.forEach(cell=>{
  cell.addEventListener('click', ()=>{
    const a = cell.getAttribute('data-across');
    const d = cell.getAttribute('data-down');
    if(a){ highlightClue(Number(a),'across'); return; }
    if(d){ highlightClue(Number(d),'down'); return; }
  });
});

// typing & navigation
document.addEventListener('keydown', e=>{
  if(current.num===null) return;
  const group = current.group;
  if(!group || group.length===0) return;
  if(e.key==='ArrowRight' && current.dir==='across'){ if(current.cursor<group.length-1) current.cursor++; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft' && current.dir==='across'){ if(current.cursor>0) current.cursor--; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowDown' && current.dir==='down'){ if(current.cursor<group.length-1) current.cursor++; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowUp' && current.dir==='down'){ if(current.cursor>0) current.cursor--; updateCursor(); e.preventDefault(); return; }

  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const t = group[current.cursor];
    if(t){ t.textContent = e.key.toUpperCase(); t.classList.toggle('error', errorToggle.checked && t.dataset.answer && t.textContent!==t.dataset.answer); }
    if(current.cursor<group.length-1) current.cursor++;
    updateCursor(); e.preventDefault(); return;
  }

  if(e.key==='Backspace'){
    const t = group[current.cursor];
    if(t){ t.textContent=''; t.classList.remove('error'); }
    if(current.cursor>0) current.cursor--;
    updateCursor(); e.preventDefault(); return;
  }
});

function updateCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  const group = current.group;
  if(group && group.length) group[Math.min(current.cursor, group.length-1)].classList.add('cursor');
}

errorToggle.addEventListener('change', ()=>{
  if(!errorToggle.checked) cells.forEach(c=>c.classList.remove('error'));
  else cells.forEach(c=>{
    if(c.dataset.answer) c.classList.toggle('error', (c.textContent||'').trim().toUpperCase()!==c.dataset.answer);
  });
});
</script>
