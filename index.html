<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gen 1 Fire Pokémon – Mini Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, -apple-system, Segoe UI, Arial;
  background:#0b1220;
  color:#f5f7ff;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin:0;
  padding:20px;
}

h1{margin:0;}

.crossword{
  display:grid;
  grid-template-columns:repeat(6,50px);
  grid-template-rows:repeat(6,50px);
  gap:3px;
}

.cell{
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  text-transform:uppercase;
  background:white;
  color:black;
  border-radius:6px;
  box-sizing:border-box;
}

.block{
  background:black;
}

.cell input{
  width:100%;
  height:100%;
  border:none;
  outline:none;
  text-align:center;
  font-size:24px;
  text-transform:uppercase;
  background:transparent;
}

.highlight{
  background:#fff3cd !important;
}

.cursor{
  outline:3px solid #4a90ff;
}

.error{
  background:#ffb3b3 !important;
}

.panel{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

.clues{
  background:#101a33;
  padding:10px 14px;
  border-radius:10px;
  min-width:240px;
}

button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Gen 1 Fire Pokémon Mini Crossword</h1>
<div>Use arrow keys to move • SPACE toggles Across/Down</div>

<div class="crossword" id="grid"></div>

<div>
  Direction: <strong id="dirLabel">Across</strong>
  &nbsp;|&nbsp;
  <button id="checkBtn">Toggle error check</button>
</div>

<div class="panel">
  <div class="clues">
    <strong>Across</strong>
    <ol>
      <li>1. Fox Pokémon</li>
      <li>2. Spits lava</li>
      <li>3. Fire horse</li>
    </ol>
  </div>

  <div class="clues">
    <strong>Down</strong>
    <ol>
      <li>1. Six-tailed Pokémon</li>
      <li>2. Volcano Pokémon</li>
      <li>3. Evolves from Growlithe’s friend? (joke clue – same word)</li>
    </ol>
  </div>
</div>

<script>
/*
  Answers (Gen-1 Fire Pokémon only)

  VULPIX
  MAGMAR
  PONYTA
*/

const ANSWERS = {
  across:[
    {row:0,col:0,word:"VULPIX"},
    {row:2,col:0,word:"MAGMAR"},
    {row:4,col:0,word:"PONYTA"}
  ],
  down:[
    {row:0,col:0,word:"VULPIX"},
    {row:0,col:2,word:"MAGMAR"},
    {row:0,col:4,word:"PONYTA"}
  ]
};

const gridSize = 6;
const grid = document.getElementById("grid");
const dirLabel = document.getElementById("dirLabel");
const checkBtn = document.getElementById("checkBtn");

let direction = "across"; // or "down"
let errorMode = false;
let cursor = {row:0,col:0};

// ---------- Build grid ----------
const cells = [];

for(let r=0;r<gridSize;r++){
  cells[r]=[];
  for(let c=0;c<gridSize;c++){
    const div=document.createElement("div");
    div.className="cell";
    const input=document.createElement("input");
    input.maxLength=1;
    div.appendChild(input);
    grid.appendChild(div);
    cells[r][c]={div,input,solution:null};
  }
}

// ---------- Fill solutions ----------
function place(word,row,col,dir){
  for(let i=0;i<word.length;i++){
    let r=row+(dir==="down"?i:0);
    let c=col+(dir==="across"?i:0);
    cells[r][c].solution = word[i];
  }
}

ANSWERS.across.forEach(w=>place(w.word,w.row,w.col,"across"));
ANSWERS.down.forEach(w=>place(w.word,w.row,w.col,"down"));

// fill unused with blocks
for(let r=0;r<gridSize;r++){
  for(let c=0;c<gridSize;c++){
    if(!cells[r][c].solution){
      cells[r][c].div.classList.add("block");
      cells[r][c].input.disabled=true;
    }
  }
}

// ---------- Highlight helpers ----------
function clearHighlights(){
  cells.flat().forEach(c=>{
    c.div.classList.remove("highlight","cursor","error");
  });
}

function highlightCurrentWord(){
  clearHighlights();
  const list = direction==="across"?ANSWERS.across:ANSWERS.down;

  for(const w of list){
    const inWord =
      (direction==="across" && w.row===cursor.row &&
        cursor.col>=w.col && cursor.col<w.col+w.word.length)
      ||
      (direction==="down" && w.col===cursor.col &&
        cursor.row>=w.row && cursor.row<w.row+w.word.length);

    if(inWord){
      for(let i=0;i<w.word.length;i++){
        let r=w.row+(direction==="down"?i:0);
        let c=w.col+(direction==="across"?i:0);
        cells[r][c].div.classList.add("highlight");
      }
    }
  }
  cells[cursor.row][cursor.col].div.classList.add("cursor");
}

function moveCursor(dr,dc){
  let nr = Math.min(Math.max(cursor.row+dr,0),gridSize-1);
  let nc = Math.min(Math.max(cursor.col+dc,0),gridSize-1);
  if(cells[nr][nc].input.disabled) return;
  cursor={row:nr,col:nc};
  highlightCurrentWord();
}

// ---------- Error checking ----------
function updateErrors(){
  cells.flat().forEach(c=>{
    if(!errorMode){ c.div.classList.remove("error"); return; }
    if(!c.solution || !c.input.value) return;
    if(c.input.value.toUpperCase()!==c.solution) c.div.classList.add("error");
    else c.div.classList.remove("error");
  });
}

// ---------- Input handling ----------
cells.flat().forEach((cell,idx)=>{
  cell.input.addEventListener("input",e=>{
    cell.input.value = cell.input.value.toUpperCase();
    updateErrors();

    if(direction==="across") moveCursor(0,1);
    else moveCursor(1,0);
  });

  cell.input.addEventListener("focus",()=>{
    cursor={
      row:Math.floor(idx/gridSize),
      col:idx%gridSize
    };
    highlightCurrentWord();
  });
});

document.addEventListener("keydown",e=>{
  if(e.key===" "){
    direction = direction==="across"?"down":"across";
    dirLabel.textContent = direction[0].toUpperCase()+direction.slice(1);
    highlightCurrentWord();
    e.preventDefault();
  }

  if(e.key==="ArrowUp") moveCursor(-1,0);
  if(e.key==="ArrowDown") moveCursor(1,0);
  if(e.key==="ArrowLeft") moveCursor(0,-1);
  if(e.key==="ArrowRight") moveCursor(0,1);
  updateErrors();
});

checkBtn.onclick=()=>{
  errorMode=!errorMode;
  updateErrors();
  checkBtn.textContent = errorMode?"Hide error check":"Show error check";
};

// initial highlight
highlightCurrentWord();
</script>
</body>
</html>
