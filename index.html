<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gen-1 Pokémon Mini Crossword</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css?family=Libre+Baskerville');

body {
  margin:0; padding:0; font-family:'Libre Baskerville', serif;
  background:#ff0000; /* Red background */
  display:flex; justify-content:center; align-items:flex-start; height:100vh;
  overflow:hidden;
}

/* Title + Ad overlay */
#overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#000; color:#fff; display:flex; flex-direction:column;
  justify-content:center; align-items:center; z-index:1000;
}
#overlay h1 { font-size:3em; margin-bottom:20px; }
#overlay button { padding:12px 30px; font-size:1.2em; cursor:pointer; }

/* Wrapper for grid + clues */
#wrapper {
  display:flex; gap:20px; margin-top:20px; max-width:1600px; width:100%;
}

/* Crossword grid */
#grid {
  display:grid;
  grid-template-columns:repeat(15,40px);
  grid-auto-rows:40px;
  gap:4px;
}
.cell {
  background:#fff; border:1px solid #444;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:20px; text-transform:uppercase;
  position:relative; cursor:text; user-select:none;
}
.cell.black { background:#000; cursor:default; }
.cell span.number {
  position:absolute; top:2px; left:2px; font-size:12px; font-weight:bold; color:#000;
}

/* Highlights and cursor */
.cell.highlight { background:#cceeff; } /* light blue */
.cell.cursor { box-shadow:inset 0 0 0 3px #3399ff; }
.cell.error { background:#ff4d4d; color:#fff; }

/* Clues panel */
#clues {
  width:300px; overflow-y:auto;
}
#clues h2 { margin:0 0 10px 0; font-size:1.2em; }
ul { list-style:none; padding:0; margin:0 0 20px 0; }
li { padding:4px 6px; cursor:pointer; }
li.current { background:#cceeff; }

/* Error check toggle */
#errorToggle { margin-bottom:10px; }
</style>
</head>
<body>

<!-- Overlay -->
<div id="overlay">
  <h1>Gen-1 Pokémon Mini Crossword</h1>
  <button id="startBtn">Start</button>
</div>

<div id="wrapper" style="display:none;">
  <!-- Crossword Grid -->
  <div>
    <div>
      <label><input type="checkbox" id="errorToggle" checked> Error Check</label>
    </div>
    <div id="grid"></div>
  </div>

  <!-- Clues Panel -->
  <div id="clues">
    <h2>Across</h2>
    <ul id="across"></ul>
    <h2>Down</h2>
    <ul id="down"></ul>
  </div>
</div>

<script>
// Pokémon words for 15x15 grid (sample)
const words = [
  {word:"CHARMANDER", dir:"across", start:"A1"},
  {word:"MEW", dir:"across", start:"C4"},
  {word:"GYARADOS", dir:"across", start:"A6"},
  {word:"SNEASEL", dir:"across", start:"A8"},
  {word:"RAYQUAZA", dir:"down", start:"K2"},
  {word:"ABRA", dir:"down", start:"L2"},
  {word:"MEOWTH", dir:"down", start:"D4"},
  {word:"ONIX", dir:"down", start:"H6"},
];

// Create grid
const letters="ABCDEFGHIJKLMNO";
const gridEl = document.getElementById('grid');
const cells = [];

for(let r=1;r<=15;r++){
  for(let c=0;c<15;c++){
    const coord = letters[c]+r;
    const div = document.createElement('div');
    div.classList.add('cell');
    div.dataset.coord=coord;
    gridEl.appendChild(div);
    cells.push(div);
  }
}

// Black tiles (blocked) - example borders
cells.forEach(c=>{
  const col = c.dataset.coord.charCodeAt(0)-65;
  const row = parseInt(c.dataset.coord.slice(1))-1;
  if(row===0||row===14||col===0||col===14){ c.classList.add('black'); }
});

// Place words
words.forEach((w,i)=>{
  let col = w.start[0].charCodeAt(0)-65;
  let row = parseInt(w.start.slice(1))-1;
  for(let j=0;j<w.word.length;j++){
    const r = row + (w.dir==='down'?j:0);
    const c = col + (w.dir==='across'?j:0);
    const cell = cells.find(x=>x.dataset.coord===letters[c]+(r+1));
    if(cell){
      cell.dataset.answer=w.word[j];
      cell.dataset.clueNum=i+1;
      cell.dataset.clueDir=w.dir;
      if(j===0){ 
        const span = document.createElement('span'); 
        span.classList.add('number'); 
        span.textContent=i+1; 
        cell.appendChild(span);
      }
    }
  }
});

// Clues
const acrossUl = document.getElementById('across');
const downUl = document.getElementById('down');

words.forEach((w,i)=>{
  const li = document.createElement('li');
  li.textContent=`${i+1}. ${w.word}`;
  li.dataset.clue = i+1;
  li.dataset.dir = w.dir;
  if(w.dir==='across') acrossUl.appendChild(li);
  else downUl.appendChild(li);
});

// State
let state = {clue:null,dir:null,cursor:0,group:[]};
const errorToggle = document.getElementById('errorToggle');

function clearVisual(){
  cells.forEach(c=>c.classList.remove('highlight','cursor','error'));
  document.querySelectorAll('#clues li').forEach(li=>li.classList.remove('current'));
}

function highlightClue(num,dir){
  clearVisual();
  const group = cells.filter(c=>+c.dataset.clueNum===+num && c.dataset.clueDir===dir);
  group.forEach(c=>c.classList.add('highlight'));
  if(group[0]) group[0].classList.add('cursor');
  const li = document.querySelector(`#clues li[data-clue='${num}'][data-dir='${dir}']`);
  if(li) li.classList.add('current');
  state = {clue:num,dir, cursor:0, group};
}

// Click on clues
document.querySelectorAll('#clues li').forEach(li=>{
  li.addEventListener('click',()=>highlightClue(+li.dataset.clue,li.dataset.dir));
});

// Click on cells
cells.forEach(c=>{
  c.addEventListener('click',()=>{
    if(c.dataset.clueNum) highlightClue(+c.dataset.clueNum,c.dataset.clueDir);
  });
});

// Typing & navigation
document.addEventListener('keydown', e=>{
  if(!state.group.length) return;
  const g = state.group;
  if(e.key.length===1 && /[a-z]/i.test(e.key)){
    const cell = g[state.cursor];
    if(cell){ cell.textContent = e.key.toUpperCase(); if(cell.querySelector('.number')) cell.appendChild(cell.querySelector('.number')); }
    if(state.cursor<g.length-1) state.cursor++;
    updateCursor();
    checkErrors();
    e.preventDefault(); return;
  }
  if(e.key==='Backspace'){
    const cell = g[state.cursor];
    if(cell) cell.textContent=''; if(cell.querySelector('.number')) cell.appendChild(cell.querySelector('.number'));
    if(state.cursor>0) state.cursor--;
    updateCursor();
    checkErrors();
    e.preventDefault(); return;
  }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ if(state.cursor<g.length-1) state.cursor++; updateCursor(); e.preventDefault(); return; }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ if(state.cursor>0) state.cursor--; updateCursor(); e.preventDefault(); return; }
});

function updateCursor(){
  cells.forEach(c=>c.classList.remove('cursor'));
  if(state.group.length) state.group[state.cursor].classList.add('cursor');
}

function checkErrors(){
  if(!errorToggle.checked) return;
  cells.forEach(c=>{
    if(c.dataset.answer){
      const txt = (c.textContent||'').replace(/\d+/,'').trim().toUpperCase();
      c.classList.toggle('error', txt && txt!==c.dataset.answer);
    }
  });
}

// Start button
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  document.getElementById('wrapper').style.display='flex';
});
</script>

</body>
</html>
