<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gen-1 Pokémon 10×10 — Working Mini Crossword</title>
<style>
  :root{
    --bg:#0b1220;
    --panel:#0f1724;
    --accent:#3a8dff;
  }
  html,body{height:100%;margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:#e6eef8}
  /* Title overlay */
  #titleScreen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(3,6,12,0.92);z-index:50;
  }
  #titleScreen h1{margin:0 0 8px 0;font-size:28px}
  #titleScreen p{margin:0 0 18px 0;opacity:0.9}
  button{background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:15px}
  button:hover{filter:brightness(1.08)}
  /* Game wrapper */
  #gameArea{display:flex;gap:24px;align-items:flex-start;justify-content:center;padding:28px;min-height:100vh;box-sizing:border-box}
  #leftCol{display:flex;flex-direction:column;align-items:center;gap:12px}
  #timer{font-size:14px;opacity:0.95}
  /* Grid */
  main#grid{
    display:grid;
    grid-template-columns:repeat(10, 38px);
    grid-template-rows:repeat(10, 38px);
    gap:4px;
    background:transparent;
    padding:6px;
    box-sizing:border-box;
  }
  ins,del{
    width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-weight:600;letter-spacing:1px;position:relative;
  }
  del{background:#000}
  ins{
    background:#fff;color:#111;border:1px solid #9aa3ad;cursor:text;text-transform:uppercase;
    user-select:none;
  }
  ins[data-clue]:before{
    content:attr(data-clue);
    position:absolute;left:4px;top:3px;font-size:10px;color:#444;font-weight:600;
  }
  .highlight{background:#d8f1ff !important}
  .cursor{box-shadow:inset 0 0 0 3px #3399ff}
  .error{background:#ffb3b3 !important}
  /* Clue panel */
  #rightCol{width:320px;background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;box-sizing:border-box;min-height:fit-content}
  .panelTitle{font-weight:700;margin-bottom:8px}
  .controls{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  label{font-size:13px}
  ul{padding:0;margin:0;list-style:none}
  li.heading{font-weight:700;margin-top:8px;margin-bottom:6px}
  li[data-clue]{padding:6px 4px;border-radius:4px;cursor:pointer}
  li[data-clue].current{background:rgba(58,141,255,0.12);color:var(--accent)}
  /* win screen */
  #winScreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,12,0.92);z-index:60;flex-direction:column}
  #winScreen h1{font-size:28px;margin:0 0 8px 0}
  /* small responsive */
  @media (max-width:980px){
    #gameArea{flex-direction:column;align-items:center}
    #rightCol{width:90%}
  }
</style>
</head>
<body>

<!-- START OVERLAY -->
<div id="titleScreen" role="dialog" aria-modal="true">
  <h1>Gen-1 Pokémon Crossword</h1>
  <p>10×10 mini crossword — 8 Pokémon (4 across / 4 down)</p>
  <button id="startBtn">Start Game</button>
</div>

<!-- WIN OVERLAY -->
<div id="winScreen" role="dialog" aria-modal="true">
  <h1>🎉 You completed the crossword!</h1>
  <p id="finalTime"></p>
  <div style="margin-top:12px"><button id="restartBtn">Restart</button></div>
</div>

<!-- GAME AREA -->
<div id="gameArea" aria-hidden="true">
  <div id="leftCol">
    <div id="timer">Time: 0:00</div>
    <main id="grid" aria-label="Crossword grid">
      <!-- Row 1 (10 cells) -->
      <ins data-clues="across-1,down-1" data-answer="A" data-clue="1"></ins>
      <ins data-clues="across-1" data-answer="B"></ins>
      <ins data-clues="across-1" data-answer="R"></ins>
      <ins data-clues="across-1" data-answer="A"></ins>
      <del></del><del></del><del></del><del></del><del></del><del></del>

      <!-- Row 2 -->
      <ins data-clues="down-1" data-answer="L"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="across-2,down-2" data-answer="E" data-clue="2"></ins>
      <ins data-clues="across-2" data-answer="E"></ins>
      <ins data-clues="across-2" data-answer="V"></ins>
      <ins data-clues="across-2" data-answer="E"></ins>
      <ins data-clues="across-2" data-answer="E"></ins>
      <del></del><del></del>

      <!-- Row 3 -->
      <ins data-clues="down-1" data-answer="A"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="K"></ins>
      <del></del>
      <ins data-clues="across-3,down-3" data-answer="S" data-clue="3"></ins>
      <ins data-clues="across-3" data-answer="N"></ins>
      <ins data-clues="across-3" data-answer="E"></ins>
      <ins data-clues="across-3" data-answer="A"></ins>
      <ins data-clues="across-3" data-answer="S"></ins>
      <del></del>

      <!-- Row 4 -->
      <ins data-clues="down-1" data-answer="K"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="A"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="E"></ins>
      <del></del>
      <ins data-clues="across-4,down-4" data-answer="O" data-clue="4"></ins>
      <ins data-clues="across-4" data-answer="N"></ins>
      <del></del>

      <!-- Row 5 -->
      <ins data-clues="down-1" data-answer="A"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="C"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="M"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="I"></ins>
      <del></del><del></del>

      <!-- Row 6 -->
      <ins data-clues="down-1" data-answer="Z"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="H"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="A"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="R"></ins>
      <del></del><del></del>

      <!-- Row 7 -->
      <ins data-clues="down-1" data-answer="A"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="U"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="N"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="T"></ins>
      <del></del><del></del>

      <!-- Row 8 -->
      <ins data-clues="down-1" data-answer="M"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="C"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="D"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="L"></ins>
      <del></del><del></del>

      <!-- Row 9 -->
      <ins data-clues="down-1" data-answer="A"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="R"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="E"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="E"></ins>
      <del></del><del></del>

      <!-- Row 10 -->
      <ins data-clues="down-1" data-answer="M"></ins>
      <del></del><del></del><del></del>
      <ins data-clues="down-2" data-answer="A"></ins>
      <del></del>
      <ins data-clues="down-3" data-answer="R"></ins>
      <del></del>
      <ins data-clues="down-4" data-answer="T"></ins>
      <del></del><del></del>
    </main>
  </div>

  <div id="rightCol">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:700">Clues</div>
      <label><input type="checkbox" id="errorToggle" checked> Error check</label>
    </div>

    <div style="margin-top:10px;display:flex;gap:18px">
      <div style="flex:1">
        <ul id="across">
          <li class="heading">Across</li>
          <li data-dir="across" data-clue="1" data-length="4">1. ABRA</li>
          <li data-dir="across" data-clue="2" data-length="5">2. EEVEE</li>
          <li data-dir="across" data-clue="3" data-length="6">3. SNEASEL</li>
          <li data-dir="across" data-clue="4" data-length="2">4. ON</li>
        </ul>
      </div>
      <div style="flex:1">
        <ul id="down">
          <li class="heading">Down</li>
          <li data-dir="down" data-clue="1" data-length="8">1. ALAKAZAM</li>
          <li data-dir="down" data-clue="2" data-length="8">2. PIKACHU</li>
          <li data-dir="down" data-clue="3" data-length="10">3. CHARMANDER</li>
          <li data-dir="down" data-clue="4" data-length="8">4. SQUIRTLE</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------ START / TIMER ------------------ */
const startBtn = document.getElementById('startBtn');
const titleScreen = document.getElementById('titleScreen');
const gameArea = document.getElementById('gameArea');
const winScreen = document.getElementById('winScreen');
const restartBtn = document.getElementById('restartBtn');
const timerElem = document.getElementById('timer');
let seconds = 0, timerInterval;

startBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  gameArea.setAttribute('aria-hidden','false');
  gameArea.style.opacity = '1';
  seconds = 0;
  timerElem.textContent = 'Time: 0:00';
  timerInterval = setInterval(()=>{
    seconds++;
    const m = Math.floor(seconds/60);
    const s = seconds%60;
    timerElem.textContent = `Time: ${m}:${s<10?'0':''}${s}`;
  },1000);
});
restartBtn?.addEventListener('click', ()=> location.reload());

/* ------------------ GRID & CLUE MAPPING ------------------ */
const cells = Array.from(document.querySelectorAll('main ins'));
const clues = Array.from(document.querySelectorAll('li[data-clue]'));
const errorToggle = document.getElementById('errorToggle');

let state = { clue:null, dir:null, length:0, cursor:0 };

/* Helpers */
function clearVisual(){
  cells.forEach(c => c.classList.remove('highlight','cursor'));
  clues.forEach(l => l.classList.remove('current'));
}

/* Highlight a clue by scanning `data-clues` on each cell */
function highlight(clueNum, dir, length){
  clearVisual();
  cells.forEach((c, idx) => {
    if(!c.dataset.clues) return;
    const map = c.dataset.clues.split(',');
    for(const m of map){
      const [d,cl] = m.split('-');
      if(d===dir && parseInt(cl)===clueNum){
        c.classList.add('highlight');
      }
    }
  });
  state.length = length;
  state.cursor = 0;
  moveCursor();
}

/* Move cursor inside the set of highlighted cells */
function moveCursor(){
  cells.forEach(c => c.classList.remove('cursor'));
  const highlighted = cells.filter(c => c.classList.contains('highlight'));
  if(highlighted.length===0) return;
  const target = highlighted[state.cursor] || highlighted[highlighted.length-1];
  if(target) target.classList.add('cursor');
}

/* Check win */
function checkWin(){
  const allCorrect = cells.every(c => {
    if(!c.dataset.answer) return true; // black or not-answer cell
    const txt = (c.textContent || '').trim().toUpperCase();
    return txt && txt === c.dataset.answer;
  });
  if(allCorrect){
    clearInterval(timerInterval);
    // show win overlay
    document.getElementById('finalTime').textContent = timerElem.textContent;
    winScreen.style.display = 'flex';
  }
}

/* Click a clue in the list */
clues.forEach(li=>{
  li.addEventListener('click', function(){
    const clueNum = parseInt(this.dataset.clue);
    const dir = this.dataset.dir;
    const length = parseInt(this.dataset.length);
    state.clue = clueNum;
    state.dir = dir;
    highlight(clueNum, dir, length);
    clues.forEach(l=>l.classList.remove('current'));
    this.classList.add('current');
  });
});

/* Click a tile: if it has data-clues, toggle between the clues it belongs to */
cells.forEach(cell => {
  cell.addEventListener('click', () => {
    if(!cell.dataset.clues) return; // black or not part of any word
    const map = cell.dataset.clues.split(',');
    // if current clue is one of the map, switch to the other one (toggle)
    if(state.clue && map.some(m => m === `${state.dir}-${state.clue}`) && map.length>1){
      const alt = map.find(m => m !== `${state.dir}-${state.clue}`);
      const [d,cl] = alt.split('-');
      state.dir = d;
      state.clue = parseInt(cl);
      const li = document.querySelector(`li[data-clue="${cl}"][data-dir="${d}"]`);
      const len = li ? parseInt(li.dataset.length) : parseInt(li.dataset.length||0);
      highlight(state.clue, state.dir, len);
      clues.forEach(l=>l.classList.remove('current'));
      li && li.classList.add('current');
      return;
    }
    // otherwise pick the first clue for this tile
    const [d,cl] = map[0].split('-');
    state.dir = d; state.clue = parseInt(cl);
    const li = document.querySelector(`li[data-clue="${cl}"][data-dir="${d}"]`);
    const len = li ? parseInt(li.dataset.length) : parseInt(li.dataset.length||0);
    highlight(state.clue, state.dir, len);
    clues.forEach(l=>l.classList.remove('current'));
    li && li.classList.add('current');
  });
});

/* Keyboard handling: type letters for highlighted clue; auto-advance; backspace */
document.addEventListener('keydown', (e) => {
  if(!state.clue) return;
  const highlighted = cells.filter(c => c.classList.contains('highlight'));
  if(highlighted.length===0) return;

  // arrows
  if(e.key === 'ArrowRight' && state.dir === 'across'){
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    e.preventDefault();
    return;
  }
  if(e.key === 'ArrowLeft' && state.dir === 'across'){
    if(state.cursor > 0) state.cursor--;
    moveCursor();
    e.preventDefault();
    return;
  }
  if(e.key === 'ArrowDown' && state.dir === 'down'){
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    e.preventDefault();
    return;
  }
  if(e.key === 'ArrowUp' && state.dir === 'down'){
    if(state.cursor > 0) state.cursor--;
    moveCursor();
    e.preventDefault();
    return;
  }

  // letter input
  if(e.key.length === 1 && e.key.match(/[a-z]/i)){
    const target = highlighted[state.cursor];
    if(target){
      target.textContent = e.key.toUpperCase();
      // error check
      if(errorToggle.checked && target.dataset.answer && target.textContent !== target.dataset.answer) target.classList.add('error');
      else target.classList.remove('error');
    }
    if(state.cursor < highlighted.length-1) state.cursor++;
    moveCursor();
    checkWin();
    e.preventDefault();
    return;
  }

  // backspace
  if(e.key === 'Backspace'){
    const target = highlighted[state.cursor];
    if(target){
      target.textContent = '';
      target.classList.remove('error');
    }
    if(state.cursor > 0) state.cursor--;
    moveCursor();
    e.preventDefault();
    return;
  }
});

/* Keep error check behavior (checkbox toggles visual) */
errorToggle.addEventListener('change', () => {
  if(!errorToggle.checked){
    cells.forEach(c => c.classList.remove('error'));
    return;
  }
  // re-run check
  cells.forEach(c => {
    if(!c.dataset.answer) return;
    const txt = (c.textContent || '').trim().toUpperCase();
    if(txt && txt !== c.dataset.answer) c.classList.add('error');
    else c.classList.remove('error');
  });
});
</script>
</body>
</html>
